app            = "crumbs"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT                   = "8080"
  TZ                     = "Asia/Kolkata"
  SPRING_PROFILES_ACTIVE = "prod"

[vm]
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 2048

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = false
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 25
    hard_limit = 50

  # HTTP health check
  [[http_service.checks]]
    interval     = "15s"
    timeout      = "5s"
    grace_period = "60s"
    method       = "GET"
    path         = "/"

# Persistent volume for H2 file DB
[[mounts]]
  source      = "crumbs_data"
  destination = "/app/data"
  name        = "data"