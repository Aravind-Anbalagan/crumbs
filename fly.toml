app = "crumbs"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[vm]
  memory = 2048 # or 1024 (MB)

[[services]]
  internal_port = 8080
  protocol = "tcp"
  min_machines_running = 1
  max_machines_running = 1   # 🔴 THIS IS THE KEY LINE

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # HTTP health check
  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"   # allow extra time for app startup (Java apps can be slow)
    method = "get"
    path = "/"             # using root since you don’t have actuator
    protocol = "http"

# Persistent volume for H2 file DB
[[mounts]]
  source = "crumbs_data"
  destination = "/app/data"
