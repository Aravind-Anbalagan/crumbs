name: Railway VM Scheduler
on:
  schedule:
    # Start at 8:00 AM IST (2:30 UTC) Mon-Fri
    - cron: "30 2 * * 1-5"
    # Stop at 12:00 AM IST (18:30 UTC) Mon-Fri
    - cron: "30 18 * * 1-5"
  workflow_dispatch:
    inputs:
      action:
        description: "Choose whether to start or stop the VM"
        required: true
        default: "start"
        type: choice
        options:
          - start
          - stop

jobs:
  start-service:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'start') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 2 * * 1-5')
    steps:
      - name: Start Railway Service
        run: |
          echo "Starting Railway service at 8:00 AM IST..."
          curl -s -X POST "https://backboard.railway.app/graphql/v2" \
          -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{
            "query": "mutation { serviceInstanceUpdate(input: { numReplicas: 1 }, environmentId: \"${{ secrets.RAILWAY_ENVIRONMENT_ID }}\", serviceId: \"${{ secrets.RAILWAY_SERVICE_ID }}\") }"
          }'
          echo "Start request sent."

  stop-service:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'stop') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 18 * * 1-5')
    steps:
      - name: Stop Railway Service
        run: |
          echo "Stopping Railway service at 12:00 AM IST..."
          curl -s -X POST "https://backboard.railway.app/graphql/v2" \
          -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{
            "query": "mutation { serviceInstanceUpdate(input: { numReplicas: 0 }, environmentId: \"${{ secrets.RAILWAY_ENVIRONMENT_ID }}\", serviceId: \"${{ secrets.RAILWAY_SERVICE_ID }}\" ) }"
          }'
          echo "Stop request sent."