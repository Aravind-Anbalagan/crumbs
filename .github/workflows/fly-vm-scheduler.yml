name: Fly VM Scheduler
on:
  schedule:
    # Trigger at 5:00 AM IST (23:30 UTC) → Actually starts ~8:00 AM IST
    - cron: "30 23 * * *"
    # Stop VM at 12:00 AM IST (18:30 UTC)
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Choose whether to start or stop the VM"
        required: true
        default: "start"
        type: choice
        options:
          - start
          - stop

jobs:
  start-vm:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'start') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 23 * * *')
    steps:
      - name: Start Fly.io VM
        run: |
          echo "Starting Fly.io VM..."
          curl -s -X POST "https://api.machines.dev/v1/apps/crumbs/machines/81107ef9746418/start" \
          -H "Authorization: Bearer ${{ secrets.FLY_API_TOKEN }}" \
          -H "Content-Type: application/json"
          echo "Start request sent."

  stop-vm:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'stop') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 18 * * *')
    steps:
      - name: Stop Fly.io VM
        run: |
          echo "Stopping Fly.io VM..."
          curl -s -X POST "https://api.machines.dev/v1/apps/crumbs/machines/81107ef9746418/stop" \
          -H "Authorization: Bearer ${{ secrets.FLY_API_TOKEN }}" \
          -H "Content-Type: application/json"
          echo "Stop request sent."