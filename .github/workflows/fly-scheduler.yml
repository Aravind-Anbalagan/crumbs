# .github/workflows/fly-vm-scheduler.yml
name: Fly VM Scheduler (Machines API)

on:
  schedule:
    # Stop at 11:30 PM IST → 18:00 UTC
    - cron: "30 18 * * 1-5"
    # Start at 8:00 AM IST → 02:30 UTC
    - cron: "30 2 * * 1-5"

  workflow_dispatch: # 👈 allows manual run from GitHub UI

jobs:
  control-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Stop VM (Night Schedule)
        if: github.event_name == 'schedule' && github.event.schedule == '30 18 * * 1-5'
        run: |
          echo "Stopping Fly.io VM..."
          curl -X POST "https://api.machines.dev/v1/apps/crumbs/machines/080169ea13d328/stop" \
          -H "Authorization: Bearer ${{ secrets.FLY_API_TOKEN }}" \
          -H "Content-Type: application/json"

      - name: Start VM (Morning Schedule)
        if: github.event_name == 'schedule' && github.event.schedule == '30 2 * * 1-5'
        run: |
          echo "Starting Fly.io VM..."
          curl -X POST "https://api.machines.dev/v1/apps/crumbs/machines/080169ea13d328/start" \
          -H "Authorization: Bearer ${{ secrets.FLY_API_TOKEN }}" \
          -H "Content-Type: application/json"

      - name: Manual Stop VM
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'stop'
        run: |
          echo "Stopping Fly.io VM (manual trigger)..."
          curl -X POST "https://api.machines.dev/v1/apps/crumbs/machines/080169ea13d328/stop" \
          -H "Authorization: Bearer ${{ secrets.FLY_API_TOKEN }}" \
          -H "Content-Type: application/json"

      - name: Manual Start VM
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'start'
        run: |
          echo "Starting Fly.io VM (manual trigger)..."
          curl -X POST "https://api.machines.dev/v1/apps/crumbs/machines/080169ea13d328/start" \
          -H "Authorization: Bearer ${{ secrets.FLY_API_TOKEN }}" \
          -H "Content-Type: application/json"
