<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nifty — CE/PE Chart</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    * { box-sizing: border-box; }
    html,body{ height:100%; margin:0; padding:0; font-family:Inter, ui-sans-serif, system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial; }
    body{ background:linear-gradient(180deg,#071021 0%, #071a2b 100%); color:#e6eef8; padding:16px; transition:all 0.25s ease; }
    .container{ max-width:100%; width:100%; margin:0 auto; overflow-x:hidden; }
    .card{ width:100%; background:#0b1320; border-radius:12px; padding:16px; border:1px solid rgba(255,255,255,0.03); margin-bottom:16px; box-shadow:0 8px 30px rgba(2,6,23,0.6); position:relative; }
    .header{ display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:8px; }
    #chart{ height:520px; width:100%; }
    .chart-fullscreen {
      position: fixed !important;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      z-index: 100000;
      border-radius: 0 !important;
      padding: 8px !important;
    }
    .btn-icon {
      position: absolute;
      right: 12px;
      top: 12px;
      background: rgba(0,0,0,0.4);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 99999;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-icon:hover { background: rgba(0,0,0,0.6); }

    .legend{ display:flex; gap:12px; margin-top:10px; flex-wrap:wrap; align-items:center; }
    .legend .item{ display:flex; align-items:center; gap:8px; font-size:13px; color:#94a3b8; transition: opacity 0.2s; }
    .legend .item.hidden { opacity: 0.3; }
    .swatch{ width:12px; height:6px; border-radius:3px; display:inline-block; }

    .checkout-dropdown{ position:relative; z-index:999999; }
    .checkout-btn{ padding:6px 12px; border-radius:6px; background:rgba(59,130,246,0.08); border:1px solid rgba(59,130,246,0.12); cursor:pointer; font-size:13px; color:#60a5fa; transition: all 0.2s; }
    .checkout-btn:hover { background:rgba(59,130,246,0.12); }
    .checkout-menu{ position:absolute; top:100%; right:0; background:#0b1320; border:1px solid rgba(255,255,255,0.03); border-radius:8px; min-width:260px; padding:12px; transform:translateY(-10px); opacity:0; visibility:hidden; transition:0.18s; box-shadow:0 8px 25px rgba(0,0,0,0.4); margin-top:4px; }
    .checkout-menu.show{ transform:translateY(0); opacity:1; visibility:visible; }
    .checkout-item{ display:flex; gap:8px; align-items:center; padding:6px 8px; font-size:13px; border-radius:4px; color:#94a3b8; cursor:pointer; }
    .checkout-item:hover{ background:rgba(255,255,255,0.02); }
    .checkout-item input[type="checkbox"] { cursor: pointer; }

    .toggle-container{ display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:8px; cursor:pointer; background:rgba(148,163,184,0.03); border:1px solid rgba(148,163,184,0.03); transition: all 0.2s; }
    .toggle-container:hover { background:rgba(148,163,184,0.05); }
    .toggle-label{ font-size:13px; font-weight:600; color:#94a3b8; user-select: none; }
    .toggle-switch{ width:46px; height:24px; border-radius:24px; border:1px solid rgba(148,163,184,0.25); position:relative; background:rgba(148,163,184,0.06); transition: all 0.2s; }
    .toggle-switch.active{ background:rgba(34,197,94,0.14); border-color:rgba(34,197,94,0.35); }
    .toggle-switch::before{ content:''; position:absolute; width:16px; height:16px; border-radius:50%; top:4px; left:4px; background:#94a3b8; transition:all .18s; }
    .toggle-switch.active::before{ transform:translateX(22px); background:#22c55e; }

    .crossings-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px; margin-top:10px; }
    .crossing-item{ padding:10px; border-radius:8px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.03); cursor:pointer; color:#cbd5e1; transition: all 0.2s; }
    .crossing-item:hover { background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.06); }
    .crossing-item.highlighted { background:rgba(34,197,94,0.1); border-color:rgba(34,197,94,0.3); }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-left: 8px;
      animation: pulse 2s infinite;
    }
    .status-indicator.live { background: #22c55e; }
    .status-indicator.error { background: #ef4444; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    select { 
      padding: 6px 10px; 
      border-radius: 6px; 
      background: rgba(148,163,184,0.05); 
      border: 1px solid rgba(148,163,184,0.1); 
      color: #e6eef8;
      cursor: pointer;
      font-size: 13px;
    }
    select:focus { outline: none; border-color: rgba(59,130,246,0.3); }

    .no-crossings { padding: 20px; text-align: center; color: #64748b; font-size: 14px; }

    .last-update { 
      font-size: 11px; 
      color: #64748b; 
      margin-left: auto; 
      display: flex; 
      align-items: center; 
      gap: 6px;
    }
.card.chart-fullscreen #chart {
  height: calc(100vh - 80px) !important; 
}
select {
  position: relative !important;
  z-index: 300000 !important;
}

select option {
  background-color: #0b1320 !important;
  color: #e6eef8 !important;
}

    @media (max-width:900px){
      .header{ gap:8px; font-size: 12px; }
      .checkout-menu{ min-width:200px; }
      #chart { height: 400px; }
      .legend { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <button id="btn-max-chart" class="btn-icon">⛶</button>

      <div class="header">
        <div class="toggle-container" id="theme-toggle">
          <span class="toggle-label">Dark</span>
          <div class="toggle-switch active" id="theme-switch"></div>
        </div>

        <div class="toggle-container" id="auto-update-toggle">
          <span class="toggle-label" id="auto-update-label">Auto: ON</span>
          <div class="toggle-switch active" id="auto-update-switch"></div>
        </div>

        <div class="toggle-container" id="toggle-container">
          <span class="toggle-label">Crossovers</span>
          <div class="toggle-switch" id="toggle-switch"></div>
        </div>

        <div class="checkout-dropdown">
          <button class="checkout-btn" id="checkout-btn">⋮ Lines</button>
          <div class="checkout-menu" id="checkout-menu">
            <div class="checkout-item"><input type="checkbox" id="spot-check" checked> <span class="swatch" style="background:#22c55e"></span> Spot</div>
            <div class="checkout-item"><input type="checkbox" id="ce-check" checked> <span class="swatch" style="background:#3b82f6"></span> CE</div>
            <div class="checkout-item"><input type="checkbox" id="pe-check" checked> <span class="swatch" style="background:#ef4444"></span> PE</div>
            <div class="checkout-item"><input type="checkbox" id="combined-premium-check" checked> <span class="swatch" style="background:#fb7185"></span> Combined Premium</div>
            <div class="checkout-item"><input type="checkbox" id="avg-check" checked> <span class="swatch" style="background:#14b8a6"></span> Avg Price</div>
            <div class="checkout-item"><input type="checkbox" id="extrinsic-check" checked> <span class="swatch" style="background:#eab308"></span> Extrinsic</div>
            <hr style="margin:8px 0;border:none;border-top:1px solid rgba(255,255,255,0.03)"/>
            <div class="checkout-item"><input type="checkbox" id="ce-open-check" checked> <span class="swatch" style="background:#d97706"></span> CE Open</div>
            <div class="checkout-item"><input type="checkbox" id="pe-open-check" checked> <span class="swatch" style="background:#7e22ce"></span> PE Open</div>
            <div class="checkout-item"><input type="checkbox" id="combined-open-check" checked> <span class="swatch" style="background:#0284c7"></span> Combined Open</div>
          </div>
        </div>

        <label style="color:#94a3b8">Name</label><select id="name-select"></select>
        <label style="color:#94a3b8">Expiry</label><select id="expiry-select"></select>
        <label style="color:#94a3b8">CE</label><select id="ce-strike-select"></select>
        <label style="color:#94a3b8">PE</label><select id="pe-strike-select"></select>

        <button id="btn-reset" style="padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.03);background:transparent;color:#60a5fa;cursor:pointer">Reset</button>
        
        <div class="last-update">
          <span id="last-update-time">--:--:--</span>
          <span class="status-indicator live" id="status-indicator"></span>
        </div>
      </div>

      <div id="chart"></div>

      <div class="legend" id="bottom-legend">
        <div class="item" data-line="spot"><span class="swatch" style="background:#22c55e"></span> Spot: <strong id="val-spot">-</strong></div>
        <div class="item" data-line="ce"><span class="swatch" style="background:#3b82f6"></span> CE: <strong id="val-ce">-</strong></div>
        <div class="item" data-line="pe"><span class="swatch" style="background:#ef4444"></span> PE: <strong id="val-pe">-</strong></div>
        <div class="item" data-line="combinedPremium"><span class="swatch" style="background:#fb7185"></span> Combined: <strong id="val-combined-premium">-</strong></div>
        <div class="item" data-line="avgPrice"><span class="swatch" style="background:#14b8a6"></span> Avg: <strong id="val-avg">-</strong></div>
        <div class="item" data-line="extrinsic"><span class="swatch" style="background:#eab308"></span> Extrinsic: <strong id="val-extrinsic">-</strong></div>
        <div class="item" data-line="ceOpen"><span class="swatch" style="background:#d97706"></span> CE Open: <strong id="val-ce-open">-</strong></div>
        <div class="item" data-line="peOpen"><span class="swatch" style="background:#7e22ce"></span> PE Open: <strong id="val-pe-open">-</strong></div>
        <div class="item" data-line="combinedOpen"><span class="swatch" style="background:#0284c7"></span> Comb Open: <strong id="val-combined-open">-</strong></div>
      </div>
    </div>

    <div class="card">
      <div style="color:#cbd5e1;font-weight:600;margin-bottom:8px">CE-PE Crossovers</div>
      <div id="crossings-container" class="crossings-grid"></div>
    </div>
  </div>

  <script>
    const API_URL = '/api/straddle/combined-chart';
    const GROUPED_API_URL = '/api/straddle/grouped';
    const API_PARAMS = { name: 'NIFTY', expiry: '16DEC25', ceStrike: '26000', peStrike: '26000' };
    const IST_OFFSET_SECONDS = 5.5 * 60 * 60;

    let groupedData = [];
    let apiData = [];
    let currentSeries = {
      spotSeries: [], ceSeries: [], peSeries: [], combinedPremiumSeries: [],
      extrinsicSeries: [], avgPriceSeries: [], ceOpen: null, peOpen: null, combinedOpen: null
    };

    let allCrossings = [];
    let crossoverEnabled = false;
    let isDarkTheme = false;
    let autoRefreshInterval = null;
    let autoUpdateEnabled = true;
    let lineVisibility = {
      spot: true, ce: true, pe: true, combinedPremium: true,
      avgPrice: true, extrinsic: true, ceOpen: true, peOpen: true, combinedOpen: true
    };

    function toUnixSeconds(isoString) {
      return Math.floor(new Date(isoString).getTime() / 1000) + IST_OFFSET_SECONDS;
    }

    function showError(message) {
      document.getElementById('crossings-container').innerHTML = `<div class="no-crossings">${message}</div>`;
      document.getElementById('status-indicator').className = 'status-indicator error';
    }

    function updateLastUpdateTime() {
      const now = new Date();
      document.getElementById('last-update-time').textContent = now.toLocaleTimeString('en-IN', { 
        timeZone: 'Asia/Kolkata', hour12: false 
      });
    }

    function transformToSeries(apiArray) {
      const series = { spot: [], ce: [], pe: [], combinedPremium: [], extrinsic: [], avgPrice: [] };

      for (const row of apiArray) {
        const t = toUnixSeconds(row.timestamp);
        if (!isFinite(t) || row.spot == null) continue;

        const vals = {
          spot: Number(row.spot),
          ce: Number(row.ce),
          pe: Number(row.pe),
          combinedPremium: row.combinedPremium != null ? Number(row.combinedPremium) : null,
          extrinsic: row.extrinsic != null ? Number(row.extrinsic) : null,
          avgPrice: row.avgPrice != null ? Number(row.avgPrice) : null
        };

        if (!Number.isFinite(vals.spot)) continue;

        series.spot.push({ time: t, value: vals.spot });
        if (Number.isFinite(vals.ce)) series.ce.push({ time: t, value: vals.ce });
        if (Number.isFinite(vals.pe)) series.pe.push({ time: t, value: vals.pe });
        if (vals.combinedPremium != null && Number.isFinite(vals.combinedPremium)) 
          series.combinedPremium.push({ time: t, value: vals.combinedPremium });
        if (vals.extrinsic != null && Number.isFinite(vals.extrinsic)) 
          series.extrinsic.push({ time: t, value: vals.extrinsic });
        if (vals.avgPrice != null && Number.isFinite(vals.avgPrice)) 
          series.avgPrice.push({ time: t, value: vals.avgPrice });
      }

      if (apiArray.length > 0) {
        const first = apiArray[0];
        currentSeries.ceOpen = Number.isFinite(Number(first.ceOpen)) ? Number(first.ceOpen) : null;
        currentSeries.peOpen = Number.isFinite(Number(first.peOpen)) ? Number(first.peOpen) : null;
        currentSeries.combinedOpen = Number.isFinite(Number(first.combinedOpen)) ? Number(first.combinedOpen) : null;
      }

      Object.assign(currentSeries, {
        spotSeries: series.spot, ceSeries: series.ce, peSeries: series.pe,
        combinedPremiumSeries: series.combinedPremium,
        extrinsicSeries: series.extrinsic, avgPriceSeries: series.avgPrice
      });

      return series;
    }

    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
      layout: { backgroundColor: '#071421', textColor: '#dbeafe' },
      rightPriceScale: { borderVisible: false, visible: true },
      leftPriceScale: { borderVisible: false, visible: true },
      timeScale: {
        borderVisible: false, timeVisible: true, secondsVisible: true,
        tickMarkFormatter: (time) => {
          const istDate = new Date((time - IST_OFFSET_SECONDS) * 1000);
          return istDate.toLocaleTimeString('en-IN', { 
            timeZone: 'Asia/Kolkata', hour12: false, 
            hour: '2-digit', minute: '2-digit', second: '2-digit' 
          });
        }
      },
      grid: { vertLines: { visible: false }, horzLines: { color: 'rgba(255,255,255,0.03)' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
    });

    const lines = {
      spot: chart.addLineSeries({ priceLineVisible: false, lastValueVisible: true, lineWidth: 3, color: '#22c55e', priceScaleId: 'left' }),
      ce: chart.addLineSeries({ priceLineVisible: false, lastValueVisible: true, lineWidth: 3, color: '#3b82f6', priceScaleId: 'right' }),
      pe: chart.addLineSeries({ priceLineVisible: false, lastValueVisible: true, lineWidth: 3, color: '#ef4444', priceScaleId: 'right' }),
      combinedPremium: chart.addLineSeries({ priceLineVisible: false, lastValueVisible: true, lineWidth: 2.5, color: '#fb7185', priceScaleId: 'right' }),
      avgPrice: chart.addLineSeries({ priceLineVisible: false, lastValueVisible: true, lineWidth: 2, color: '#14b8a6', priceScaleId: 'right' }),
      extrinsic: chart.addLineSeries({ priceLineVisible: false, lastValueVisible: true, lineWidth: 2, color: '#eab308', priceScaleId: 'right' }),
      ceOpen: chart.addLineSeries({ priceLineVisible: false, lastValueVisible: false, lineWidth: 1, color: '#d97706', lineStyle: 2, priceScaleId: 'right' }),
      peOpen: chart.addLineSeries({ priceLineVisible: false, lastValueVisible: false, lineWidth: 1, color: '#7e22ce', lineStyle: 1, priceScaleId: 'right' }),
      combinedOpen: chart.addLineSeries({ priceLineVisible: false, lastValueVisible: false, lineWidth: 1, color: '#0284c7', lineStyle: 2, priceScaleId: 'right' })
    };

    function updateChartTheme() {
      const bgColor = isDarkTheme ? '#071421' : '#ffffff';
      const textColor = isDarkTheme ? '#dbeafe' : '#1e293b';
      const gridColor = isDarkTheme ? 'rgba(255,255,255,0.03)' : '#f1f5f9';

      chart.applyOptions({
        layout: { backgroundColor: bgColor, textColor: textColor },
        grid: { vertLines: { visible: false }, horzLines: { color: gridColor } }
      });
    }

    function drawOpenPriceLines() {
      const timestamps = currentSeries.spotSeries.map(p => p.time);
      if (!timestamps.length) {
        lines.ceOpen.setData([]);
        lines.peOpen.setData([]);
        lines.combinedOpen.setData([]);
        return;
      }

      const opens = {
        ceOpen: Number(currentSeries.ceOpen),
        peOpen: Number(currentSeries.peOpen),
        combinedOpen: Number(currentSeries.combinedOpen)
      };

      Object.keys(opens).forEach(key => {
        if (lineVisibility[key] && Number.isFinite(opens[key])) {
          lines[key].setData(timestamps.map(t => ({ time: t, value: opens[key] })));
        } else {
          lines[key].setData([]);
        }
      });
    }

    function updateLegendVisibility() {
      document.querySelectorAll('.legend .item').forEach(item => {
        const lineKey = item.dataset.line;
        if (lineKey && !lineVisibility[lineKey]) {
          item.classList.add('hidden');
        } else {
          item.classList.remove('hidden');
        }
      });
    }

    function updateLegendLatest() {
      const values = {};
      ['spot', 'ce', 'pe', 'combinedPremium', 'avgPrice', 'extrinsic'].forEach(key => {
        const data = currentSeries[key + 'Series'];
        values[key] = data.length > 0 ? data[data.length - 1].value : null;
      });

      document.getElementById('val-spot').textContent = values.spot !== null ? values.spot.toFixed(2) : '-';
      document.getElementById('val-ce').textContent = values.ce !== null ? values.ce.toFixed(2) : '-';
      document.getElementById('val-pe').textContent = values.pe !== null ? values.pe.toFixed(2) : '-';
      document.getElementById('val-combined-premium').textContent = values.combinedPremium !== null ? values.combinedPremium.toFixed(2) : '-';
      document.getElementById('val-avg').textContent = values.avgPrice !== null ? values.avgPrice.toFixed(2) : '-';
      document.getElementById('val-extrinsic').textContent = values.extrinsic !== null ? values.extrinsic.toFixed(2) : '-';

      document.getElementById('val-ce-open').textContent = Number.isFinite(currentSeries.ceOpen) ? currentSeries.ceOpen.toFixed(2) : '-';
      document.getElementById('val-pe-open').textContent = Number.isFinite(currentSeries.peOpen) ? currentSeries.peOpen.toFixed(2) : '-';
      document.getElementById('val-combined-open').textContent = Number.isFinite(currentSeries.combinedOpen) ? currentSeries.combinedOpen.toFixed(2) : '-';

      updateLegendVisibility();
    }

    function updateLegendAtCrosshair(param) {
      if (!param || !param.time || !param.point || param.point.x < 0 || param.point.y < 0) {
        updateLegendLatest();
        return;
      }

      const getData = (line) => param.seriesData.get(line);
      const getValue = (data) => data && data.value !== undefined ? data.value : null;

      const values = {
        spot: getValue(getData(lines.spot)),
        ce: getValue(getData(lines.ce)),
        pe: getValue(getData(lines.pe)),
        combinedPremium: getValue(getData(lines.combinedPremium)),
        avgPrice: getValue(getData(lines.avgPrice)),
        extrinsic: getValue(getData(lines.extrinsic)),
        ceOpen: getValue(getData(lines.ceOpen)) ?? currentSeries.ceOpen,
        peOpen: getValue(getData(lines.peOpen)) ?? currentSeries.peOpen,
        combinedOpen: getValue(getData(lines.combinedOpen)) ?? currentSeries.combinedOpen
      };

      const fmt = (v) => v !== null && Number.isFinite(v) ? v.toFixed(2) : '-';

      document.getElementById('val-spot').textContent = fmt(values.spot);
      document.getElementById('val-ce').textContent = fmt(values.ce);
      document.getElementById('val-pe').textContent = fmt(values.pe);
      document.getElementById('val-combined-premium').textContent = fmt(values.combinedPremium);
      document.getElementById('val-avg').textContent = fmt(values.avgPrice);
      document.getElementById('val-extrinsic').textContent = fmt(values.extrinsic);
      document.getElementById('val-ce-open').textContent = fmt(values.ceOpen);
      document.getElementById('val-pe-open').textContent = fmt(values.peOpen);
      document.getElementById('val-combined-open').textContent = fmt(values.combinedOpen);
    }

    function detectCrossovers(s1, s2, n1, n2) {
      const crossings = [];
      if (s1.length < 2 || s2.length < 2) return crossings;
      
      for (let i = 1; i < Math.min(s1.length, s2.length); i++) {
        const [prev1, curr1, prev2, curr2] = [s1[i-1].value, s1[i].value, s2[i-1].value, s2[i].value];
        if (![prev1, curr1, prev2, curr2].every(v => isFinite(v))) continue;
        
        const crossedUp = prev1 < prev2 && curr1 > curr2;
        const crossedDown = prev1 > prev2 && curr1 < curr2;
        
        if (crossedUp || crossedDown) {
          const [t1, t2] = [s1[i-1].time, s1[i].time];
          const ratio = Math.abs(prev2 - prev1) / (Math.abs(curr1 - prev2) + Math.abs(prev2 - prev1) || 1);
          const time = t1 + (t2 - t1) * ratio;
          const price = prev1 + (curr1 - prev1) * ratio;
          
          crossings.push({
            time, price, gap: 0,
            type: crossedUp ? `${n1} crosses above ${n2}` : `${n1} crosses below ${n2}`,
            pair: `${n1}-${n2}`,
            direction: crossedUp ? 'up' : 'down',
            ceValue: n1 === 'CE' ? curr1 : curr2,
            peValue: n1 === 'PE' ? curr1 : curr2
          });
        }
      }
      return crossings;
    }

    function addCrossingMarkers() {
      if (!lineVisibility.ce) return;
      const markers = allCrossings.map(c => ({ 
        time: c.time, position: 'inBar', color: '#f472b6', shape: 'circle' 
      }));
      lines.ce.setMarkers(markers);
    }

    function clearCrossingMarkers() { lines.ce.setMarkers([]); }

    function updateCrossingsDisplay() {
      const container = document.getElementById('crossings-container');
      if (allCrossings.length === 0) {
        container.innerHTML = '<div class="no-crossings">No crossovers detected yet.</div>';
        return;
      }
      
      container.innerHTML = allCrossings.map((c, i) => {
        const istDate = new Date((c.time - IST_OFFSET_SECONDS) * 1000);
        const timeStr = istDate.toLocaleTimeString('en-IN', { 
          timeZone: 'Asia/Kolkata', hour12: false, 
          hour: '2-digit', minute: '2-digit', second: '2-digit' 
        });
        
        return `
          <div class="crossing-item" data-crossing-index="${i}">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div style="font-weight:600;font-size:12px">CE-PE Cross</div>
              <div style="color:#94a3b8;font-size:11px">${timeStr}</div>
            </div>
            <div style="font-weight:600;margin-top:6px">CE: ₹${c.ceValue.toFixed(2)} | PE: ₹${c.peValue.toFixed(2)}</div>
            <div style="color:#94a3b8;font-size:12px;margin-top:6px">${c.type}</div>
          </div>
        `;
      }).join('');
      
      container.querySelectorAll('.crossing-item').forEach((item, i) => {
        item.addEventListener('click', () => {
          container.querySelectorAll('.crossing-item').forEach(el => el.classList.remove('highlighted'));
          item.classList.add('highlighted');
          highlightCrossingOnChart(allCrossings[i]);
        });
      });
    }

    function highlightCrossingOnChart(crossing) {
      const markers = allCrossings.map(c => {
        const isSelected = c.time === crossing.time && c.type === crossing.type;
        return {
          time: c.time,
          position: 'inBar',
          color: isSelected ? '#22c55e' : '#f472b6',
          shape: 'circle',
          size: isSelected ? 2 : 1,
          text: isSelected ? `CE: ₹${c.ceValue.toFixed(2)} = PE: ₹${c.peValue.toFixed(2)}` : undefined
        };
      });

      lines.ce.setMarkers(markers);

      const visibleRange = chart.timeScale().getVisibleRange();
      if (!visibleRange || crossing.time < visibleRange.from || crossing.time > visibleRange.to) {
        chart.timeScale().setVisibleRange({ from: crossing.time - 300, to: crossing.time + 300 });
      }
    }

    async function fetchDataFromAPI() {
      try {
        const params = new URLSearchParams(API_PARAMS);
        const response = await fetch(`${API_URL}?${params}`);
        if (!response.ok) throw new Error(`API failed: ${response.status}`);
        const result = await response.json();
        document.getElementById('status-indicator').className = 'status-indicator live';
        updateLastUpdateTime();
        return result.data || [];
      } catch (err) {
        console.error('Error fetching data:', err);
        showError('Error fetching data. Please try again.');
        return [];
      }
    }

    async function loadGroupedData() {
      try {
        const res = await fetch(GROUPED_API_URL);
        if (!res.ok) throw new Error('Grouped API failed: ' + res.status);
        groupedData = await res.json();
        populateNameSelect();
      } catch (err) {
        console.error('Error loading grouped data', err);
      }
    }

    function populateNameSelect() {
      const sel = document.getElementById('name-select');
      sel.innerHTML = groupedData.map(item => 
        `<option value="${item.name}">${item.name}</option>`
      ).join('');
      API_PARAMS.name = sel.value;
      populateExpirySelect();
    }

    function populateExpirySelect() {
      const nameSel = document.getElementById('name-select');
      const expirySel = document.getElementById('expiry-select');
      const selected = groupedData.find(x => x.name === nameSel.value);
      const expiries = selected ? Object.keys(selected.expiries) : [];
      
      expirySel.innerHTML = expiries.map(exp => 
        `<option value="${exp}">${exp}</option>`
      ).join('');
      API_PARAMS.expiry = expirySel.value;
      populateStrikeSelects();
    }

    function populateStrikeSelects() {
      const nameSel = document.getElementById('name-select');
      const expirySel = document.getElementById('expiry-select');
      const ceSel = document.getElementById('ce-strike-select');
      const peSel = document.getElementById('pe-strike-select');

      const selected = groupedData.find(x => x.name === nameSel.value);
      const strikes = selected ? (selected.expiries[expirySel.value] || []) : [];

      const strikeOptions = strikes.map(s => `<option value="${s}">${s}</option>`).join('');
      ceSel.innerHTML = strikeOptions;
      peSel.innerHTML = strikeOptions;

      if (strikes.length > 0) {
        let defaultStrike = strikes[0];
        if (selected && selected.atmStrike != null) {
          const atm = Number(selected.atmStrike);
          const match = strikes.find(s => Number(s) === atm);
          if (match !== undefined) defaultStrike = match;
        }

        ceSel.value = defaultStrike;
        peSel.value = defaultStrike;
        API_PARAMS.ceStrike = String(defaultStrike);
        API_PARAMS.peStrike = String(defaultStrike);
      }
    }

    async function loadInitialData() {
      apiData = await fetchDataFromAPI();
      if (apiData.length === 0) {
        showError('No data available for the selected filters.');
        return;
      }

      transformToSeries(apiData);

      lines.spot.setData(lineVisibility.spot ? currentSeries.spotSeries : []);
      lines.ce.setData(lineVisibility.ce ? currentSeries.ceSeries : []);
      lines.pe.setData(lineVisibility.pe ? currentSeries.peSeries : []);
      lines.combinedPremium.setData(lineVisibility.combinedPremium ? currentSeries.combinedPremiumSeries : []);
      lines.avgPrice.setData(lineVisibility.avgPrice ? currentSeries.avgPriceSeries : []);
      lines.extrinsic.setData(lineVisibility.extrinsic ? currentSeries.extrinsicSeries : []);

      drawOpenPriceLines();

      allCrossings = [];
      if (lineVisibility.ce && lineVisibility.pe) {
        allCrossings = detectCrossovers(currentSeries.ceSeries, currentSeries.peSeries, 'CE', 'PE');
        allCrossings.sort((a, b) => a.time - b.time);
      }

      if (crossoverEnabled) {
        addCrossingMarkers();
        updateCrossingsDisplay();
      } else {
        clearCrossingMarkers();
      }

      updateLegendLatest();
      chart.timeScale().fitContent();
    }

    function initCheckoutDropdown() {
      const btn = document.getElementById('checkout-btn');
      const menu = document.getElementById('checkout-menu');

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isVisible = menu.classList.contains('show');
        closeAllDropdowns();
        if (!isVisible) menu.classList.add('show');
      });

      const checkboxHandlers = {
        'spot-check': 'spot',
        'ce-check': 'ce',
        'pe-check': 'pe',
        'combined-premium-check': 'combinedPremium',
        'avg-check': 'avgPrice',
        'extrinsic-check': 'extrinsic',
        'ce-open-check': 'ceOpen',
        'pe-open-check': 'peOpen',
        'combined-open-check': 'combinedOpen'
      };

      Object.entries(checkboxHandlers).forEach(([id, key]) => {
        document.getElementById(id).addEventListener('change', (e) => {
          lineVisibility[key] = e.target.checked;
          
          if (['ceOpen', 'peOpen', 'combinedOpen'].includes(key)) {
            drawOpenPriceLines();
          } else {
            const seriesKey = key + 'Series';
            lines[key].setData(lineVisibility[key] ? currentSeries[seriesKey] : []);
          }
          
          updateLegendLatest();
          closeAllDropdowns();
        });
      });

      document.getElementById('btn-max-chart').addEventListener('click', () => {
  const card = document.querySelector('.card');
  card.classList.toggle('chart-fullscreen');

  setTimeout(() => {
    const chartDiv = document.getElementById('chart');

    chart.applyOptions({
      width: chartDiv.clientWidth,
      height: chartDiv.clientHeight
    });

    chart.timeScale().fitContent();
  }, 200);
});


      document.addEventListener('click', closeAllDropdowns);
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.checkout-menu').forEach(m => m.classList.remove('show'));
    }

    function initDropdowns() {
      ['name-select', 'expiry-select', 'ce-strike-select', 'pe-strike-select'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
          if (id === 'name-select') {
            populateExpirySelect();
          } else if (id === 'expiry-select') {
            populateStrikeSelects();
          } else if (id === 'ce-strike-select') {
            API_PARAMS.ceStrike = String(document.getElementById(id).value);
          } else if (id === 'pe-strike-select') {
            API_PARAMS.peStrike = String(document.getElementById(id).value);
          }
          loadInitialData();
        });
      });
    }

    function startAutoRefresh() {
      if (autoRefreshInterval) return;
      autoRefreshInterval = setInterval(() => loadInitialData(), 30000);
    }

    function stopAutoRefresh() {
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
      }
    }

    function toggleTheme() {
      isDarkTheme = !isDarkTheme;
      const body = document.body;
      const sw = document.getElementById('theme-switch');
      const label = document.querySelector('#theme-toggle .toggle-label');

      if (isDarkTheme) {
        body.style.background = "linear-gradient(180deg,#071021 0%, #071a2b 100%)";
        sw.classList.add('active');
        label.textContent = 'Dark';
      } else {
        body.style.background = "linear-gradient(180deg,#f8fafc 0%, #e2e8f0 100%)";
        sw.classList.remove('active');
        label.textContent = 'Light';
      }
      updateChartTheme();
    }

    function toggleCrossover() {
      crossoverEnabled = !crossoverEnabled;
      const sw = document.getElementById('toggle-switch');

      if (crossoverEnabled) {
        sw.classList.add('active');
        addCrossingMarkers();
        updateCrossingsDisplay();
      } else {
        sw.classList.remove('active');
        clearCrossingMarkers();
        document.getElementById('crossings-container').innerHTML = 
          '<div class="no-crossings">Enable "Crossovers" to detect CE-PE intersections.</div>';
      }
    }

    function toggleAutoUpdate() {
      autoUpdateEnabled = !autoUpdateEnabled;
      const label = document.getElementById('auto-update-label');
      const sw = document.getElementById('auto-update-switch');

      if (autoUpdateEnabled) {
        label.textContent = 'Auto: ON';
        sw.classList.add('active');
        startAutoRefresh();
      } else {
        label.textContent = 'Auto: OFF';
        sw.classList.remove('active');
        stopAutoRefresh();
      }
    }

    async function init() {
      document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
      document.getElementById('toggle-container').addEventListener('click', toggleCrossover);
      document.getElementById('auto-update-toggle').addEventListener('click', toggleAutoUpdate);
      document.getElementById('btn-reset').addEventListener('click', loadInitialData);

      initCheckoutDropdown();
      initDropdowns();
      await loadGroupedData();
      await loadInitialData();
      startAutoRefresh();

      window.addEventListener('resize', () => {
        chart.applyOptions({ width: document.getElementById('chart').clientWidth });
      });
    }

    chart.subscribeCrosshairMove(param => updateLegendAtCrosshair(param));

// 1️⃣ Force default Light Theme before init()
(function setDefaultLightTheme() {
  isDarkTheme = false;

  document.body.style.background =
    "linear-gradient(180deg,#f8fafc 0%, #e2e8f0 100%)";

  const sw = document.getElementById("theme-switch");
  const label = document.querySelector("#theme-toggle .toggle-label");

  if (sw) sw.classList.remove("active");
  if (label) label.textContent = "Light";
})();

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    window.addEventListener('beforeunload', stopAutoRefresh);
  </script>
</body>
</html>
