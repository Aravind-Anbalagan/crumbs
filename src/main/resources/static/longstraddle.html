<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crumbs Pro Terminal</title>
    
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #e5e7eb;
            --header-bg: #111827;
            --border-color: #1f2937;
            --loader-bg: rgba(13, 17, 23, 0.85);
            --select-bg: #1f2937;
        }

        body.light-mode {
            --bg-color: #ffffff;
            --text-color: #111827;
            --header-bg: #f3f4f6;
            --border-color: #d1d5db;
            --loader-bg: rgba(255, 255, 255, 0.85);
            --select-bg: #e5e7eb;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            transition: background-color 0.3s, color 0.3s;
        }

        .theme-header { background-color: var(--header-bg); border-color: var(--border-color); transition: all 0.3s; }
        .theme-border { border-color: var(--border-color); transition: border-color 0.3s; }
        .theme-loader { background-color: var(--loader-bg); transition: background-color 0.3s; }
        .theme-select { background-color: var(--select-bg); border-color: var(--border-color); color: var(--text-color); }

        #chart-container { height: calc(100vh - 120px); width: 100%; }
        
        .loader { border-top-color: #3b82f6; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .live-dot { 
            width: 10px; height: 10px; border-radius: 50%; 
            background: #ef5350; display: inline-block; 
            transition: background 0.3s;
        }
        .live-dot.connected { 
            background: #26a69a; 
            box-shadow: 0 0 8px #26a69a; 
            animation: pulse 1.5s infinite; 
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body class="overflow-hidden">

    <nav class="flex items-center justify-between px-6 py-3 theme-header border-b">
        <div class="flex items-center space-x-8">
            <div class="flex flex-col">
                <span class="text-xs font-bold text-blue-500 tracking-widest uppercase">Crumbs Trade</span>
                <div class="flex items-center gap-2">
                    <span id="active-instrument-label" class="text-lg font-bold">NIFTY</span>
                    <span id="live-dot" class="live-dot" title="SSE Disconnected"></span>
                </div>
            </div>

            <div class="flex theme-select p-1 rounded-md border theme-border">
                <button onclick="changeInstrument('NIFTY')" id="btn-NIFTY" class="instr-btn px-4 py-1 text-sm rounded bg-blue-600 text-white font-semibold transition-colors">NIFTY</button>
                <button onclick="changeInstrument('CRUDEOIL')" id="btn-CRUDEOIL" class="instr-btn px-4 py-1 text-sm rounded font-semibold transition-colors">CRUDE OIL</button>
            </div>

            <select id="timeFrame" onchange="handleTimeframeChange()" class="theme-select text-sm rounded px-3 py-1 outline-none focus:ring-1 focus:ring-blue-500 border">
                <option value="ONE_MINUTE">1 Min</option>
                <option value="FIVE_MINUTE" selected>5 Min</option>
                <option value="FIFTEEN_MINUTE">15 Min</option>
                <option value="ONE_HOUR">1 Hour</option>
                <option value="ONE_DAY">1 Day</option>
            </select>
            
            <button onclick="toggleTheme()" class="theme-select border px-3 py-1 rounded text-sm font-semibold hover:bg-blue-500 hover:text-white hover:border-blue-500 transition-all">
                🌓 Theme
            </button>
        </div>

        <div class="flex items-center space-x-10">
            <div class="text-right">
                <p class="text-[10px] uppercase font-bold" style="color: #6b7280;">Active Position</p>
                <p id="trade-status" class="text-sm font-mono font-bold text-gray-400">NONE</p>
            </div>
            <div class="theme-select px-4 py-1 rounded border">
                <p class="text-[10px] uppercase font-bold text-center" style="color: #6b7280;">Live PnL</p>
                <p id="pnl-val" class="text-xl font-mono font-bold text-gray-400">0.00</p>
            </div>
        </div>
    </nav>

    <div class="flex h-full">
        <div class="w-64 theme-header border-r theme-border p-4 flex flex-col gap-4">
            <div class="space-y-2">
                <label class="text-[10px] font-bold uppercase" style="color: #6b7280;">Execution</label>
                <button onclick="executeTrade('entry')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded font-bold transition-all shadow-lg active:scale-95">
                    LONG STRADDLE
                </button>
                <button onclick="executeTrade('exit')" class="w-full bg-rose-600 hover:bg-rose-500 text-white py-3 rounded font-bold transition-all shadow-lg active:scale-95">
                    EXIT POSITION
                </button>
            </div>

            <div class="flex flex-col flex-1 gap-2 min-h-0 pb-6">
                <label class="text-[10px] font-bold uppercase" style="color: #6b7280;">System Logs</label>
                <div id="status-log" class="flex-1 text-[11px] font-mono theme-select border theme-border p-2 rounded overflow-y-auto">
                    <div style="color: var(--text-color);">System ready...</div>
                </div>
            </div>
        </div>

        <div class="flex-1 relative">
            <div id="loader" class="absolute inset-0 z-50 flex items-center justify-center theme-loader transition-opacity duration-300">
                <div class="loader rounded-full border-4 theme-border h-12 w-12"></div>
            </div>
            <div id="chart-container"></div>
        </div>
    </div>

    <script>
        const AppState = {
            chart: null,
            series: { candle: null },
            data: { candles: [] },
            srLines: [],
            currentName: "NIFTY"
        };

        const StreamState = {
            marketSource: null,
            pnlSource: null,
            reconnectTimeout: null, 
            candlePollingInterval: null,
            iKeyCurrent: null,
            iKeyCache: {},
            pendingTicks: [],
            TF_SECS: 300, 
            IST_OFFSET: 19800 // 5.5 hours for IST
        };

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            syncChartColors();
        }

        function syncChartColors() {
            if (!AppState.chart) return;
            const isLight = document.body.classList.contains('light-mode');
            AppState.chart.applyOptions({
                layout: { textColor: isLight ? '#374151' : '#9ca3af' }, 
                priceScale: { borderColor: isLight ? '#d1d5db' : '#374151' },
                timeScale: { borderColor: isLight ? '#d1d5db' : '#374151' }
            });
        }

        function showLoader() { document.getElementById('loader').style.display = 'flex'; }
        function hideLoader() { document.getElementById('loader').style.display = 'none'; }

        function initApp() {
            const hour = new Date().getHours();
            if (hour >= 9 && hour < 16) document.body.classList.add('light-mode');
            setupChart();
            syncChartColors(); 
            window.addEventListener('resize', () => {
                const container = document.getElementById('chart-container');
                if (AppState.chart) AppState.chart.applyOptions({ width: container.clientWidth });
            });
            changeInstrument('NIFTY'); 
            startCandlePolling();
        }

        function setupChart() {
            const container = document.getElementById('chart-container');
            AppState.chart = LightweightCharts.createChart(container, {
                layout: { backgroundColor: 'transparent' }, 
                grid: { vertLines: { visible: false }, horzLines: { visible: false } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                priceScale: { autoScale: true },
                timeScale: { 
                    timeVisible: true, 
                    secondsVisible: false,
                    barSpacing: 12, 
                    rightOffset: 5
                }
            });
            AppState.series.candle = AppState.chart.addCandlestickSeries({
                upColor: '#10b981', downColor: '#ef4444', borderVisible: false,
                wickUpColor: '#10b981', wickDownColor: '#ef4444'
            });
        }

        function clearChart() {
            if (AppState.series.candle) AppState.chart.removeSeries(AppState.series.candle);
            AppState.series.candle = AppState.chart.addCandlestickSeries({
                upColor: '#10b981', downColor: '#ef4444', borderVisible: false,
                wickUpColor: '#10b981', wickDownColor: '#ef4444'
            });
            AppState.srLines = [];
            AppState.data.candles = [];
        }

        function handleTimeframeChange() {
            const val = document.getElementById('timeFrame').value;
            const tfMap = { 'ONE_MINUTE': 60, 'FIVE_MINUTE': 300, 'FIFTEEN_MINUTE': 900, 'ONE_HOUR': 3600, 'ONE_DAY': 86400 };
            StreamState.TF_SECS = tfMap[val] || 300; 
            showLoader();
            setTimeout(async () => { clearChart(); await loadData(false); }, 50);
        }

        async function changeInstrument(name) {
            showLoader(); 
            await new Promise(resolve => setTimeout(resolve, 50));
            AppState.currentName = name;
            document.getElementById('active-instrument-label').innerText = name;
            document.querySelectorAll('.instr-btn').forEach(b => {
                b.classList.remove('bg-blue-600', 'text-white');
                b.style.color = 'var(--text-color)';
            });
            const activeBtn = document.getElementById(`btn-${name}`);
            activeBtn.classList.add('bg-blue-600', 'text-white');
            activeBtn.style.color = ''; 
            clearChart(); 
            await loadData(false);
            resolveStreamKey(name);
            startPnLStream();
            connectMarketSSE(); 
        }

        async function loadData(isSilent = false) {
            try {
                const tf = document.getElementById('timeFrame').value;
                const response = await fetch(`/api/intraday?timeFrame=${tf}&name=${AppState.currentName}`);
                const payload = await response.json();
                if (!payload || !payload.candles || payload.candles.length === 0) return;

                const formattedData = payload.candles.map(d => {
                    let ts = parseInt(d.time);
                    // Standardize to seconds and apply IST offset
                    if (ts > 10000000000) ts = Math.floor(ts / 1000); 
                    return {
                        time: ts + StreamState.IST_OFFSET, 
                        open: parseFloat(d.open) || 0,
                        high: parseFloat(d.high) || 0,
                        low: parseFloat(d.low) || 0,
                        close: parseFloat(d.close) || 0
                    };
                });
                formattedData.sort((a, b) => a.time - b.time);
                AppState.data.candles = formattedData.filter((v, i, s) => i === s.findIndex((t) => (t.time === v.time)));
                AppState.series.candle.setData(AppState.data.candles);
                drawSR(payload.supportLevels, payload.resistanceLevels);
            } catch (e) { if (!isSilent) logStatus("Error loading data."); } finally { if (!isSilent) hideLoader(); }
        }

        function drawSR(supports, resistances) {
            const config = (p, c, t) => ({ price: p, color: c, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Solid, axisLabelVisible: true, title: t });
            if (supports) supports.forEach(s => AppState.srLines.push(AppState.series.candle.createPriceLine(config(s.price, '#10b981', 'SUPP'))));
            if (resistances) resistances.forEach(r => AppState.srLines.push(AppState.series.candle.createPriceLine(config(r.price, '#ef4444', 'RES'))));
        }

        function startCandlePolling() {
            clearInterval(StreamState.candlePollingInterval);
            StreamState.candlePollingInterval = setInterval(() => { if (document.visibilityState === 'visible') loadData(true); }, 30000); 
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') { loadData(true); startCandlePolling(); } 
            else clearInterval(StreamState.candlePollingInterval);
        });

        async function getInstrumentKey(name) {
            if (StreamState.iKeyCache[name]) return StreamState.iKeyCache[name];
            try {
                const res = await fetch(`/api/websocket/instrument/key?name=${encodeURIComponent(name)}`);
                const data = await res.json();
                const key = data.key || data.instrumentKey;
                if (key) StreamState.iKeyCache[name] = key;
                return key;
            } catch (e) { return null; }
        }

        async function resolveStreamKey(symbol) {
            StreamState.iKeyCurrent = null;
            const key = await getInstrumentKey(symbol);
            StreamState.iKeyCurrent = key;
            if (StreamState.pendingTicks.length) {
                StreamState.pendingTicks.forEach(applyTick);
                StreamState.pendingTicks.length = 0;
            }
        }

        function connectMarketSSE() {
            if (StreamState.reconnectTimeout) clearTimeout(StreamState.reconnectTimeout);
            if (StreamState.marketSource) StreamState.marketSource.close();
            StreamState.marketSource = new EventSource('/api/stream/market');
            StreamState.marketSource.onopen = () => document.getElementById('live-dot').className = 'live-dot connected';
            StreamState.marketSource.onerror = () => {
                document.getElementById('live-dot').className = 'live-dot';
                StreamState.marketSource.close();
                StreamState.reconnectTimeout = setTimeout(connectMarketSSE, 3000); 
            };
            StreamState.marketSource.addEventListener('ltp', e => {
                let d; try { d = JSON.parse(e.data); } catch (ex) { return; }
                if (!d || d.price == null) return;
                const price = +d.price;
                const tickKey = d.key ? String(d.key) : null;
                if (tickKey && !StreamState.iKeyCurrent) { StreamState.pendingTicks.push({ price, tickKey }); return; }
                if (tickKey !== StreamState.iKeyCurrent) return;
                applyTick(price);
            });
        }

        function applyTick(price) {
            const candles = AppState.data.candles;
            if (!candles.length || !AppState.series.candle) return;
            const last = candles[candles.length - 1];
            // Apply IST offset to real-time math
            const nowIST = Math.floor(Date.now() / 1000) + StreamState.IST_OFFSET;
            const barFloor = Math.floor(nowIST / StreamState.TF_SECS) * StreamState.TF_SECS;

            if (barFloor > last.time) {
                const nc = { time: barFloor, open: price, high: price, low: price, close: price };
                candles.push(nc);
                try { AppState.series.candle.update(nc); } catch(e) {}
            } else {
                const upd = { time: last.time, open: +last.open, high: Math.max(+last.high, price), low: Math.min(+last.low, price), close: price };
                candles[candles.length - 1] = upd;
                if (upd.close !== +last.close || upd.high !== +last.high || upd.low !== +last.low) {
                    try { AppState.series.candle.update(upd); } catch(e) {}
                }
            }
        }

        function startPnLStream() {
            if (StreamState.pnlSource) StreamState.pnlSource.close();
            const pnlDisplay = document.getElementById('pnl-val');
            StreamState.pnlSource = new EventSource(`/api/global/pnl/stream?name=${AppState.currentName}&type=STRADDLE`);
            StreamState.pnlSource.addEventListener('pnl-update', (e) => {
                const val = parseFloat(e.data);
                pnlDisplay.innerText = val.toFixed(2);
                pnlDisplay.className = `text-xl font-mono font-bold ${val > 0 ? 'text-green-500' : val < 0 ? 'text-red-500' : 'text-gray-400'}`;
            });
            StreamState.pnlSource.onerror = () => StreamState.pnlSource.close();
        }

        async function executeTrade(action) {
            logStatus(`Executing ${action}...`);
            const statusEl = document.getElementById('trade-status');
            try {
                const res = await fetch(`/api/global/${action}?name=${AppState.currentName}&type=STRADDLE`, { method: 'POST' });
                const msg = await res.text();
                logStatus(msg);
                if(action === 'entry') {
                    statusEl.innerText = 'STRADDLE';
                    statusEl.className = 'text-sm font-mono font-bold text-green-500';
                    startPnLStream();
                } else {
                    statusEl.innerText = 'NONE';
                    statusEl.className = 'text-sm font-mono font-bold text-gray-400';
                }
            } catch (e) { logStatus("Trade failed."); }
        }

        function logStatus(msg) {
            const div = document.getElementById('status-log');
            div.innerHTML = `<div style="color: var(--text-color);">[${new Date().toLocaleTimeString()}] ${msg}</div>` + div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
