<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crumbs</title>
  <style>
    html { box-sizing: border-box; }
    *, *:before, *:after { box-sizing: inherit; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f6fa;
      color: #333;
    }
    nav {
      background: linear-gradient(90deg, #1e272e, #2c3e50);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .menu {
      display: flex;
      list-style: none;
      width: 100%;
      overflow-x: auto;
    }
    .menu-item {
      flex: 1;
      text-align: center;
    }
    .menu-link {
      display: block;
      padding: 14px 0;
      color: #d2dae2;
      background: none;
      font-size: 15px;
      font-weight: 500;
      border: none;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
    }
    .menu-link:hover,
    .menu-item.active-menu .menu-link {
      background-color: rgba(255,255,255,0.05);
      color: #fff;
    }
    .menu-item.active-menu .menu-link {
      background: #00a8ff;
      color: #fff;
      font-weight: 600;
      box-shadow: inset 0 -3px 0 #0077b6;
    }
    .menu-item.disabled-menu .menu-link {
      pointer-events: none;
      opacity: 0.5;
      cursor: default;
      background: none !important;
      color: #a0a8b0 !important;
      font-weight: 500;
      box-shadow: none !important;
    }
    #iframeContainer {
      position: relative;
      width: 100%;
      height: calc(100vh - 50px);
      pointer-events: none;
      opacity: 0.5;
    }
    #contentFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
    #spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 4px solid #f3f3f3;
      border-top: 4px solid #00a8ff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      display: none;
      z-index: 20;
    }
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg);}
      100% { transform: translate(-50%, -50%) rotate(360deg);}
    }
    
    /* Glassmorphism Login Popup */
    #loginPopup {
      display: flex;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      align-items: center;
      justify-content: center;
      animation: gradientShift 8s ease infinite;
      background-size: 200% 200%;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes fadeInScale {
      from { 
        opacity: 0;
        transform: scale(0.9);
      }
      to { 
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes pulseError {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    
    .login-modal {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1),
                  inset 0 1px 0 rgba(255, 255, 255, 0.4);
      padding: 50px 45px;
      min-width: 420px;
      max-width: 90%;
      text-align: center;
      position: relative;
      animation: fadeInScale 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    
    .lock-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
      animation: iconPulse 2s ease-in-out infinite;
    }
    @keyframes iconPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6); }
    }
    
    .login-modal h2 {
      margin-bottom: 10px;
      font-size: 2rem;
      color: #ffffff;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }
    .login-modal p {
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 32px;
      font-size: 1rem;
      font-weight: 400;
    }
    
    .input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    .input-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      opacity: 0.7;
    }
    .login-modal input[type="password"] {
      width: 100%;
      padding: 18px 20px 18px 52px;
      font-size: 1rem;
      border-radius: 50px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-sizing: border-box;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-family: inherit;
      font-weight: 500;
    }
    .login-modal input[type="password"]::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
    .login-modal input[type="password"]:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
    }
    .login-modal input[type="password"].error-shake {
      animation: pulseError 0.5s ease;
      border-color: #ff6b6b;
      background: rgba(255, 107, 107, 0.2);
    }
    
    .login-modal button {
      width: 100%;
      padding: 18px 24px;
      background: linear-gradient(135deg, #ffffff, #f0f0f0);
      color: #667eea;
      border: none;
      border-radius: 50px;
      font-size: 1.05rem;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .login-modal button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.2);
      background: linear-gradient(135deg, #ffffff, #ffffff);
    }
    .login-modal button:active {
      transform: translateY(0);
    }
    
    .login-modal .error {
      color: #ffffff;
      margin-top: 20px;
      font-size: 0.9rem;
      display: none;
      background: rgba(255, 107, 107, 0.3);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      border-radius: 50px;
      border: 1px solid rgba(255, 107, 107, 0.5);
      animation: fadeInScale 0.3s ease;
      font-weight: 500;
    }
    
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: float-particle 15s infinite;
    }
    @keyframes float-particle {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) scale(1); opacity: 0; }
    }
    
    /* Enable content when authenticated */
    .authenticated #iframeContainer,
    .authenticated nav {
      pointer-events: auto;
      opacity: 1;
    }
    .authenticated #loginPopup {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="loginPopup">
    <div class="particles" id="particles"></div>
    <div class="login-modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <div class="lock-icon">🔐</div>
      <h2 id="loginTitle">Secure Access</h2>
      <p>Please authenticate to continue</p>
      <div class="input-wrapper">
        <span class="input-icon">🔑</span>
        <input id="loginCodeInput" type="password" maxlength="15" autocomplete="off" placeholder="Access Code" aria-label="Login Code" />
      </div>
      <button id="loginBtn" type="button">Authenticate</button>
      <div class="error" id="loginError">⚠️ Authentication failed. Please try again.</div>
    </div>
  </div>
  
  <nav aria-label="Main navigation">
    <ul class="menu">
      <li class="menu-item" data-url="stock.html"><button class="menu-link" type="button">Stocks</button></li>
      <li class="menu-item" data-url="result.html"><button class="menu-link" type="button">Result</button></li>
      <li class="menu-item" data-url="intraday.html"><button class="menu-link" type="button">Intraday</button></li>
      <li class="menu-item" data-url="orders.html"><button class="menu-link" type="button">Orders</button></li>
      <li class="menu-item" data-url="log.html"><button class="menu-link" type="button">Log</button></li>
    </ul>
  </nav>
  
  <div id="iframeContainer">
    <div id="spinner" role="status" aria-label="Loading"></div>
    <iframe id="contentFrame" src="stock.html" title="Main Content"></iframe>
  </div>
  
  <script>
    // Create floating particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 15; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.width = Math.random() * 10 + 5 + 'px';
      particle.style.height = particle.style.width;
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 15 + 's';
      particle.style.animationDuration = Math.random() * 10 + 10 + 's';
      particlesContainer.appendChild(particle);
    }

    const loginPopup = document.getElementById('loginPopup');
    const loginBtn = document.getElementById('loginBtn');
    const loginCodeInput = document.getElementById('loginCodeInput');
    const loginError = document.getElementById('loginError');
    const body = document.body;

    async function fetchSecretCode() {
      try {
        const response = await fetch('/key/1');
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();
        return data.secret;
      } catch (error) {
        console.error('Error fetching secret:', error);
        return null;
      }
    }

    loginBtn.onclick = async function() {
      const inputCode = loginCodeInput.value.trim();
      const apiSecret = await fetchSecretCode();
      if (apiSecret && inputCode === apiSecret) {
        body.classList.add('authenticated');
        loginPopup.style.display = 'none';
        loginError.style.display = 'none';
        loginCodeInput.classList.remove('error-shake');
      } else {
        loginError.style.display = 'block';
        loginCodeInput.classList.add('error-shake');
        loginCodeInput.value = '';
        loginCodeInput.focus();
        setTimeout(() => {
          loginCodeInput.classList.remove('error-shake');
        }, 500);
      }
    };

    loginCodeInput.addEventListener('keyup', function (e) {
      if (e.key === 'Enter') loginBtn.click();
    });

    const spinner = document.getElementById('spinner');
    const iframe = document.getElementById('contentFrame');
    const menuItems = document.querySelectorAll('.menu-item');

    function loadPage(url) {
      spinner.style.display = 'block';
      iframe.src = url;
      highlightMenuByUrl(url);
    }

    function highlightMenuByUrl(url) {
      menuItems.forEach(item => {
        if (item.dataset.url === url) {
          item.classList.add('active-menu');
        } else {
          item.classList.remove('active-menu');
        }
      });
    }

    menuItems.forEach(item => {
      if (!item.classList.contains('disabled-menu')) {
        item.querySelector('.menu-link').addEventListener('click', () => {
          loadPage(item.dataset.url);
        });
      }
    });

    iframe.addEventListener('load', () => {
      spinner.style.display = 'none';
      const url = iframe.contentWindow.location.pathname.split("/").pop().split('?')[0];
      highlightMenuByUrl(url);
    });

    highlightMenuByUrl('stock.html');
  </script>
</body>
</html>
