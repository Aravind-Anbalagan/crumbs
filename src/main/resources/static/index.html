<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crumbs</title>
  <style>
    html { box-sizing: border-box; }
    *, *:before, *:after { box-sizing: inherit; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f6fa;
      color: #333;
    }
    nav {
      background: linear-gradient(90deg, #1e272e, #2c3e50);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .menu {
      display: flex;
      list-style: none;
      width: 100%;
      overflow-x: auto;
    }
    .menu-item {
      flex: 1;
      text-align: center;
    }
    .menu-link {
      display: block;
      padding: 14px 0;
      color: #d2dae2;
      background: none;
      font-size: 15px;
      font-weight: 500;
      border: none;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
    }
    .menu-link:hover,
    .menu-item.active-menu .menu-link {
      background-color: rgba(255,255,255,0.05);
      color: #fff;
    }
    .menu-item.active-menu .menu-link {
      background: #00a8ff;
      color: #fff;
      font-weight: 600;
      box-shadow: inset 0 -3px 0 #0077b6;
    }
    /* Disabled menu item style */
    .menu-item.disabled-menu .menu-link {
      pointer-events: none;
      opacity: 0.5;
      cursor: default;
      background: none !important;
      color: #a0a8b0 !important;
      font-weight: 500;
      box-shadow: none !important;
    }
    #iframeContainer {
      position: relative;
      width: 100%;
      height: calc(100vh - 50px);
      pointer-events: none;
      opacity: 0.5;
    }
    #contentFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
    #spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 4px solid #f3f3f3;
      border-top: 4px solid #00a8ff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      display: none;
      z-index: 20;
    }
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg);}
      100% { transform: translate(-50%, -50%) rotate(360deg);}
    }
    /* Login Popup Overlay Styles */
    #loginPopup {
      display: flex;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(30,39,46,0.82);
      align-items: center;
      justify-content: center;
    }
    .login-modal {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      padding: 28px 32px;
      min-width: 320px;
      max-width: 90%;
      text-align: center;
      position: relative;
    }
    .login-modal input[type="password"] {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      font-size: 1.1rem;
      border-radius: 6px;
      border: 1px solid #c3c7cb;
      box-sizing: border-box;
    }
    .login-modal button {
      padding: 10px 24px;
      background: #00a8ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      font-weight: 500;
    }
    .login-modal .error {
      color: #e84118;
      margin-top: 10px;
      margin-bottom: 5px;
      font-size: .95rem;
      display: none;
    }
    /* Enable content when authenticated */
    .authenticated #iframeContainer,
    .authenticated nav {
      pointer-events: auto;
      opacity: 1;
    }
    .authenticated #loginPopup {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="loginPopup">
    <div class="login-modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <h2 id="loginTitle">Enter Login Code</h2>
      <input id="loginCodeInput" type="password" maxlength="15" autocomplete="off" placeholder="Login code" aria-label="Login Code" />
      <button id="loginBtn" type="button">Login</button>
      <div class="error" id="loginError">Invalid code. Try again.</div>
    </div>
  </div>
  <nav aria-label="Main navigation">
    <ul class="menu">
      <li class="menu-item" data-url="stock.html"><button class="menu-link" type="button">Stocks</button></li>
      <!--<li class="menu-item disabled-menu" data-url="chart.html"><button class="menu-link" type="button">Chart</button></li>-->
      <li class="menu-item" data-url="intraday.html"><button class="menu-link" type="button">Intraday</button></li>
      <!--<li class="menu-item" data-url="oi-daily.html"><button class="menu-link" type="button">OI - Daily</button></li>-->
      <li class="menu-item" data-url="orders.html"><button class="menu-link" type="button">Orders</button></li>
      <li class="menu-item" data-url="result.html"><button class="menu-link" type="button">Result</button></li>
      <li class="menu-item" data-url="log.html"><button class="menu-link" type="button">Log</button></li>
    </ul>
  </nav>
  <div id="iframeContainer">
    <div id="spinner" role="status" aria-label="Loading"></div>
    <iframe id="contentFrame" src="stock.html" title="Main Content"></iframe>
  </div>
  <script>
    const loginPopup = document.getElementById('loginPopup');
    const loginBtn = document.getElementById('loginBtn');
    const loginCodeInput = document.getElementById('loginCodeInput');
    const loginError = document.getElementById('loginError');
    const body = document.body;

    async function fetchSecretCode() {
      try {
        const response = await fetch('/key/1'); // Replace with actual API URL
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();
        return data.secret;
      } catch (error) {
        console.error('Error fetching secret:', error);
        return null;
      }
    }

    loginBtn.onclick = async function() {
      const inputCode = loginCodeInput.value.trim();
      const apiSecret = await fetchSecretCode();
      if (apiSecret && inputCode === apiSecret) {
        body.classList.add('authenticated');
        loginPopup.style.display = 'none';
        loginError.style.display = 'none';
      } else {
        loginError.style.display = 'block';
        loginCodeInput.value = '';
        loginCodeInput.focus();
      }
    };

    loginCodeInput.addEventListener('keyup', function (e) {
      if (e.key === 'Enter') loginBtn.click();
    });

    const spinner = document.getElementById('spinner');
    const iframe = document.getElementById('contentFrame');
    const menuItems = document.querySelectorAll('.menu-item');

    function loadPage(url) {
      spinner.style.display = 'block';
      iframe.src = url;
      highlightMenuByUrl(url);
    }

    function highlightMenuByUrl(url) {
      menuItems.forEach(item => {
        if (item.dataset.url === url) {
          item.classList.add('active-menu');
        } else {
          item.classList.remove('active-menu');
        }
      });
    }

    menuItems.forEach(item => {
      // Prevent click on disabled menu item
      if (!item.classList.contains('disabled-menu')) {
        item.querySelector('.menu-link').addEventListener('click', () => {
          loadPage(item.dataset.url);
        });
      }
    });

    iframe.addEventListener('load', () => {
      spinner.style.display = 'none';
      const url = iframe.contentWindow.location.pathname.split("/").pop().split('?')[0];
      highlightMenuByUrl(url);
    });

    highlightMenuByUrl('stock.html');
  </script>
</body>
</html>
