<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crumbs | Strategic Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --accent: #bc13fe;
            --glass: rgba(15, 23, 42, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --bg: #020617;
            --nav-h: 44px; /* Slim height to save space */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            color: #fff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column; /* Stacks nav and content vertically */
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* --- Stylish Top Menu (Non-Overlay) --- */
        nav {
            height: var(--nav-h);
            background: var(--glass);
            backdrop-filter: blur(12px) saturate(180%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.2rem;
            flex-shrink: 0; /* Ensures the nav doesn't squash */
            z-index: 1000;
        }

        .logo {
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: -1px;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
            margin-right: 1.5rem;
        }

        .menu {
            display: flex;
            gap: 4px;
            list-style: none;
            height: 100%;
            align-items: center;
        }

        .menu-link {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .menu-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .active-menu .menu-link {
            color: var(--primary);
            background: rgba(0, 242, 255, 0.1);
            box-shadow: inset 0 0 8px rgba(0, 242, 255, 0.05);
        }

        /* --- Full-Screen Body Area --- */
        #iframeContainer {
            flex-grow: 1; /* Takes up all remaining space below the nav */
            width: 100%;
            background: #000;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* --- Glassmorphism Login --- */
        #loginPopup {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            z-index: 2000;
            transition: transform 0.8s cubic-bezier(0.87, 0, 0.13, 1);
        }

        .login-card {
            width: 360px;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .access-input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 12px;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
            margin: 1.5rem 0;
            outline: none;
        }

        .btn-init {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #000;
            font-weight: 800;
            cursor: pointer;
        }

        /* State Control */
        .authenticated #loginPopup { transform: translateY(-100%); }

        #spinner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 24px; height: 24px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loginPopup">
        <div class="login-card">
            <h1 style="font-weight:800; letter-spacing:-1px;">CRUMBS</h1>
            <input id="loginCodeInput" class="access-input" type="password" placeholder="ACCESS_KEY">
            <button id="loginBtn" class="btn-init">DECRYPT & START</button>
        </div>
    </div>

    <nav>
        <div class="logo">CRUMBS</div>
        <ul class="menu">
            <li class="menu-item active-menu" data-url="stock.html"><button class="menu-link">Stocks</button></li>
            <li class="menu-item" data-url="oi-daily.html"><button class="menu-link">OI Flow</button></li>
            <li class="menu-item" data-url="straddle.html"><button class="menu-link">Straddle</button></li>
            <li class="menu-item" data-url="premarket.html"><button class="menu-link">Pre-Market</button></li>
            <li class="menu-item" data-url="future.html"><button class="menu-link">Futures</button></li>
            <li class="menu-item" data-url="intraday.html"><button class="menu-link">Intraday</button></li>
            <li class="menu-item" data-url="orders.html"><button class="menu-link">Orders</button></li>
            <li class="menu-item" data-url="log.html"><button class="menu-link">Log</button></li>
        </ul>
        <div id="clock" style="font-family:'JetBrains Mono'; font-size: 0.6rem; color: var(--primary); opacity: 0.8;">00:00:00</div>
    </nav>

    <div id="iframeContainer">
        <div id="spinner"></div>
        <iframe id="contentFrame" src="stock.html"></iframe>
    </div>

    <script>
        // Update Clock
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        const loginBtn = document.getElementById('loginBtn');
        const loginInput = document.getElementById('loginCodeInput');
        const iframe = document.getElementById('contentFrame');
        const spinner = document.getElementById('spinner');

        // Auth Logic
        async function authenticate() {
            const code = loginInput.value.trim();
            try {
                const res = await fetch('/key/1/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ secret: code })
                });
                const ok = await res.json();
                if (ok) {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    document.body.classList.add('authenticated');
                }
            } catch (e) { console.error("Auth error", e); }
        }

        loginBtn.onclick = authenticate;
        loginInput.onkeyup = e => e.key === 'Enter' && authenticate();

        // Nav Handling
        document.querySelectorAll('.menu-item').forEach(item => {
            item.onclick = () => {
                document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active-menu'));
                item.classList.add('active-menu');
                spinner.style.display = 'block';
                iframe.src = item.dataset.url;
            };
        });

        iframe.onload = () => { spinner.style.display = 'none'; };

        // Maintain Session
        if(sessionStorage.getItem('isLoggedIn') === 'true') {
            document.body.classList.add('authenticated');
        }
    </script>
</body>
</html>
