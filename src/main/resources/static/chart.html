<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OI Multi-Timeframe Dashboard — NIFTY & SILVERM</title>
  <script>
    // Authentication check - must be at the top
    if (!sessionStorage.getItem('isLoggedIn')) {
        window.location.href = '/';
    }
</script>
  <style>
    :root{--bg:#f6f7fb;--card:#ffffff;--muted:#6b7280;--green:#16a34a;--red:#dc2626;--yellow:#f59e0b;--accent:#0b5cff}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,Arial;color:#111;background:var(--bg)}
    header{background:var(--card);border-bottom:1px solid #e6e9ef;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;gap:12px;align-items:center}
    h1{font-size:18px;margin:0}
    .controls{display:flex;gap:8px;align-items:center}
    select,button{padding:8px 10px;border:1px solid #ddd;border-radius:6px;background:#fff}
    button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .wrap{max-width:1200px;margin:20px auto;padding:0 18px}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
    .card{background:var(--card);padding:12px 14px;border-radius:8px;border:1px solid #e6e9ef}
    .card .label{font-size:12px;color:var(--muted)}
    .card .value{font-weight:700;font-size:18px;margin-top:6px}
    .table-wrap{background:var(--card);border-radius:8px;padding:12px;border:1px solid #e6e9ef}
    table{width:100%;border-collapse:collapse;font-size:13px}
    thead th{background:#fbfcff;padding:8px;text-align:left;border-bottom:1px solid #eee;font-weight:600}
    tbody td{padding:8px;border-bottom:1px solid #f1f3f6}
    .positive{color:var(--green);font-weight:600}
    .negative{color:var(--red);font-weight:600}
    .neutral{color:var(--muted)}
    .legend{margin-top:8px;font-size:13px;color:var(--muted)}
    .filters{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .nearest-strikes{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
    .strike-card{background:var(--card);border:1px solid #e6e9ef;border-radius:6px;padding:10px;min-width:180px}
    .strike-card.atm{border-color:var(--accent);box-shadow:0 0 0 2px rgba(11,92,255,0.1)}
    .strike-card h3{margin:0 0 4px;font-size:14px}
    .strike-card p{margin:2px 0;font-size:12px}
    .forecast span{font-weight:600}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>OI — Multi-Timeframe Dashboard</h1>
      <div class="small">Expiry-aware OI + Volume analysis</div>
    </div>

    <div class="controls">
      <label class="small">Symbol
        <select id="symbolSelect">
          <option value="NIFTY">NIFTY</option>
          <option value="SILVERM">SILVERM</option>
        </select>
      </label>
      <label class="small">Expiry
        <select id="expirySelect">
          <option value="WEEK1">Weekly - 14 Nov 2025</option>
          <option value="MONTH">Monthly - 28 Nov 2025</option>
        </select>
      </label>
      <label class="small">Timeframe
        <select id="timeframeSelect">
          <option value="intraday">Intraday</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </label>
      <button id="refreshBtn">Refresh ⟳</button>
    </div>
  </header>

  <main class="wrap">
    <section class="cards">
      <div class="card"><div class="label">Symbol / Expiry</div><div id="cardSymbol" class="value">NIFTY — Weekly</div></div>
      <div class="card"><div class="label">Total OI</div><div id="cardTotalOI" class="value">0</div></div>
      <div class="card"><div class="label">Highest Volume Strike</div><div id="cardHighVol" class="value">-</div></div>
      <div class="card"><div class="label">Market Bias</div><div id="cardBias" class="value">-</div></div>
    </section>

    <!-- 🔹 New: 5 Nearest Strikes section -->
    <section class="nearest-strikes" id="nearestStrikes"></section>

    <!-- 🔹 Table -->
    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Strike</th><th>OI</th><th>Volume</th><th>LTP</th>
            <th>Δ Intraday</th><th>Δ Weekly</th><th>Δ Monthly</th><th>Forecast</th>
          </tr>
        </thead>
        <tbody id="oiTbody"></tbody>
      </table>
    </section>
  </main>

  <script>
    const strikesNIFTY = [22300,22400,22500,22600,22700,22800,22900,23000];
    const strikesSILVERM = [89000,89500,90000,90500,91000,91500];
    const dataMap = {NIFTY:[], SILVERM:[]};
    const currentPriceMap = {NIFTY:22620, SILVERM:90500};

    // Generate dummy CE/PE OI/Volume/LTP data
    function generateData(symbol){
      const base = symbol === 'NIFTY' ? strikesNIFTY : strikesSILVERM;
      return base.map(s=>{
        const rand = ()=>Math.round(Math.random()*100);
        return {
          strike:s,
          CE_OI:rand()*1000, PE_OI:rand()*1000,
          CE_VOL:rand()*100, PE_VOL:rand()*100,
          CE_LTP:rand(), PE_LTP:rand(),
          CE_prevOI:rand()*1000, PE_prevOI:rand()*1000
        }
      });
    }

    // compute 5 nearest strikes
    function getNearest(symbol){
      const price = currentPriceMap[symbol];
      const arr = symbol==='NIFTY'?strikesNIFTY:strikesSILVERM;
      const sorted = arr.sort((a,b)=>Math.abs(a-price)-Math.abs(b-price));
      return sorted.slice(0,5);
    }

    // Forecast logic (simple)
    function getForecast(row){
      const ceChange = row.CE_OI - row.CE_prevOI;
      const peChange = row.PE_OI - row.PE_prevOI;
      if(ceChange>0 && peChange<0) return "Bearish";
      if(ceChange<0 && peChange>0) return "Bullish";
      return "Neutral";
    }

    function renderNearest(symbol){
      const nearestStrikes = getNearest(symbol);
      const container = document.getElementById("nearestStrikes");
      container.innerHTML = "";
      const price = currentPriceMap[symbol];
      const data = dataMap[symbol];
      nearestStrikes.forEach(strike=>{
        const row = data.find(d=>d.strike===strike);
        const forecast = getForecast(row);
        const atm = Math.abs(strike - price) < 50;
        const div = document.createElement("div");
        div.className = "strike-card" + (atm?" atm":"");
        div.innerHTML = `
          <h3>${strike}${atm?" (ATM)":""}</h3>
          <p><b>CE</b> OI: ${row.CE_OI} | Vol: ${row.CE_VOL} | LTP: ${row.CE_LTP}</p>
          <p><b>PE</b> OI: ${row.PE_OI} | Vol: ${row.PE_VOL} | LTP: ${row.PE_LTP}</p>
          <p class="forecast">Intraday: <span>${forecast}</span><br/>Positional: <span>${forecast}</span></p>
        `;
        container.appendChild(div);
      });
    }

    function renderTable(symbol){
      const tbody=document.getElementById("oiTbody");
      tbody.innerHTML="";
      const data=dataMap[symbol];
      data.forEach(r=>{
        const forecast = getForecast(r);
        const intraday = (r.CE_OI - r.CE_prevOI)+(r.PE_OI - r.PE_prevOI);
        const tr=document.createElement("tr");
        tr.innerHTML=`
          <td>${r.strike}</td><td>${r.CE_OI+r.PE_OI}</td>
          <td>${r.CE_VOL+r.PE_VOL}</td><td>${(r.CE_LTP+r.PE_LTP)/2}</td>
          <td>${intraday}</td><td>${(intraday*0.6).toFixed(0)}</td><td>${(intraday*1.2).toFixed(0)}</td>
          <td>${forecast}</td>`;
        tbody.appendChild(tr);
      });
    }

    function refresh(){
      const symbol=document.getElementById("symbolSelect").value;
      dataMap[symbol]=generateData(symbol);
      renderNearest(symbol);
      renderTable(symbol);
    }

    document.getElementById("refreshBtn").addEventListener("click",refresh);
    document.getElementById("symbolSelect").addEventListener("change",refresh);
    refresh();
  </script>
</body>
</html>
