<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Result</title>
  <style>
    :root {
      --primary-color: #000000;
      --primary-hover: #222222;
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --bg-tertiary: #e0e0e0;
      --text-primary: #111111;
      --text-secondary: #444444;
      --text-muted: #777777;
      --border-primary: #ccc;
      --border-secondary: #bbb;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --bg-col-trade: linear-gradient(135deg, #f0f0f0 0%, #dcdcdc 100%);
      --bg-col-default: linear-gradient(135deg, #fafafa 0%, #e5e5e5 100%);
      --bg-col-even: #f9f9f9;
    }

    body {
      font-family: "Inter", Arial, sans-serif;
      background: var(--bg-secondary);
      margin: 20px;
      color: var(--text-primary);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input,
    select,
    button {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-primary);
      font-size: 14px;
      font-weight: 600;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    input:focus,
    select:focus,
    button:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
    }

    button.reset-btn {
      background: var(--primary-color);
      color: var(--bg-primary);
      border: none;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.2s ease;
    }

    button.reset-btn:hover {
      background: var(--primary-hover);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-primary);
      box-shadow: var(--shadow-md);
      border-radius: 16px;
      overflow: hidden;
      display: none;
    }

    thead {
      background: var(--primary-color);
      color: var(--bg-primary);
      user-select: none;
      cursor: pointer;
    }

    th,
    td {
      padding: 16px 20px;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-primary);
      vertical-align: middle;
      white-space: nowrap;
    }

    tbody tr:nth-child(even) {
      background: var(--bg-col-even);
    }

    tbody tr:hover {
      background-color: var(--bg-tertiary);
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .badge {
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      background: var(--bg-col-default);
      color: var(--text-primary);
      user-select: none;
      display: inline-block;
    }

    .badge.up {
      background: #d1fae5;
      color: #065f46;
    }

    .badge.down {
      background: #fee2e2;
      color: #991b1b;
    }

    .return-positive {
      color: #065f46;
      font-weight: 700;
    }

    .return-negative {
      color: #991b1b;
      font-weight: 700;
    }

    .status-active {
      background-color: #d1fae5;
      color: #065f46;
      padding: 5px 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      user-select: none;
      display: inline-block;
    }

    .status-sl-hit {
      background-color: #fee2e2;
      color: #991b1b;
      padding: 5px 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      user-select: none;
      display: inline-block;
    }

    .loader {
      border: 6px solid var(--bg-col-default);
      border-top: 6px solid var(--primary-color);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 50px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .pagination button {
      padding: 10px 16px;
      border: 1px solid var(--border-primary);
      background: var(--bg-primary);
      color: var(--text-primary);
      cursor: pointer;
      border-radius: 12px;
      font-weight: 600;
      transition: background 0.2s ease;
      user-select: none;
    }

    .pagination button:hover:not(:disabled) {
      background: var(--bg-tertiary);
    }

    .pagination button.active {
      background: var(--primary-color);
      color: var(--bg-primary);
      border-color: var(--primary-color);
      font-weight: 700;
      user-select: none;
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      user-select: none;
    }

    @media (max-width: 768px) {
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr {
        margin-bottom: 16px;
        background: var(--bg-primary);
        border: 1px solid var(--border-primary);
        border-radius: 16px;
        padding: 16px;
        box-shadow: var(--shadow-sm);
      }
      td {
        padding-left: 50%;
        text-align: right;
        white-space: normal;
        position: relative;
        font-weight: 600;
        border: none;
        border-bottom: 1px solid var(--border-primary);
      }
      td::before {
        content: attr(data-label);
        position: absolute;
        left: 20px;
        width: 40%;
        text-align: left;
        font-weight: 600;
        color: var(--text-secondary);
        white-space: nowrap;
      }
    }

    .has-option-badge {
      background: #dbeafe;
      color: #1e40af;
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      display: inline-block;
      user-select: none;
    }
  </style>
</head>
<body>
  <h2>Stock Result</h2>

  <div class="controls">
    <input type="text" id="searchBox" placeholder="Search by Name..." />
    <select id="typeFilter">
      <option value="ALL">All</option>
      <option value="UP">UP</option>
      <option value="DOWN">DOWN</option>
    </select>
    <select id="periodFilter">
      <option value="current" selected>Current Month</option>
      <option value="previous">Previous Month</option>
      <option value="last3">Last 3 Months</option>
      <option value="all">All</option>
    </select>
    <button id="resetBtn" class="reset-btn">Reset</button>
  </div>

  <div id="loader" class="loader"></div>

  <table id="data-table">
    <thead>
      <tr>
        <th data-key="active">Trade</th>
        <th data-key="hasOption">Options</th>
        <th data-key="name">Name</th>
        <th data-key="exchange">Exchange</th>
        <th data-key="entryTime">Entry Time</th>
        <th data-key="type">Type</th>
        <th data-key="executedltp">Executed LTP</th>
        <th data-key="currentltp">Current LTP</th>
        <th data-key="sl">SL</th>
        <th data-key="comment">Return</th>
        <th data-key="result">Status</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>

  <div id="pagination" class="pagination"></div>

  <script>
    let stockData = [];
    let currentSort = { key: null, asc: true };
    let currentPage = 1;
    const rowsPerPage = 10;

    async function loadData() {
      const loader = document.getElementById("loader");
      const table = document.getElementById("data-table");
      loader.style.display = "block";
      table.style.display = "none";

      const periodVal = document.getElementById("periodFilter").value;

      try {
        const response = await fetch(`/api/getDetailsResults?period=${periodVal}`);
        if (!response.ok) throw new Error("Network error");
        stockData = await response.json();
        renderTable();
        loader.style.display = "none";
        table.style.display = "table";
      } catch (error) {
        console.error("Error fetching data:", error);
        loader.style.display = "none";
        document.body.insertAdjacentHTML(
          "beforeend",
          "<p style='color:red;text-align:center;'>Failed to load data.</p>"
        );
      }
    }

    function renderTable() {
      const tbody = document.getElementById("table-body");
      const searchVal = document.getElementById("searchBox").value.toLowerCase();
      const typeVal = document.getElementById("typeFilter").value;
      tbody.innerHTML = "";

      let filtered = stockData.filter((item) => {
        const displayType = (item.type || "").toUpperCase();
        const matchesSearch = item.name?.toLowerCase().includes(searchVal);
        const matchesType = typeVal === "ALL" || displayType === typeVal;
        return matchesSearch && matchesType;
      });

      if (currentSort.key) {
        filtered.sort((a, b) => {
          let valA = a[currentSort.key] ?? "";
          let valB = b[currentSort.key] ?? "";
          if (!isNaN(valA) && !isNaN(valB)) {
            valA = parseFloat(valA);
            valB = parseFloat(valB);
          } else {
            valA = valA.toString().toLowerCase();
            valB = valB.toString().toLowerCase();
          }
          if (valA < valB) return currentSort.asc ? -1 : 1;
          if (valA > valB) return currentSort.asc ? 1 : -1;
          return 0;
        });
      }

      const totalPages = Math.ceil(filtered.length / rowsPerPage);
      if (currentPage > totalPages) currentPage = totalPages || 1;
      const start = (currentPage - 1) * rowsPerPage;
      const paginated = filtered.slice(start, start + rowsPerPage);

      if (paginated.length === 0) {
        tbody.innerHTML = `<tr><td colspan="11" style="text-align:center;color:var(--text-muted);">No records found</td></tr>`;
      } else {
        paginated.forEach((item) => {
          const displayType = (item.type || "").toUpperCase();
          const badgeClass = displayType === "UP" ? "up" : displayType === "DOWN" ? "down" : "";
          let returnPercentClass = "";
          let returnText = item.comment || "";
          const returnMatch = returnText.match(/Return:\s*(-?[\d.]+)%/);
          if (returnMatch) {
            const value = parseFloat(returnMatch[1]);
            returnPercentClass = value >= 0 ? "return-positive" : "return-negative";
            returnText = `Return: ${value.toFixed(2)}%`;
          }

          let statusClass = "";
          let statusText = item.result || "";
          if (statusText.toUpperCase() === "ACTIVE") statusClass = "status-active";
          else if (statusText.toUpperCase() === "SL HIT") statusClass = "status-sl-hit";

          const optionsDisplay = item.hasOption === "Y" ? '<span class="has-option-badge">Yes</span>' : "No";

          const row = document.createElement("tr");
          row.innerHTML = `
            <td data-label="Traded">${item.active || "N"}</td>
            <td data-label="Options">${optionsDisplay}</td>
            <td data-label="Name">${item.name || ""}</td>
            <td data-label="Exchange">${item.exchange || ""}</td>
            <td data-label="Entry Time">${formatDate(item.entryTime)}</td>
            <td data-label="Type"><span class="badge ${badgeClass}">${displayType}</span></td>
            <td data-label="Executed LTP">${item.executedltp ?? ""}</td>
            <td data-label="Current LTP">${item.currentltp ?? ""}</td>
            <td data-label="SL">${item.sl ?? ""}</td>
            <td data-label="Return" class="${returnPercentClass}">${returnText}</td>
            <td data-label="Status" class="${statusClass}">${statusText}</td>
          `;
          tbody.appendChild(row);
        });
      }

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const pagination = document.getElementById("pagination");
      pagination.innerHTML = "";
      if (totalPages <= 1) return;

      const prev = document.createElement("button");
      prev.textContent = "Prev";
      prev.disabled = currentPage === 1;
      prev.onclick = () => { currentPage--; renderTable(); };
      pagination.appendChild(prev);

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        if (i === currentPage) btn.classList.add("active");
        btn.onclick = () => { currentPage = i; renderTable(); };
        pagination.appendChild(btn);
      }

      const next = document.createElement("button");
      next.textContent = "Next";
      next.disabled = currentPage === totalPages;
      next.onclick = () => { currentPage++; renderTable(); };
      pagination.appendChild(next);
    }

    function formatDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      return isNaN(d.getTime()) ? dateStr : d.toLocaleString();
    }

    document.getElementById("resetBtn").addEventListener("click", () => {
      document.getElementById("searchBox").value = "";
      document.getElementById("typeFilter").value = "ALL";
      document.getElementById("periodFilter").value = "current";
      currentPage = 1;
      currentSort = { key: null, asc: true };
      loadData();
    });

    document.getElementById("searchBox").addEventListener("input", () => {
      currentPage = 1;
      renderTable();
    });

    document.getElementById("typeFilter").addEventListener("change", () => {
      currentPage = 1;
      renderTable();
    });

    document.getElementById("periodFilter").addEventListener("change", () => {
      currentPage = 1;
      loadData();
    });

    document.querySelectorAll("thead th").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.getAttribute("data-key");
        if (currentSort.key === key) currentSort.asc = !currentSort.asc;
        else { currentSort.key = key; currentSort.asc = true; }
        renderTable();
      });
    });

    window.onload = loadData;
  </script>
</body>
</html>
