<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crumbs // Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0f1c;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.3);
            --success: #10b981;
            --error: #f43f5e;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.05);
            --accent: #4f46e5;
            --text-main: #1e293b;
            --text-dim: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 40%),
                radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.12) 0px, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 1rem 1.5rem;
        }

        .terminal-container { max-width: 1750px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }

        /* --- Compact Header --- */
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.5rem; }
        .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
        .logo span { color: var(--accent); opacity: 0.8; font-weight: 400; }

        /* --- Lean Glass Cards --- */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* --- Tighter Nav --- */
        .nav-wrapper { padding: 0.4rem; width: fit-content; }
        .nav-btn {
            padding: 0.5rem 1.2rem; border: none; border-radius: 12px;
            background: transparent; color: var(--text-dim);
            cursor: pointer; font-weight: 700; font-size: 0.8rem;
            transition: 0.2s ease;
        }
        .nav-btn.active {
            background: var(--accent); color: white;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* --- Reduced Stats Grid --- */
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
        .stat-card { padding: 1rem 1.25rem; border-left: 3px solid var(--accent); }
        .stat-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.25rem; letter-spacing: 0.5px; }
        .stat-value { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; }

        /* --- High Density Table --- */
        .table-card { padding: 0.5rem; }
        .scroll-area { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 4px; min-width: 1300px; }
        th { 
            padding: 0.75rem 0.8rem; text-align: left; font-size: 0.65rem; font-weight: 800; 
            text-transform: uppercase; color: var(--text-dim);
        }
        td { padding: 0.85rem 0.75rem; background: rgba(255, 255, 255, 0.02); border-top: 1px solid var(--glass-border); border-bottom: 1px solid var(--glass-border); font-size: 0.8rem; }
        td:first-child { border-left: 1px solid var(--glass-border); border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
        td:last-child { border-right: 1px solid var(--glass-border); border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
        
        tr:hover td { background: rgba(255, 255, 255, 0.04); }

        .symbol-main { font-weight: 750; font-size: 0.85rem; display: block; }
        .symbol-sub { font-size: 0.65rem; color: var(--text-dim); }

        .mono { font-family: 'ui-monospace', 'SFMono-Regular', 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-dim); }
        .badge-seller { padding: 3px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; background: rgba(129, 140, 248, 0.1); color: var(--accent); border: 1px solid rgba(129, 140, 248, 0.2); }
        
        .pnl-green { color: var(--success); font-weight: 700; }
        .pnl-red { color: var(--error); font-weight: 700; }
        
        .status-pill { padding: 2px 10px; border-radius: 12px; font-size: 0.65rem; font-weight: 700; border: 1px solid var(--glass-border); text-transform: uppercase; }

        .btn-refresh {
            background: var(--accent); color: white; border: none; padding: 0.5rem 1.25rem;
            border-radius: 12px; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: 0.2s;
        }
        .btn-refresh:hover { filter: brightness(1.1); }
    </style>
</head>
<body>

<div class="terminal-container">
    <header>
        <div class="logo">CRUMBS <span>// ORDERS</span></div>
        <div style="display: flex; gap: 0.75rem;">
            <button class="btn-refresh" onclick="refreshData()">REFRESH</button>
            <button class="nav-btn" style="background: var(--glass-bg); padding: 0.5rem 0.8rem;" onclick="toggleTheme()">🌓</button>
        </div>
    </header>

    <div class="glass-card nav-wrapper">
        <nav class="strategy-nav">
            <button class="nav-btn active" onclick="setStrategy(this, 'CPR')">CPR LEVELS</button>
            <button class="nav-btn" onclick="setStrategy(this, 'SHORT_STRADDLE_NIFTY')">NIFTY STRADDLE</button>
            <button class="nav-btn" onclick="setStrategy(this, 'SHORT_STRADDLE_CRUDEOIL')">CRUDEOIL STRADDLE</button>
        </nav>
    </div>

    <div class="stats-row">
        <div class="glass-card stat-card">
            <div class="stat-label">Active System</div>
            <div class="stat-value" id="stat-name">CPR</div>
        </div>
        <div class="glass-card stat-card">
            <div class="stat-label">Orders</div>
            <div class="stat-value" id="stat-count">0</div>
        </div>
        <div class="glass-card stat-card">
            <div class="stat-label">Captured Points</div>
            <div class="stat-value" id="stat-points">0.00</div>
        </div>
        <div class="glass-card stat-card">
            <div class="stat-label">Session PnL</div>
            <div class="stat-value" id="stat-pnl">₹0.00</div>
        </div>
    </div>

    <div class="glass-card table-card">
        <div class="scroll-area">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Entry Time</th>
                        <th>Exit Time</th>
                        <th>Instrument</th>
                        <th>Strike</th>
                        <th>Side</th>
                        <th>Qty</th>
                        <th>Entry Pr.</th>
                        <th>Exit Pr.</th>
                        <th>Points</th>
                        <th>Net PnL</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="orderBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let currentStrategy = 'CPR';

    async function refreshData() {
        const tbody = document.getElementById('orderBody');
        try {
            const response = await fetch(`/api/orders/orderList?name=${currentStrategy}`);
            const data = await response.json();
            
            let totalPoints = 0, totalPnl = 0;

            tbody.innerHTML = data.map((o) => {
                totalPoints += (o.points || 0);
                totalPnl += (o.pnl || 0);
                const isPos = o.pnl >= 0;
                const pnlClass = isPos ? 'pnl-green' : 'pnl-red';

                return `
                    <tr>
                        <td class="mono">#${o.id || '--'}</td>
                        <td class="mono">${o.entryTime || '--'}</td>
                        <td class="mono">${o.exitTime || '--'}</td>
                        <td>
                            <span class="symbol-main">${o.symbol || 'N/A'}</span>
                            <span class="symbol-sub">${o.instrumentType || ''}</span>
                        </td>
                        <td style="font-weight: 700; color: var(--text-main);">${o.strike || '--'}</td>
                        <td><span class="badge-seller">${o.strategyType || 'Option Seller'}</span></td>
                        <td style="font-weight: 700;">${o.quantity || 0}</td>
                        <td class="mono">₹${o.entryPrice ? o.entryPrice.toFixed(2) : '0.00'}</td>
                        <td class="mono">${o.exitPrice ? '₹' + o.exitPrice.toFixed(2) : '--'}</td>
                        <td class="${pnlClass}">${isPos ? '+' : ''}${o.points ? o.points.toFixed(2) : '0.00'}</td>
                        <td class="${pnlClass}">₹${o.pnl ? o.pnl.toLocaleString('en-IN') : '0'}</td>
                        <td><span class="status-pill">${o.status || 'OPEN'}</span></td>
                    </tr>
                `;
            }).join('');

            document.getElementById('stat-count').innerText = data.length;
            document.getElementById('stat-points').innerText = totalPoints.toFixed(2);
            const pnlEl = document.getElementById('stat-pnl');
            pnlEl.innerText = `₹${totalPnl.toLocaleString('en-IN')}`;
            pnlEl.style.color = totalPnl >= 0 ? 'var(--success)' : 'var(--error)';
        } catch (err) { console.error(err); }
    }

    function setStrategy(btn, name) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStrategy = name;
        document.getElementById('stat-name').innerText = name.replace('SHORT_STRADDLE_', '').replace('_', ' ');
        refreshData();
    }

    function toggleTheme() {
        const h = document.documentElement;
        h.setAttribute('data-theme', h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }

    setInterval(refreshData, 30000);
    window.onload = refreshData;
</script>
</body>
</html>
