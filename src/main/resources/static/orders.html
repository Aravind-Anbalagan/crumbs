<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategies – Orders Launcher</title>
    <script>
    // Authentication check - must be at the top
    if (!sessionStorage.getItem('isLoggedIn')) {
        window.location.href = '/';
    }
</script>
    <style>
        /* --- your existing styles unchanged --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --accent: #10b981;
            --accent-light: #34d399;
            --background: #0f172a;
            --background-light: #1e293b;
            --surface: #1e293b;
            --surface-elevated: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        [data-theme="light"] {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --accent: #059669;
            --accent-light: #10b981;
            --background: #f8fafc;
            --background-light: #f1f5f9;
            --surface: #ffffff;
            --surface-elevated: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            z-index: -1;
            animation: gradientShift 15s ease infinite;
        }

        [data-theme="light"] body::before {
            background:
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .shell-root {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 1rem;
        }

        .shell-container {
            width: 100%;
            max-width: 1600px;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            height: calc(100vh - 2rem);
        }

        .tiles-header {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            flex-shrink: 0;
        }

        .theme-toggle {
            padding: 0.65rem 1.25rem;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            height: 100%;
            min-height: 60px;
        }

        .theme-toggle:hover {
            background: rgba(99, 102, 241, 0.25);
            transform: translateY(-4px);
            box-shadow:
                0 12px 24px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(99, 102, 241, 0.2);
        }

        [data-theme="light"] .theme-toggle {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        [data-theme="light"] .theme-toggle:hover {
            background: rgba(99, 102, 241, 0.15);
            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.12),
                0 0 0 1px rgba(99, 102, 241, 0.3);
        }

        .strategy-tiles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 0.75rem;
            flex: 1;
        }

        .tile {
            position: relative;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 0.65rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        [data-theme="light"] .tile {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .tile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tile:hover {
            background: rgba(30, 41, 59, 0.7);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-4px);
            box-shadow:
                0 12px 24px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(99, 102, 241, 0.2);
        }

        [data-theme="light"] .tile:hover {
            background: rgba(255, 255, 255, 1);
            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.12),
                0 0 0 1px rgba(99, 102, 241, 0.3);
        }

        .tile:hover::before {
            opacity: 1;
        }

        .tile.active {
            background: rgba(99, 102, 241, 0.12);
            border-color: var(--primary);
            box-shadow:
                0 8px 32px rgba(99, 102, 241, 0.3),
                0 0 0 1px rgba(99, 102, 241, 0.5);
        }

        [data-theme="light"] .tile.active {
            background: rgba(99, 102, 241, 0.08);
            box-shadow:
                0 4px 24px rgba(99, 102, 241, 0.2),
                0 0 0 1px rgba(99, 102, 241, 0.4);
        }

        .tile.active::before {
            opacity: 1;
        }

        .tile-icon {
            font-size: 1.5rem;
            display: block;
            filter: drop-shadow(0 2px 8px rgba(99, 102, 241, 0.4));
            flex-shrink: 0;
        }

        .tile-content {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            flex: 1;
        }

        .tile-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .tile-subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        .shell-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            min-height: 0;
        }

        [data-theme="light"] .shell-main {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        .shell-main-header {
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.4);
            flex-shrink: 0;
        }

        [data-theme="light"] .shell-main-header {
            background: rgba(248, 250, 252, 0.8);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .shell-main-title {
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .shell-main-title::before {
            content: '';
            width: 3px;
            height: 16px;
            background: linear-gradient(180deg, var(--primary), var(--accent));
            border-radius: 2px;
        }

        .shell-main-status {
            font-size: 0.7rem;
            color: var(--text-secondary);
            padding: 0.3rem 0.7rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-family: 'Monaco', 'Courier New', monospace;
        }

        [data-theme="light"] .shell-main-status {
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .shell-main-body {
            flex: 1;
            position: relative;
            background: rgba(15, 23, 42, 0.3);
        }

        [data-theme="light"] .shell-main-body {
            background: rgba(248, 250, 252, 0.5);
        }

        #strategyContent {
            width: 100%;
            height: 100%;
            overflow: auto;
        }

        #strategyContent::-webkit-scrollbar {
            width: 10px;
        }

        #strategyContent::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }

        [data-theme="light"] #strategyContent::-webkit-scrollbar-track {
            background: rgba(226, 232, 240, 0.5);
        }

        #strategyContent::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 5px;
        }

        #strategyContent::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.7);
        }

        .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            text-align: center;
            padding: 3rem;
        }

        .placeholder-content {
            max-width: 400px;
        }

        .spinner {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .shell-root {
                padding: 1rem;
            }
            
            .strategy-tiles {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .shell-root {
                padding: 0.75rem;
            }
            
            .tiles-header {
                flex-direction: column;
                gap: 0.75rem;
            }
            
            .strategy-tiles {
                grid-template-columns: 1fr;
            }
            
            .theme-toggle {
                width: 100%;
                min-height: 50px;
            }
            
            .shell-main-header {
                flex-direction: column;
                gap: 0.75rem;
                align-items: flex-start;
                padding: 1rem 1.5rem;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .shell-container > * {
            animation: fadeIn 0.5s ease-out backwards;
        }

        .tiles-header {
            animation-delay: 0.1s;
        }

        .shell-main {
            animation-delay: 0.2s;
        }
    </style>
</head>
<body>
<div class="shell-root">
    <div class="shell-container">
        <!-- Strategy Tiles with Theme Toggle -->
        <section class="tiles-header">
            <div class="strategy-tiles">
                <div class="tile active" data-strategy="intraday-all" onclick="selectStrategy(this)">
                    <span class="tile-icon">📈</span>
                    <div class="tile-content">
                        <div class="tile-title">SR Strategy</div>
                        <div class="tile-subtitle">Support & Resistance</div>
                    </div>
                </div>
                <div class="tile" data-strategy="price-action" onclick="selectStrategy(this)">
                    <span class="tile-icon">💹</span>
                    <div class="tile-content">
                        <div class="tile-title">HEIKIN-PSAR</div>
                        <div class="tile-subtitle">HeikinAshi PSAR</div>
                    </div>
                </div>
                <div class="tile" data-strategy="fibo" onclick="selectStrategy(this)">
                    <span class="tile-icon">🎯</span>
                    <div class="tile-content">
                        <div class="tile-title">CPR Strategy</div>
                        <div class="tile-subtitle">CPR Levels</div>
                    </div>
                </div>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
                <span id="themeIcon">🌙</span>
            </button>
        </section>

        <!-- Main Content Area -->
        <main class="shell-main">
            <div class="shell-main-header">
                <div class="shell-main-title" id="currentStrategyTitle">SR Strategy</div>
                <div class="shell-main-status">
                    <span id="currentStrategyStatus">orderList.html | /api/orders?name=SR</span>
                </div>
            </div>
            <div class="shell-main-body">
                <div id="strategyContent">
                    <div class="placeholder">
                        <div class="placeholder-content">
                            <div class="spinner"></div>
                            <div>Loading initial strategy view…</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    // Parent mapping: tile key -> API name + file
    const strategyConfig = {
        'intraday-all': {
            title: 'SR Strategy',
            apiName: 'SR',             // /api/orders?name=SR
            path: 'orderList.html'
        },
        'price-action': {
            title: 'HEIKIN-PSAR',
            apiName: 'HEIKIN_PSAR',    // /api/orders?name=HEIKIN_PSAR
            path: 'orderList.html'
        },
        'fibo': {
            title: 'CPR Strategy',
            apiName: 'CPR',            // /api/orders?name=CPR
            path: 'orderList.html'
        }
    };

    let currentStrategyKey = 'intraday-all';
    window.currentStrategyApiName = strategyConfig[currentStrategyKey].apiName;

    async function loadStrategyHtml(strategyKey) {
        const config = strategyConfig[strategyKey];
        if (!config) return;

        const contentDiv = document.getElementById('strategyContent');
        contentDiv.innerHTML = `
            <div class="placeholder">
                <div class="placeholder-content">
                    <div class="spinner"></div>
                    <div>Loading ${config.title}…</div>
                </div>
            </div>
        `;

        try {
            const response = await fetch(config.path);
            if (!response.ok) {
                contentDiv.innerHTML = `
                    <div class="placeholder">
                        <div class="placeholder-content">
                            <div style="font-size: 2rem; margin-bottom: 1rem;">⚠️</div>
                            <div style="color: var(--error); font-weight: 600; margin-bottom: 0.5rem;">
                                Failed to load ${config.title}
                            </div>
                            <div style="font-size: 0.85rem; color: var(--text-secondary);">
                                Check that <strong>${config.path}</strong> is reachable.
                            </div>
                        </div>
                    </div>
                `;
                return;
            }
            const html = await response.text();

            contentDiv.innerHTML = '';
            const wrapper = document.createElement('div');
            wrapper.id = 'strategy-wrapper-' + Date.now();
            wrapper.innerHTML = html;
            contentDiv.appendChild(wrapper);

            // expose current API name to child page
            window.currentStrategyApiName = config.apiName;

            const scripts = wrapper.querySelectorAll('script');
            scripts.forEach(oldScript => {
                const newScript = document.createElement('script');
                Array.from(oldScript.attributes).forEach(attr => {
                    newScript.setAttribute(attr.name, attr.value);
                });
                newScript.textContent = `(function(){ ${oldScript.textContent} })();`;
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        } catch (e) {
            console.error('Error loading strategy HTML', e);
            contentDiv.innerHTML = `
                <div class="placeholder">
                    <div class="placeholder-content">
                        <div style="font-size: 2rem; margin-bottom: 1rem;">❌</div>
                        <div style="color: var(--error); font-weight: 600; margin-bottom: 0.5rem;">
                            Error loading ${config.title}
                        </div>
                        <div style="font-size: 0.85rem; color: var(--text-secondary);">
                            See console for details.
                        </div>
                    </div>
                </div>
            `;
        }
    }

    function selectStrategy(tileEl) {
        const strategyKey = tileEl.getAttribute('data-strategy');
        if (!strategyKey || strategyKey === currentStrategyKey) return;

        currentStrategyKey = strategyKey;

        document
            .querySelectorAll('.tile')
            .forEach(t => t.classList.toggle('active', t === tileEl));

        const config = strategyConfig[strategyKey];
        document.getElementById('currentStrategyTitle').textContent = config.title;
        document.getElementById('currentStrategyStatus').textContent =
            `${config.path} | /api/orders?name=${config.apiName}`;

        loadStrategyHtml(strategyKey);
    }

    // Theme functionality
    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
        const icon = document.getElementById('themeIcon');
        icon.textContent = theme === 'dark' ? '🌙' : '☀️';
    }

    document.addEventListener('DOMContentLoaded', () => {
        initTheme();
        loadStrategyHtml(currentStrategyKey);
    });
</script>
</body>
</html>
