<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crumbs // 4-Group Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0f1c;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #818cf8;
            --success: #10b981;
            --error: #f43f5e;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --card-inner: rgba(255, 255, 255, 0.03);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.1);
            --accent: #4f46e5;
            --success: #059669;
            --error: #dc2626;
            --text-main: #0f172a;
            --text-dim: #64748b;
            --card-inner: rgba(0, 0, 0, 0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); background-image: radial-gradient(at 0% 0%, var(--accent), transparent 30%); background-attachment: fixed; color: var(--text-main); min-height: 100vh; padding: 1.5rem; transition: background 0.3s ease; }
        
        .terminal-container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
        header { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
        .logo span { color: var(--accent); opacity: 0.8; }
        
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 12px; }
        
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.7rem; }
        .stat-card { padding: 0.8rem 1.2rem; border-left: 4px solid var(--accent); }
        .stat-label { font-size: 0.65rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; }
        .stat-value { font-size: 1.5rem; font-weight: 800; margin-top: 0.2rem; }

        .nav-btn { padding: 0.6rem 1.2rem; border: none; border-radius: 8px; background: transparent; color: var(--text-dim); cursor: pointer; font-weight: 700; font-size: 0.85rem; }
        .nav-btn.active { background: var(--accent); color: white; }

        .orders-grid { display: flex; flex-direction: column; gap: 1.2rem; }
        .straddle-card { padding: 1.2rem; border-left: 5px solid var(--accent); box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .straddle-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.8rem; border-bottom: 1px solid var(--glass-border); margin-bottom: 1rem; }
        
        .leg-row { 
            display: grid; 
            grid-template-columns: 80px 1.5fr 100px 80px 80px 1fr 1fr 120px 100px;
            align-items: center;
            padding: 0.8rem 1rem;
            background: var(--card-inner);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .mono { font-family: 'ui-monospace', 'SFMono-Regular', monospace; font-weight: 700; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; border: 1px solid currentColor; display: inline-block; text-align: center; }
        .dir-buy { color: var(--success); }
        .dir-sell { color: var(--error); }
        .pnl-green { color: var(--success); }
        .pnl-red { color: var(--error); }
        
        .theme-btn { background: var(--glass-bg); color: var(--text-main); border: 1px solid var(--glass-border); padding: 0.5rem 1rem; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div class="terminal-container">
    <header>
        <div class="logo">CRUMBS <span>// STRATEGY</span></div>
        <div style="display: flex; gap: 0.8rem; align-items: center;">
            <div id="liveIndicator" style="font-size: 0.7rem; font-weight: 800; color: var(--success);">● LIVE</div>
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀️ LIGHT MODE</button>
            <button class="theme-btn" style="background: var(--accent); color: white;" onclick="refreshData()">REFRESH</button>
        </div>
    </header>

    <div class="glass-card" style="padding: 0.3rem; width: fit-content;">
        <nav style="display: flex; gap: 4px;">
            <button class="nav-btn active" onclick="setStrategy(this, 'CPR')">CPR Strategy</button>
            <button class="nav-btn" onclick="setStrategy(this, 'SHORT_STRADDLE_NIFTY')">Nifty Straddle</button>
            <button class="nav-btn" onclick="setStrategy(this, 'SHORT_STRADDLE_CRUDEOILM')">Crude Straddle</button>
        </nav>
    </div>

    <div class="stats-row">
        <div class="glass-card stat-card"><div class="stat-label">System</div><div class="stat-value" id="stat-name">CPR</div></div>
        <div class="glass-card stat-card"><div class="stat-label">Active Groups</div><div class="stat-value" id="stat-count">0</div></div>
        <div class="glass-card stat-card"><div class="stat-label">Total Points</div><div class="stat-value" id="stat-points">0.00</div></div>
        <div class="glass-card stat-card"><div class="stat-label">Net Realized</div><div class="stat-value" id="stat-pnl">₹0</div></div>
    </div>

    <div id="ordersContainer" class="orders-grid"></div>
</div>

<script>
    let currentStrategy = 'CPR';

    function toggleTheme() {
        const body = document.documentElement;
        const btn = document.getElementById('themeBtn');
        if (body.getAttribute('data-theme') === 'dark') {
            body.setAttribute('data-theme', 'light');
            btn.innerText = '🌙 DARK MODE';
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerText = '☀️ LIGHT MODE';
        }
    }

    async function refreshData() {
        if (document.hidden) return;
        const container = document.getElementById('ordersContainer');
        try {
            const response = await fetch(`/api/orders/orderList?name=${currentStrategy}`);
            let data = await response.json();
            
            // --- FIXED GROUPING LOGIC ---
            const groups = {};
            data.forEach(o => {
                // Use Strike as the primary key. If strike is same, they go in one card.
                // Fallback to tradeCycleId or just the ID if everything else is missing.
                const key = o.strike || o.tradeCycleId || `id_${o.id}`;

                if (!groups[key]) {
                    groups[key] = { legs: [], totalPnl: 0, totalPts: 0, strike: o.strike };
                }
                groups[key].legs.push(o);
                groups[key].totalPnl += (o.pnl || 0);
                groups[key].totalPts += (o.points || 0);
            });

            let cardsHtml = "";
            let overallPnl = 0, overallPts = 0;

            Object.keys(groups).forEach(key => {
                const group = groups[key];
                overallPnl += group.totalPnl;
                overallPts += group.totalPts;

                let legsHtml = "";
                // Sort legs so CE comes first
                group.legs.sort((a,b) => (a.symbol || "").includes('CE') ? -1 : 1);

                group.legs.forEach(l => {
                    const dirClass = l.direction === 'BUY' ? 'dir-buy' : 'dir-sell';
                    legsHtml += `
                        <div class="leg-row">
                            <div class="mono" style="color:var(--text-dim); font-size:0.7rem;">#${l.id}</div>
                            <div style="font-weight:800; font-size:0.9rem;">${l.symbol}</div>
                            <div class="mono" style="color:var(--accent)">${l.strike || '--'}</div>
                            <div><span class="badge ${dirClass}">${l.direction || 'SELL'}</span></div>
                            <div class="mono" style="font-size:0.8rem">QTY:${l.quantity}</div>
                            <div class="mono">ENT: ₹${(l.entryPrice || 0).toFixed(2)}</div>
                            <div class="mono">EXIT: ${l.exitPrice > 0 ? '₹'+l.exitPrice.toFixed(2) : '--'}</div>
                            <div class="mono ${l.pnl >= 0 ? 'pnl-green' : 'pnl-red'}" style="font-size:1rem">₹${(l.pnl || 0).toLocaleString('en-IN')}</div>
                            <div style="font-size:0.65rem; text-align:right; font-weight:800; color:var(--text-dim); text-transform:uppercase;">${l.status}</div>
                        </div>
                    `;
                });

                cardsHtml += `
                    <div class="glass-card straddle-card">
                        <div class="straddle-header">
                            <div style="display:flex; flex-direction:column">
                                <span style="font-size:0.65rem; font-weight:800; color:var(--text-dim); text-transform:uppercase;">Strike Group</span>
                                <span style="font-size:1.1rem; font-weight:800;">${group.strike || 'N/A'} Straddle Pair</span>
                            </div>
                            <div style="text-align:right">
                                <span style="font-size:0.65rem; font-weight:800; color:var(--text-dim); text-transform:uppercase;">Combined PnL</span>
                                <div class="mono ${group.totalPnl >= 0 ? 'pnl-green' : 'pnl-red'}" style="font-size:1.3rem">
                                    ₹${group.totalPnl.toLocaleString('en-IN')}
                                </div>
                            </div>
                        </div>
                        ${legsHtml}
                    </div>
                `;
            });

            container.innerHTML = cardsHtml || `<div style="text-align:center; padding:3rem; color:var(--text-dim)">Waiting for data...</div>`;
            
            document.getElementById('stat-count').innerText = Object.keys(groups).length;
            document.getElementById('stat-points').innerText = overallPts.toFixed(2);
            const pnlEl = document.getElementById('stat-pnl');
            pnlEl.innerText = `₹${overallPnl.toLocaleString('en-IN')}`;
            pnlEl.style.color = overallPnl >= 0 ? 'var(--success)' : 'var(--error)';

        } catch (e) { 
            console.error("Fetch Error:", e);
            document.getElementById('ordersContainer').innerHTML = `<div style="color:var(--error); text-align:center; padding:2rem;">Data Error: Check console</div>`;
        }
    }

    function setStrategy(btn, name) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStrategy = name;
        document.getElementById('stat-name').innerText = name.replace('SHORT_STRADDLE_', '').replace('_', ' ');
        refreshData();
    }

    setInterval(refreshData, 30000);
    window.onload = refreshData;
</script>
</body>
</html>
