<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chart</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    if (!sessionStorage.getItem('isLoggedIn')) { window.location.href = '/'; }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter&display=swap');
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #container {
      margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #2c3e50 0%, #4a5568 100%);
      color: #333;
    }
    #chart {
      position: absolute; top: 16px; left: 16px;
      width: calc(100% - 32px); height: calc(100% - 32px);
      display: none; border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3); background: #fff;
    }
    #chart.drawing-mode { cursor: crosshair; }
    #loader {
      position: absolute; inset: 0; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.95); z-index: 10; gap: 16px;
    }
    .spinner {
      border: 6px solid #e0e0e0; border-top-color: #4a5568;
      border-radius: 50%; width: 48px; height: 48px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loaderText { font-size: 15px; font-weight: 600; color: #4a5568; }
    #retryCount { font-size: 13px; color: #666; }
    #error {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%);
      background: #ffe6e6; color: #cc0000; padding: 20px 30px; border-radius: 12px;
      font-weight: 600; display: none; z-index: 20; max-width: 80vw; text-align: center;
      box-shadow: 0 4px 12px rgba(204,0,0,0.3);
    }
    #apiErrorToast {
      position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
      background: rgba(239,68,68,0.95); color: #fff; padding: 14px 24px;
      border-radius: 10px; font-weight: 600; display: none; z-index: 40; font-size: 14px;
      box-shadow: 0 8px 24px rgba(239,68,68,0.4); backdrop-filter: blur(10px);
    }
    #apiErrorToast.show { display: block; }
    #apiErrorToast.fade-out { animation: fadeOut 0.5s ease forwards; }
    @keyframes fadeOut {
      from { opacity:1; transform:translateX(-50%) translateY(0); }
      to   { opacity:0; transform:translateX(-50%) translateY(-20px); }
    }
    #toolbar {
      position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
      z-index: 31; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
      border-radius: 12px; padding: 14px 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      display: flex; gap: 20px; align-items: center; font-size: 14px;
      user-select: none; max-width: 90vw; border: 1px solid rgba(255,255,255,0.3);
    }
    #toolbar .group { display: flex; gap: 12px; align-items: center; }
    #toolbar label { font-weight: 500; color: #444; white-space: nowrap; }
    #toolbar select {
      font-size: 13px; padding: 6px 12px; border-radius: 8px; min-width: 110px; height: 32px;
      cursor: pointer; font-weight: 500; color: #444; border: 2px solid #e0e0e0; background: #fff;
      transition: border-color .2s;
    }
    #toolbar select:focus { outline: none; border-color: #4a5568; }
    .tb-btn {
      background: linear-gradient(135deg, #4a5568, #2d3748); color: #fff;
      border: none; font-weight: 600; padding: 8px 18px; border-radius: 8px;
      cursor: pointer; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.2);
      white-space: nowrap; transition: transform .2s, box-shadow .2s;
    }
    .tb-btn.green { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .tb-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
    #settingsDropdown { position: absolute; top: 24px; left: 24px; z-index: 30; user-select: none; }
    #settingsMenu {
      display: none; position: absolute; top: 48px; left: 0;
      background: rgba(255,255,255,0.98); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3); border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,.15); padding: 16px 24px;
      min-width: 290px; font-size: 13px; color: #333; max-height: 80vh; overflow-y: auto;
    }
    #settingsMenu.open { display: block; animation: slideDown .25s ease; }
    @keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
    .sec-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      color: #9ca3af; margin: 14px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #f0f0f0;
    }
    .sec-title:first-child { margin-top: 0; }
    #settingsMenu label {
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
      padding: 5px 6px; border-radius: 6px; cursor: pointer;
    }
    #settingsMenu label:hover { background: rgba(74,85,104,.07); }
    .line-dot { width: 14px; height: 3px; border-radius: 2px; flex-shrink: 0; }
    #settingsMenu input[type="checkbox"] {
      width: 16px; height: 16px; cursor: pointer; accent-color: #4a5568; margin: 0; flex-shrink: 0;
    }
    .sr-count { font-size: 10px; color: #9ca3af; margin-left: auto; }
    .conf-label { font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px; margin: 8px 0 6px 6px; }
    .conf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 6px; }
    .conf-chip { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; cursor: pointer; margin: 0; }
    .conf-chip:hover { background: rgba(74,85,104,.07); }
    .conf-chip input { width: 14px; height: 14px; margin: 0; flex-shrink: 0; cursor: pointer; accent-color: #4a5568; }
    .chip { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
    .chip.ABSOLUTE { background:#fee2e2; color:#b91c1c; border:1px solid #fca5a5; }
    .chip.HIGH     { background:#fff7ed; color:#c2410c; border:1px solid #fdba74; }
    .chip.MODERATE { background:#fefce8; color:#a16207; border:1px solid #fde047; }
    .chip.LOW      { background:#f0fdf4; color:#15803d; border:1px solid #86efac; }
    .chip.UNTESTED { background:#f1f5f9; color:#64748b; border:1px solid #cbd5e1; }
    .set-btn {
      display: block; width: 100%; padding: 9px 0; font-size: 13px;
      border-radius: 9px; cursor: pointer; font-weight: 600; margin-top: 7px; transition: .2s;
    }
    #btnUncheckAll { background:#fff3e0; border:2px solid #ffb74d; color:#e65100; }
    #btnReset      { background:#f4f6f8; border:2px solid #e0e0e0; color:#444; }
    #btnFit        { background:linear-gradient(135deg,#4a5568,#2d3748); border:none; color:#fff; box-shadow:0 4px 12px rgba(0,0,0,.2); }
    #btnUncheckAll:hover { background:#ffe0b2; }
    #btnReset:hover      { background:#e0e0e0; }
    #btnFit:hover        { box-shadow:0 6px 20px rgba(0,0,0,.3); transform:translateY(-1px); }
    #drawingTools {
      position: absolute; top: 24px; right: 24px; z-index: 30;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
      border-radius: 12px; padding: 10px; box-shadow: 0 8px 32px rgba(0,0,0,.15);
      display: flex; gap: 8px; align-items: center;
    }
    .draw-btn {
      width: 40px; height: 40px; border: 2px solid #e0e0e0; border-radius: 8px;
      background: #fff; cursor: pointer; font-size: 20px; font-weight: 700; color: #444;
      display: flex; align-items: center; justify-content: center; transition: .2s;
    }
    .draw-btn:hover  { border-color: #4a5568; transform: translateY(-2px); }
    .draw-btn.active { background: linear-gradient(135deg,#4a5568,#2d3748); color:#fff; border-color:#4a5568; }
    .color-div { width: 1px; height: 28px; background: #e0e0e0; }
    #colorPicker { width:40px; height:40px; border:2px solid #e0e0e0; border-radius:8px; cursor:pointer; padding:0; }
    #drawIndicator {
      position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: rgba(74,85,104,.95); color:#fff; padding:10px 22px;
      border-radius: 8px; font-size:14px; font-weight:600; display:none; z-index:30;
    }
    #clockPanel {
      position: absolute; bottom: 24px; right: 24px; z-index: 30;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
      border-radius: 10px; padding: 8px 16px; box-shadow: 0 4px 16px rgba(0,0,0,.1);
      font-size:12px; font-weight:600; color:#4a5568;
      display:flex; flex-direction:column; gap:4px; min-width:120px; text-align:center;
    }
    #liveTime { font-size:18px; font-weight:700; color:#2d3748; font-family:monospace; }
    #sseStatus { display:flex; align-items:center; justify-content:center; gap:5px; font-size:10px; color:#888; }
    #sseDot { width:6px; height:6px; border-radius:50%; background:#ccc; display:inline-block; }
    #sseDot.live { background:#22c55e; animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }
    #pricePanel {
      position: absolute; top: 90px; right: 24px; z-index: 30;
      background: rgba(255,255,255,0.98); backdrop-filter: blur(10px);
      border-radius: 12px; padding: 16px 20px; box-shadow: 0 8px 32px rgba(0,0,0,.15);
      min-width: 200px; display:none;
    }
    #pricePanel.show { display:block; }
    .pp-label { font-size:11px; font-weight:600; color:#666; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
    .pp-price { font-size:28px; font-weight:700; font-family:monospace; margin-bottom:8px; }
    .pp-price.up { color:#22c55e; } .pp-price.down { color:#ef4444; }
    .pp-change { font-size:14px; font-weight:600; margin-bottom:10px; }
    .pp-change.up { color:#22c55e; } .pp-change.down { color:#ef4444; }
    .pp-stats { border-top:1px solid #e5e7eb; padding-top:10px; font-size:12px; color:#666; display:flex; flex-direction:column; gap:5px; }
    .pp-row { display:flex; justify-content:space-between; }
    .pp-val { font-weight:700; font-family:monospace; }
    @keyframes priceFlash { 0%,100%{background:transparent} 50%{background:rgba(34,197,94,.15)} }
    .flash { animation: priceFlash .4s ease; }
    #srTooltip { position: fixed; z-index: 50; pointer-events: none; width: 270px; display: none; }
    #srTooltip.show { display:block; animation: ttFade .15s ease; }
    @keyframes ttFade { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
    .tt-card {
      background: rgba(15,23,42,.97); backdrop-filter:blur(12px);
      border-radius:12px; padding:14px 16px; color:#f1f5f9; font-size:12px;
      box-shadow: 0 16px 48px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06);
    }
    .tt-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,.08); }
    .tt-type { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; padding:3px 8px; border-radius:4px; }
    .tt-type.support    { background:rgba(34,197,94,.2);  color:#4ade80; border:1px solid rgba(34,197,94,.3); }
    .tt-type.resistance { background:rgba(239,68,68,.2);  color:#f87171; border:1px solid rgba(239,68,68,.3); }
    .tt-price { font-size:20px; font-weight:700; font-family:monospace; }
    .tt-price.support { color:#4ade80; } .tt-price.resistance { color:#f87171; }
    .tt-conf-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .tt-conf-lbl { font-size:9px; color:#94a3b8; font-weight:700; text-transform:uppercase; }
    .tt-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; }
    .tt-badge.ABSOLUTE { background:#7f1d1d; color:#fca5a5; border:1px solid #991b1b; }
    .tt-badge.HIGH     { background:#431407; color:#fdba74; border:1px solid #7c2d12; }
    .tt-badge.MODERATE { background:#422006; color:#fde047; border:1px solid #713f12; }
    .tt-badge.LOW      { background:#052e16; color:#86efac; border:1px solid #14532d; }
    .tt-badge.UNTESTED { background:#1e293b; color:#94a3b8; border:1px solid #334155; }
    .tt-dots { display:flex; gap:3px; }
    .tt-dot { width:7px; height:7px; border-radius:50%; background:#334155; }
    .tt-dot.on.support    { background:#22c55e; box-shadow:0 0 4px #22c55e60; }
    .tt-dot.on.resistance { background:#ef4444; box-shadow:0 0 4px #ef444460; }
    .tt-stats { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px; }
    .tt-stat { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06); border-radius:7px; padding:7px 10px; }
    .tt-stat-lbl { font-size:9px; text-transform:uppercase; letter-spacing:.5px; color:#64748b; font-weight:700; margin-bottom:3px; }
    .tt-stat-val { font-size:16px; font-weight:700; font-family:monospace; color:#e2e8f0; }
    .tt-stat-val.green { color:#4ade80; } .tt-stat-val.red { color:#f87171; } .tt-stat-val.amber { color:#fbbf24; }
    .tt-bar-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .tt-bar-lbl { font-size:9px; text-transform:uppercase; color:#64748b; font-weight:700; width:68px; flex-shrink:0; }
    .tt-track { flex:1; height:5px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden; }
    .tt-fill { height:100%; border-radius:3px; transition:width .4s; }
    .tt-fill.green { background:linear-gradient(90deg,#16a34a,#4ade80); }
    .tt-fill.red   { background:linear-gradient(90deg,#dc2626,#f87171); }
    .tt-bar-num { font-size:10px; color:#94a3b8; font-weight:700; width:24px; text-align:right; }
    .tt-foot { border-top:1px solid rgba(255,255,255,.07); padding-top:8px; display:flex; align-items:center; justify-content:space-between; }
    .tt-vc { display:flex; align-items:center; gap:5px; font-size:10px; font-weight:600; }
    .tt-vc-dot { width:7px; height:7px; border-radius:50%; }
    .tt-vc-dot.on { background:#22c55e; box-shadow:0 0 5px #22c55e; } .tt-vc-dot.off { background:#475569; }
    .tt-last { font-size:10px; color:#64748b; } .tt-last span { color:#94a3b8; font-weight:700; }
    .tt-decision { margin-top:9px; padding:8px 10px; border-radius:8px; font-size:11px; font-weight:700; text-align:center; }
    .tt-decision.strong { background:rgba(34,197,94,.15); color:#4ade80; border:1px solid rgba(34,197,94,.25); }
    .tt-decision.watch  { background:rgba(234,179,8,.15);  color:#fbbf24; border:1px solid rgba(234,179,8,.25); }
    .tt-decision.risky  { background:rgba(239,68,68,.15);  color:#f87171; border:1px solid rgba(239,68,68,.25); }
    .tt-decision.stale  { background:rgba(100,116,139,.15);color:#94a3b8; border:1px solid rgba(100,116,139,.2); }
  </style>
</head>
<body>
<div id="container">

  <div id="toolbar">
    <div class="group">
      <label for="symbolSelect">Name:</label>
      <select id="symbolSelect">
        <option value="NIFTY" selected>NIFTY</option>
        <option value="CRUDEOIL">CRUDEOIL</option>
        <option value="SILVERM">SILVERM</option>
      </select>
    </div>
    <div class="group">
      <label for="tfSelect">TimeFrame:</label>
      <select id="tfSelect">
        <option value="ONE_MINUTE">1 Min</option>
        <option value="FIVE_MINUTE" selected>5 Min</option>
        <option value="FIFTEEN_MINUTE">15 Min</option>
        <option value="ONE_HOUR">1 Hour</option>
        <option value="ONE_DAY">1 Day</option>
      </select>
    </div>
    <div class="group">
      <button class="tb-btn green" id="btnToday">Today</button>
      <button class="tb-btn"       id="btnRefresh">Refresh</button>
    </div>
  </div>

  <div id="settingsDropdown">
    <button class="tb-btn" id="btnSettings">Settings</button>
    <div id="settingsMenu">
      <div class="sec-title">Support &amp; Resistance</div>
      <label>
        <input type="checkbox" id="chkSupport" checked>
        <span class="line-dot" style="background:#047857"></span>
        <span>Support Levels</span>
        <span class="sr-count" id="supportCount"></span>
      </label>
      <label>
        <input type="checkbox" id="chkResistance" checked>
        <span class="line-dot" style="background:#991b1b"></span>
        <span>Resistance Levels</span>
        <span class="sr-count" id="resistanceCount"></span>
      </label>
      <div class="conf-label">Filter by Confidence</div>
      <div class="conf-grid">
        <label class="conf-chip"><input type="checkbox" id="chkABSOLUTE" checked><span class="chip ABSOLUTE">ABSOLUTE</span></label>
        <label class="conf-chip"><input type="checkbox" id="chkHIGH"     checked><span class="chip HIGH">HIGH</span></label>
        <label class="conf-chip"><input type="checkbox" id="chkMODERATE" checked><span class="chip MODERATE">MODERATE</span></label>
        <label class="conf-chip"><input type="checkbox" id="chkLOW"      checked><span class="chip LOW">LOW</span></label>
        <label class="conf-chip"><input type="checkbox" id="chkUNTESTED" checked><span class="chip UNTESTED">UNTESTED</span></label>
      </div>
      <div class="sec-title" id="layerTitle" style="display:none">Other Layers</div>
      <div id="dynamicLayersContainer"></div>
      <div class="sec-title">Display</div>
      <label><input type="checkbox" id="chkVolume" checked><span>Volume</span></label>
      <label><input type="checkbox" id="chkPrice"  checked><span>Current Price</span></label>
      <label><input type="checkbox" id="chkGrid"   checked><span>Grid</span></label>
      <label><input type="checkbox" id="chkLive"   checked><span>Live Updates</span></label>
      <button class="set-btn" id="btnUncheckAll">Uncheck All</button>
      <button class="set-btn" id="btnReset">Reset Defaults</button>
      <button class="set-btn" id="btnFit">Fit Chart</button>
    </div>
  </div>

  <div id="drawingTools">
    <button class="draw-btn" id="btnHLine" title="Horizontal Line">&#8212;</button>
    <button class="draw-btn" id="btnVLine" title="Vertical Line">|</button>
    <div class="color-div"></div>
    <input type="color" id="colorPicker" value="#22c55e">
    <div class="color-div"></div>
    <button class="draw-btn" id="btnClearDraw" title="Clear">&#x2715;</button>
  </div>

  <div id="pricePanel">
    <div class="pp-label">Current Price</div>
    <div class="pp-price" id="ppPrice">-</div>
    <div class="pp-change" id="ppChange">-</div>
    <div class="pp-stats">
      <div class="pp-row"><span>Open</span><span class="pp-val" id="ppOpen">-</span></div>
      <div class="pp-row"><span>High</span><span class="pp-val" id="ppHigh">-</span></div>
      <div class="pp-row"><span>Low</span> <span class="pp-val" id="ppLow">-</span></div>
    </div>
  </div>

  <div id="drawIndicator"></div>

  <div id="srTooltip">
    <div class="tt-card">
      <div class="tt-head">
        <span class="tt-type" id="ttType"></span>
        <span class="tt-price" id="ttPrice"></span>
      </div>
      <div class="tt-conf-row">
        <span class="tt-conf-lbl">CONFIDENCE</span>
        <span class="tt-badge" id="ttBadge"></span>
        <div class="tt-dots" id="ttDots"></div>
      </div>
      <div class="tt-stats">
        <div class="tt-stat"><div class="tt-stat-lbl">Visited</div> <div class="tt-stat-val green" id="ttVisited">-</div></div>
        <div class="tt-stat"><div class="tt-stat-lbl">Reacted</div> <div class="tt-stat-val green" id="ttReacted">-</div></div>
        <div class="tt-stat"><div class="tt-stat-lbl">Broken</div>  <div class="tt-stat-val"       id="ttBroken">-</div></div>
        <div class="tt-stat"><div class="tt-stat-lbl">Heavy Vol</div><div class="tt-stat-val"      id="ttHeavyVol">-</div></div>
      </div>
      <div class="tt-bar-row">
        <div class="tt-bar-lbl">Reactions</div>
        <div class="tt-track"><div class="tt-fill green" id="ttRejBar" style="width:0%"></div></div>
        <div class="tt-bar-num" id="ttRejNum"></div>
      </div>
      <div class="tt-bar-row">
        <div class="tt-bar-lbl">Breakouts</div>
        <div class="tt-track"><div class="tt-fill red" id="ttBrkBar" style="width:0%"></div></div>
        <div class="tt-bar-num" id="ttBrkNum"></div>
      </div>
      <div class="tt-foot">
        <div class="tt-vc"><div class="tt-vc-dot" id="ttVcDot"></div><span id="ttVcText"></span></div>
        <div class="tt-last" id="ttLast"></div>
      </div>
      <div class="tt-decision" id="ttDecision"></div>
    </div>
  </div>

  <div id="clockPanel">
    <div id="liveTime">--:--:--</div>
    <div id="sseStatus"><span id="sseDot"></span><span id="sseLabel">Disconnected</span></div>
  </div>

  <div id="chart"></div>
  <div id="loader"><div class="spinner"></div><div id="loaderText">Loading&hellip;</div><div id="retryCount"></div></div>
  <div id="error"></div>
  <div id="apiErrorToast"></div>
</div>

<script>
'use strict';

// ── Constants ──────────────────────────────────────────────────────────────────
const CONFIDENCE_LEVELS = ['ABSOLUTE','HIGH','MODERATE','LOW','UNTESTED'];
const CONF_DOTS = { ABSOLUTE:5, HIGH:4, MODERATE:3, LOW:2, UNTESTED:1 };

// All clearly visible on white background
const SR_STYLE = {
  ABSOLUTE: { lineWidth:3, lineStyle:0 },
  HIGH:     { lineWidth:2, lineStyle:0 },
  MODERATE: { lineWidth:2, lineStyle:1 },
  LOW:      { lineWidth:2, lineStyle:2 },
  UNTESTED: { lineWidth:1, lineStyle:2 },
};
const SR_COLOR = {

// ── S&R Drawing ────────────────────────────────────────────────────────────────
function getEnabledConf() {
  return new Set(CONFIDENCE_LEVELS.filter(k => { const el=$('chk'+k); return el && el.checked; }));
}

function clearLines(arr) {
  arr.forEach(l => { try { candleSeries.removePriceLine(l); } catch(e) {} });
  arr.length = 0;
}

function srTitle(type, lvl) {
  const arrow = type==='support' ? 'S' : 'R';
  const cmap  = { ABSOLUTE:'ABS', HIGH:'HIGH', MODERATE:'MOD', LOW:'LOW', UNTESTED:'?' };
  const conf  = cmap[(lvl.confidence||'UNTESTED').toUpperCase()] || '?';
  const vc    = lvl.heavyVolume ? '*' : '';
  const v     = lvl.visited != null ? `V:${lvl.visited}` : '';
  const r     = lvl.reacted != null ? `R:${lvl.reacted}` : '';
  const b     = (lvl.broken > 0)    ? `B:${lvl.broken}`  : '';
  return [arrow, conf, vc, v, r, b].filter(Boolean).join(' ');
}

function drawOneSR(type, lvl, enabledSet) {
  if (!candleSeries) return null;
  const conf = (lvl.confidence || 'UNTESTED').toUpperCase();
  // If no filters selected (shouldn't happen), show all
  const eff  = enabledSet.size > 0 ? enabledSet : new Set(CONFIDENCE_LEVELS);
  if (!eff.has(conf)) return null;

  const st    = SR_STYLE[conf]  || SR_STYLE.UNTESTED;
  const color = (SR_COLOR[type]||{})[conf] || (type==='support' ? '#059669' : '#b91c1c');

  // Register for tooltip lookup
  srRegistry[Number(lvl.price).toFixed(2) + '_' + type] = { ...lvl, _type: type };

  try {
    return candleSeries.createPriceLine({
      price:            Number(lvl.price),
      color:            color,
      lineWidth:        st.lineWidth,
      lineStyle:        st.lineStyle,
      axisLabelVisible: true,
      title:            srTitle(type, lvl),
    });
  } catch(e) {
    console.warn('[SR] Failed to draw', type, lvl.price, conf, e.message);
    return null;
  }
}

function drawSupportLevels() {
  clearLines(srSupLines);
  const levels = (lastData && lastData.supportLevels) || [];
  if (!chkSupport.checked || !candleSeries) { $('supportCount').textContent=''; return; }
  const enabled = getEnabledConf();
  let drawn = 0;
  levels.forEach(function(lvl) {
    const line = drawOneSR('support', lvl, enabled);
    if (line) { srSupLines.push(line); drawn++; }
  });
  $('supportCount').textContent = levels.length ? drawn+'/'+levels.length : '';
  console.log('[SR] Support: drew', drawn, 'of', levels.length);
}

function drawResistanceLevels() {
  clearLines(srResLines);
  const levels = (lastData && lastData.resistanceLevels) || [];
  if (!chkResistance.checked || !candleSeries) { $('resistanceCount').textContent=''; return; }
  const enabled = getEnabledConf();
  let drawn = 0;
  levels.forEach(function(lvl) {
    const line = drawOneSR('resistance', lvl, enabled);
    if (line) { srResLines.push(line); drawn++; }
  });
  $('resistanceCount').textContent = levels.length ? drawn+'/'+levels.length : '';
  console.log('[SR] Resistance: drew', drawn, 'of', levels.length);
}

function redrawSR() {
  srRegistry = {};
  drawSupportLevels();
  drawResistanceLevels();
}

// ── S&R Tooltip ────────────────────────────────────────────────────────────────
function findNearestSR(price) {
  var threshold = price * 0.003;
  var best = null, bestDist = Infinity;
  Object.values(srRegistry).forEach(function(lvl) {
    var d = Math.abs(Number(lvl.price) - price);
    if (d <= threshold && d < bestDist) { bestDist=d; best=lvl; }
  });
  return best;
}

function calcDecision(lvl) {
  var r=lvl.reacted||0, b=lvl.broken||0, vc=lvl.heavyVolume;
  var conf=(lvl.confidence||'').toUpperCase();
  if (conf==='UNTESTED') return {cls:'stale',icon:'&#9208;',label:'Stale &mdash; Monitor Only',detail:'Not yet tested'};
  var score=(r>=50?3:r>=20?2:1)+(b===0?2:b<=2?0:-2)+(vc?2:0)
           +(conf==='ABSOLUTE'?3:conf==='HIGH'?2:conf==='MODERATE'?1:0);
  if (score>=7) return {cls:'strong',icon:'&#128737;',label:'Strong Hold Expected',detail:r+' reactions, '+(b===0?'no breakouts':'B:'+b)};
  if (score>=4) return {cls:'watch', icon:'&#9888;&#65039;',label:'Watch for Bounce',   detail:(lvl.visited||0)+' visits, '+b+' breakout'+(b!==1?'s':'')};
  return           {cls:'risky', icon:'&#9889;',label:'Potential Break Risk',  detail:b+' prior breakout'+(b!==1?'s':'')};
}

function showSRTooltip(lvl, mx, my) {
  var type=lvl._type, conf=(lvl.confidence||'UNTESTED').toUpperCase();
  var price=Number(lvl.price), v=lvl.visited||0, r=lvl.reacted||0, b=lvl.broken||0, vc=!!lvl.heavyVolume;

  var typeEl=$('ttType'); typeEl.textContent=type==='support'?'Support':'Resistance'; typeEl.className='tt-type '+type;
  var priceEl=$('ttPrice'); priceEl.textContent=price.toFixed(2); priceEl.className='tt-price '+type;
  var badge=$('ttBadge'); badge.textContent=conf; badge.className='tt-badge '+conf;

  var n=CONF_DOTS[conf]||1;
  $('ttDots').innerHTML=Array.from({length:5},function(_,i){
    return '<div class="tt-dot'+(i<n?' on '+type:'')+'"></div>';
  }).join('');

  $('ttVisited').textContent=v; $('ttReacted').textContent=r;
  var bEl=$('ttBroken'); bEl.textContent=b; bEl.className='tt-stat-val '+(b===0?'green':b<=2?'amber':'red');
  var hvEl=$('ttHeavyVol'); hvEl.textContent=vc?'Yes':'No'; hvEl.className='tt-stat-val '+(vc?'green':'red');

  var allLvls=Object.values(srRegistry);
  var maxR=Math.max.apply(null,allLvls.map(function(l){return l.reacted||0;}).concat([1]));
  var maxB=Math.max.apply(null,allLvls.map(function(l){return l.broken||0;}).concat([1]));
  $('ttRejBar').style.width=Math.min(100,(r/maxR)*100).toFixed(0)+'%';
  $('ttBrkBar').style.width=Math.min(100,(b/maxB)*100).toFixed(0)+'%';
  $('ttRejNum').textContent=r; $('ttBrkNum').textContent=b;

  var vcDot=$('ttVcDot'); vcDot.className='tt-vc-dot '+(vc?'on':'off');
  var vcTxt=$('ttVcText'); vcTxt.textContent=vc?'Heavy Volume':'No Heavy Volume'; vcTxt.style.color=vc?'#4ade80':'#64748b';
  $('ttLast').innerHTML='Last: <span>'+(lvl.lastVisited||'&mdash;')+'</span>';

  var dec=calcDecision(lvl);
  var decEl=$('ttDecision'); decEl.className='tt-decision '+dec.cls;
  decEl.innerHTML=dec.icon+' <strong>'+dec.label+'</strong> &mdash; '+dec.detail;

  var rect=chartEl.getBoundingClientRect();
  var ax=rect.left+mx, ay=rect.top+my, W=276, H=330;
  var left=ax+16, top=ay-H/2;
  if (left+W>window.innerWidth-16) left=ax-W-16;
  top=Math.max(8,Math.min(window.innerHeight-H-8,top));
  srTooltip.style.left=left+'px'; srTooltip.style.top=top+'px';
  srTooltip.classList.add('show');
}
function hideSRTooltip() { srTooltip.classList.remove('show'); }

function initSRCrosshair() {
  chart.subscribeCrosshairMove(function(param) {
    if (!param || !param.point || param.point.x == null) { hideSRTooltip(); return; }
    var price = candleSeries.coordinateToPrice(param.point.y);
    if (price == null) { hideSRTooltip(); return; }
    var lvl = findNearestSR(price);
    if (lvl) showSRTooltip(lvl, param.point.x, param.point.y);
    else hideSRTooltip();
  });
}

// ── Dynamic Layers ─────────────────────────────────────────────────────────────
function isPriceArray(val) {
  if (!Array.isArray(val) || !val.length) return false;
  var f=val[0];
  return typeof f==='number' || (typeof f==='string' && !isNaN(+f)) || (typeof f==='object' && f!==null && 'level' in f);
}
function getValType(val) {
  var f=val[0];
  if (typeof f==='number'||typeof f==='string') return 'number';
  if (typeof f==='object'&&'level' in f) return 'object';
  return null;
}
function toLabel(key) {
  return key.replace(/([A-Z])/g,' $1').replace(/_/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();}).trim();
}
function syncLayers(data) {
  var changed=false;
  Object.entries(data).forEach(function(kv) {
    var key=kv[0], val=kv[1];
    if (NON_LAYER.has(key)||!isPriceArray(val)||layerReg[key]) return;
    layerReg[key]={label:toLabel(key),color:LAYER_COLORS[layerColorIdx++%LAYER_COLORS.length],enabled:true,lines:[],valType:getValType(val)};
    changed=true;
  });
  if (changed) rebuildLayerUI();
}
function rebuildLayerUI() {
  var container=$('dynamicLayersContainer'), title=$('layerTitle');
  container.innerHTML='';
  var keys=Object.keys(layerReg);
  title.style.display=keys.length?'':'none';
  keys.forEach(function(key) {
    var cfg=layerReg[key];
    var lbl=document.createElement('label');
    var cb=document.createElement('input'); cb.type='checkbox'; cb.id='layer_'+key; cb.checked=cfg.enabled;
    cb.addEventListener('change',function(){ layerReg[key].enabled=cb.checked; redrawAllLayers(); });
    var dot=document.createElement('span'); dot.className='line-dot'; dot.style.background=cfg.color;
    var txt=document.createElement('span'); txt.textContent=cfg.label;
    lbl.append(cb,dot,txt); container.appendChild(lbl);
  });
}
function clearLayer(key) {
  var cfg=layerReg[key]; if(!cfg) return;
  cfg.lines.forEach(function(l){try{candleSeries.removePriceLine(l);}catch(e){}});
  cfg.lines=[];
}
function drawLayer(key,data) {
  var cfg=layerReg[key];
  if (!cfg||!cfg.enabled||!candleSeries) return;
  clearLayer(key);
  var raw=data[key]; if (!Array.isArray(raw)) return;
  raw.forEach(function(item) {
    try {
      var price=cfg.valType==='object'?+item.level:+item;
      var title=cfg.valType==='object'?(item.label||cfg.label):cfg.label;
      if (!isFinite(price)) return;
      var line=candleSeries.createPriceLine({price:price,title:title,color:cfg.color,lineWidth:1,
        lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true});
      cfg.lines.push(line);
    } catch(e){}
  });
}
function redrawAllLayers() {
  if (!lastData||!candleSeries) return;
  Object.keys(layerReg).forEach(function(k){ clearLayer(k); if(layerReg[k].enabled) drawLayer(k,lastData); });
  redrawSR();
  redrawUserLines();
}

// ── SSE ────────────────────────────────────────────────────────────────────────
async function getInstrumentKey(name) {
  if (iKeyCache[name]) return iKeyCache[name];
  try {
    var res=await fetch('/api/websocket/instrument/key?name='+encodeURIComponent(name));
    var data=await res.json();
    var key=data.key||data.instrumentKey||null;
    if (key) iKeyCache[name]=key;
    return key;
  } catch(e){ console.error('[KEY]',name,e); return null; }
}
async function resolveKey(name) {
  selectedSymbol=name||$('symbolSelect').value; iKeyCurrent=null;
  var key=await getInstrumentKey(selectedSymbol); iKeyCurrent=key;
  if (pendingTicks.length){ pendingTicks.forEach(applyTick); pendingTicks.length=0; }
}
function connectSSE() {
  if (sseSource){ sseSource.close(); sseSource=null; }
  sseSource=new EventSource('/api/stream/market');
  sseSource.onopen=function(){ $('sseDot').className='live'; $('sseLabel').textContent='Live'; };
  sseSource.onerror=function(){
    $('sseDot').className=''; $('sseLabel').textContent='Reconnecting\u2026';
    sseSource.close(); sseSource=null; setTimeout(connectSSE,3000);
  };
  sseSource.addEventListener('ltp',function(e){
    var d; try{d=JSON.parse(e.data);}catch(ex){return;}
    if (!d||d.price==null) return;
    var price=+d.price, tickKey=d.key?String(d.key):null;
    if (!isFinite(price)||price<=0) return;
    if (tickKey&&!iKeyCurrent){pendingTicks.push({price:price,tickKey:tickKey});return;}
    if (tickKey!==iKeyCurrent) return;
    applyTick(price);
  });
}
function applyTick(priceOrObj) {
  var price=typeof priceOrObj==='object'?priceOrObj.price:priceOrObj;
  updatePricePanel(price); ssePrevPrice=price;
  if (!candleSeries||!lastCandles.length) return;
  var last=lastCandles[lastCandles.length-1];
  var tfSec=TF_SECS[selectedTimeFrame]||300;
  var nowIST=Math.floor(Date.now()/1000)+IST_OFFSET;
  var barFloor=Math.floor(nowIST/tfSec)*tfSec;
  if (barFloor>last.time) {
    var nc={time:barFloor,open:price,high:price,low:price,close:price,volume:0};
    try{candleSeries.update(nc);volumeSeries.update({time:barFloor,value:0,color:'rgba(38,166,154,.5)'});lastCandles.push(nc);}catch(e){}
    return;
  }
  var upd={time:last.time,open:+last.open,high:Math.max(+last.high,price),low:Math.min(+last.low,price),close:price,volume:+last.volume||0};
  if (upd.close===+last.close&&upd.high===+last.high&&upd.low===+last.low) return;
  try{
    candleSeries.update(upd);
    volumeSeries.update({time:upd.time,value:upd.volume,color:upd.close>=upd.open?'rgba(38,166,154,.5)':'rgba(239,83,80,.5)'});
    lastCandles[lastCandles.length-1]=upd;
  }catch(e){}
}

// ── Price Panel ────────────────────────────────────────────────────────────────
function todayStart() {
  var now=new Date(), ist=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));
  return Math.floor(new Date(ist.getFullYear(),ist.getMonth(),ist.getDate()).getTime()/1000);
}
function updatePricePanel(price) {
  if (!chkPrice.checked){ pricePanel.classList.remove('show'); return; }
  pricePanel.classList.add('show');
  if (ssePrevPrice!==null&&price!==ssePrevPrice){
    ppPrice.classList.remove('flash'); void ppPrice.offsetWidth; ppPrice.classList.add('flash');
  }
  ppPrice.textContent=price.toFixed(2);
  ppPrice.className='pp-price '+(ssePrevPrice===null||price>=ssePrevPrice?'up':'down');
  if (!lastCandles.length) return;
  var ts=todayStart(), today=lastCandles.filter(function(c){return c.time>=ts;});
  if (!today.length) return;
  var open=+today[0].open;
  var high=Math.max.apply(null,today.map(function(c){return +c.high;}).concat([price]));
  var low =Math.min.apply(null,today.map(function(c){return +c.low; }).concat([price]));
  var change=price-open, pct=((change/open)*100).toFixed(2);
  ppChange.innerHTML=(change>=0?'&#9650;':'&#9660;')+' '+Math.abs(change).toFixed(2)+' ('+Math.abs(pct)+'%)';
  ppChange.className='pp-change '+(change>=0?'up':'down');
  ppOpen.textContent=open.toFixed(2); ppHigh.textContent=high.toFixed(2); ppLow.textContent=low.toFixed(2);
}
function refreshPricePanel() {
  if (!lastCandles.length) return;
  var cp=ssePrevPrice!==null?ssePrevPrice:+lastCandles[lastCandles.length-1].close;
  updatePricePanel(cp);
}

// ── Chart ──────────────────────────────────────────────────────────────────────
function initChart() {
  if (chart) return;
  chart=LightweightCharts.createChart(chartEl,{
    width:chartEl.clientWidth, height:chartEl.clientHeight,
    layout:{backgroundColor:'#fff',textColor:'#000'},
    rightPriceScale:{borderVisible:false,scaleMargins:{top:.1,bottom:.2}},
    timeScale:{timeVisible:true,rightOffset:30,barSpacing:6,minBarSpacing:3,borderColor:'#d1d4dc'},
    crosshair:{
      mode:LightweightCharts.CrosshairMode.Normal,
      vertLine:{width:1,color:'#758696',style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:'#4a5568'},
      horzLine:{width:1,color:'#758696',style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:'#4a5568'},
    },
    grid:{vertLines:{visible:chkGrid.checked,color:'#eee'},horzLines:{visible:chkGrid.checked,color:'#eee'}},
    localization:{timeFormatter:function(ts){
      var d=new Date((ts+IST_OFFSET)*1000);
      return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
    }}
  });
  candleSeries=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
  volumeSeries=chart.addHistogramSeries({color:'rgba(38,166,154,.5)',priceFormat:{type:'volume'},priceScaleId:'volume',scaleMargins:{top:.9,bottom:0},overlay:true,lineWidth:1,visible:chkVolume.checked});
  chartEl.addEventListener('click',onChartClick);
  initSRCrosshair();
  chartReady=true;
}

function destroyChart() {
  hideSRTooltip(); srRegistry={};
  drawnLines.forEach(function(ld){
    try{if(ld.type==='hline')candleSeries.removePriceLine(ld.line);else chart.removeSeries(ld.series);}catch(e){}
  });
  drawnLines=[];
  clearLines(srSupLines); clearLines(srResLines);
  Object.values(layerReg).forEach(function(cfg){
    cfg.lines.forEach(function(l){try{candleSeries.removePriceLine(l);}catch(e){}});
    cfg.lines=[];
  });
  if (chart){
    if (candleSeries){try{chart.removeSeries(candleSeries);}catch(e){} candleSeries=null;}
    if (volumeSeries){try{chart.removeSeries(volumeSeries);}catch(e){} volumeSeries=null;}
    try{chart.remove();}catch(e){} chart=null;
  }
  chartReady=false;
}

function vc(c){ return +c.close>=+c.open?'rgba(38,166,154,.5)':'rgba(239,83,80,.5)'; }

function updateChart(data) {
  if (!data||!data.candles||!data.candles.length) return;
  lastData=data;
  var candles=data.candles;
  syncLayers(data);
  if (isFirstLoad){
    candleSeries.setData(candles);
    volumeSeries.setData(candles.map(function(c){return{time:c.time,value:c.volume,color:vc(c)};}));
    lastCandles=candles.slice();
    redrawAllLayers();
    refreshPricePanel();
    chart.timeScale().fitContent();
    isFirstLoad=false;
    return;
  }
  var lastT=lastCandles.length?lastCandles[lastCandles.length-1].time:0;
  if (candles.length<lastCandles.length){
    candleSeries.setData(candles);
    volumeSeries.setData(candles.map(function(c){return{time:c.time,value:c.volume,color:vc(c)};}));
    lastCandles=candles.slice();
    setTimeout(redrawAllLayers,50);
  } else {
    var idx=candles.findIndex(function(c){return c.time===lastT;});
    var missing=(idx>=0&&idx<candles.length-1)?candles.slice(idx+1):[];
    if (missing.length>2){
      candleSeries.setData(candles);
      volumeSeries.setData(candles.map(function(c){return{time:c.time,value:c.volume,color:vc(c)};}));
      lastCandles=candles.slice();
      setTimeout(redrawAllLayers,50);
    } else if (missing.length>0){
      missing.forEach(function(c){
        candleSeries.update(c);
        volumeSeries.update({time:c.time,value:c.volume,color:vc(c)});
      });
      lastCandles=candles.slice();
    } else {
      var nl=candles[candles.length-1], ol=lastCandles[lastCandles.length-1];
      if (ol.time===nl.time){
        if (ol.close!==nl.close||ol.high!==nl.high||ol.low!==nl.low||ol.volume!==nl.volume){
          candleSeries.update(nl);
          volumeSeries.update({time:nl.time,value:nl.volume,color:vc(nl)});
          lastCandles[lastCandles.length-1]=nl;
        }
      } else if (+nl.time>+ol.time){
        candleSeries.update(nl);
        volumeSeries.update({time:nl.time,value:nl.volume,color:vc(nl)});
        lastCandles=candles.slice();
      }
    }
    setTimeout(redrawAllLayers,50);
  }
  refreshPricePanel();
}

// ── Fetch / Refresh ────────────────────────────────────────────────────────────
async function fetchData() {
  var r=await fetch('/api/intraday?timeFrame='+selectedTimeFrame+'&name='+selectedSymbol);
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function showToast(msg) {
  toastEl.textContent='\u26a0\ufe0f '+msg;
  toastEl.classList.remove('fade-out'); toastEl.classList.add('show');
  setTimeout(function(){ toastEl.classList.add('fade-out'); setTimeout(function(){toastEl.classList.remove('show','fade-out');},500); },3000);
}
async function refresh(firstLoad) {
  if (firstLoad){
    loaderEl.style.display='flex'; chartEl.style.display='none'; errorEl.style.display='none';
    retryCount=0; loaderText.textContent='Loading chart data\u2026'; retryEl.textContent='';
  }
  try {
    var data=await fetchData();
    if (!chart) initChart();
    updateChart(data);
    loaderEl.style.display='none'; errorEl.style.display='none'; chartEl.style.display='block'; retryCount=0;
    if (firstLoad) setTimeout(function(){if(chart)chart.resize(chartEl.clientWidth,chartEl.clientHeight);},50);
  } catch(e) {
    if (firstLoad&&retryCount<MAX_RETRY){
      retryCount++; loaderText.textContent='Connection failed. Retrying\u2026'; retryEl.textContent='Attempt '+retryCount+' of '+MAX_RETRY;
      setTimeout(function(){refresh(true);},RETRY_DELAY);
    } else if (firstLoad){
      loaderEl.style.display='none'; chartEl.style.display='none';
      errorEl.textContent='Failed after '+MAX_RETRY+' attempts: '+e.message; errorEl.style.display='block'; retryCount=0;
    } else { showToast('API Error \u2013 Retrying\u2026'); }
  }
}
function setLiveRefresh(on) {
  clearInterval(refreshTimer); refreshTimer=null;
  if (on&&chartReady) refreshTimer=setInterval(function(){refresh(false);},30000);
}

// ── User Drawings ──────────────────────────────────────────────────────────────
function setDrawMode(mode) {
  drawMode=drawMode===mode?null:mode;
  $('btnHLine').classList.toggle('active',drawMode==='hline');
  $('btnVLine').classList.toggle('active',drawMode==='vline');
  chartEl.classList.toggle('drawing-mode',drawMode!==null);
  if (drawMode){ drawIndicator.style.display='block'; drawIndicator.textContent=drawMode==='hline'?'Click to draw horizontal line':'Click to draw vertical line'; }
  else drawIndicator.style.display='none';
}
function onChartClick(e) {
  if (!drawMode||!chart) return;
  var rect=chartEl.getBoundingClientRect(), x=e.clientX-rect.left, y=e.clientY-rect.top;
  if (drawMode==='hline'){
    var price=candleSeries.coordinateToPrice(y);
    if (price!=null){
      var line=candleSeries.createPriceLine({price:price,color:drawColor,lineWidth:2,lineStyle:LightweightCharts.LineStyle.Solid,axisLabelVisible:true,title:'\u2014'});
      drawnLines.push({type:'hline',price:price,line:line,color:drawColor});
    }
  } else if (drawMode==='vline'){
    var time=chart.timeScale().coordinateToTime(x);
    if (time&&lastCandles.length){
      var lows=lastCandles.map(function(c){return +c.low;}), highs=lastCandles.map(function(c){return +c.high;});
      var pad=(Math.max.apply(null,highs)-Math.min.apply(null,lows))*0.1;
      var minP=Math.min.apply(null,lows)-pad, maxP=Math.max.apply(null,highs)+pad;
      var vls=chart.addLineSeries({color:drawColor,lineWidth:2,lineStyle:0,priceFormat:{type:'price'},lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false});
      vls.setData([{time:time,value:minP},{time:time,value:maxP}]);
      drawnLines.push({type:'vline',time:time,series:vls,color:drawColor,minP:minP,maxP:maxP});
    }
  }
  setDrawMode(null);
}
function redrawUserLines() {
  if (!candleSeries||!chart) return;
  var valid=[];
  drawnLines.forEach(function(ld){
    try{
      if (ld.type==='hline'){
        if (ld.line){try{candleSeries.removePriceLine(ld.line);}catch(e){}}
        var nl=candleSeries.createPriceLine({price:ld.price,color:ld.color,lineWidth:2,lineStyle:LightweightCharts.LineStyle.Solid,axisLabelVisible:true,title:'\u2014'});
        valid.push({type:'hline',price:ld.price,line:nl,color:ld.color});
      } else if (ld.type==='vline'){
        if (ld.series){try{chart.removeSeries(ld.series);}catch(e){}}
        var vls=chart.addLineSeries({color:ld.color,lineWidth:2,lineStyle:0,priceFormat:{type:'price'},lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false});
        vls.setData([{time:ld.time,value:ld.minP},{time:ld.time,value:ld.maxP}]);
        valid.push({type:'vline',time:ld.time,series:vls,color:ld.color,minP:ld.minP,maxP:ld.maxP});
      }
    }catch(e){}
  });
  drawnLines=valid;
}

// ── Today Zoom ─────────────────────────────────────────────────────────────────
function zoomToToday() {
  if (!chart||!lastCandles.length) return;
  var ts=todayStart(), today=lastCandles.filter(function(c){return c.time>=ts;});
  if (!today.length){ chart.timeScale().fitContent(); return; }
  var lastT=today[today.length-1].time, tfSec=TF_SECS[selectedTimeFrame]||300;
  var bars=selectedTimeFrame==='ONE_MINUTE'?60:selectedTimeFrame==='FIFTEEN_MINUTE'?40:50;
  try{ chart.timeScale().setVisibleRange({from:Math.max(ts,lastT-bars*tfSec*0.6),to:lastT+bars*tfSec*0.4}); }
  catch(e){ chart.timeScale().fitContent(); }
}

// ── Settings Listeners ─────────────────────────────────────────────────────────
chkVolume.addEventListener('change', function(){ if(volumeSeries) volumeSeries.applyOptions({visible:chkVolume.checked}); });
chkPrice.addEventListener('change',  function(){ refreshPricePanel(); });
chkGrid.addEventListener('change',   function(){
  if (chart) chart.applyOptions({grid:{vertLines:{visible:chkGrid.checked,color:'#eee'},horzLines:{visible:chkGrid.checked,color:'#eee'}}});
});
chkLive.addEventListener('change', function(){ setLiveRefresh(chkLive.checked); });
chkSupport.addEventListener('change',    function(){ redrawSR(); });
chkResistance.addEventListener('change', function(){ redrawSR(); });
CONFIDENCE_LEVELS.forEach(function(k){
  var el=$('chk'+k); if(el) el.addEventListener('change', function(){ redrawSR(); });
});

var SR_CHKS = ['chkSupport','chkResistance'].concat(CONFIDENCE_LEVELS.map(function(k){return 'chk'+k;}));
var ALL_CHKS = ['chkVolume','chkPrice','chkGrid','chkLive'].concat(SR_CHKS);

$('btnReset').addEventListener('click', function(){
  ALL_CHKS.forEach(function(id){ var el=$(id); if(el) el.checked=true; });
  Object.values(layerReg).forEach(function(cfg){ cfg.enabled=true; }); rebuildLayerUI();
  if(chart) chart.applyOptions({grid:{vertLines:{visible:true,color:'#eee'},horzLines:{visible:true,color:'#eee'}}});
  if(volumeSeries) volumeSeries.applyOptions({visible:true});
  redrawAllLayers(); refreshPricePanel(); setLiveRefresh(true);
});
$('btnUncheckAll').addEventListener('click', function(){
  ALL_CHKS.forEach(function(id){ var el=$(id); if(el) el.checked=false; });
  Object.values(layerReg).forEach(function(cfg){ cfg.enabled=false; }); rebuildLayerUI();
  if(chart) chart.applyOptions({grid:{vertLines:{visible:false,color:'#eee'},horzLines:{visible:false,color:'#eee'}}});
  if(volumeSeries) volumeSeries.applyOptions({visible:false});
  redrawAllLayers(); pricePanel.classList.remove('show'); setLiveRefresh(false);
});
$('btnFit').addEventListener('click', function(){ if(chart) chart.timeScale().fitContent(); });

// Symbol / timeframe
$('symbolSelect').addEventListener('change', function(){
  var name=$('symbolSelect').value;
  selectedSymbol=name; ssePrevPrice=null; iKeyCurrent=null; pendingTicks.length=0;
  layerReg={}; layerColorIdx=0;
  resolveKey(name);
  destroyChart(); isFirstLoad=true; lastCandles=[];
  refresh(true);
});
$('tfSelect').addEventListener('change', function(){
  selectedTimeFrame=$('tfSelect').value;
  destroyChart(); isFirstLoad=true; lastCandles=[];
  refresh(true);
});

// Drawing tools
$('btnHLine').addEventListener('click',    function(){ setDrawMode('hline'); });
$('btnVLine').addEventListener('click',    function(){ setDrawMode('vline'); });
$('colorPicker').addEventListener('change',function(e){ drawColor=e.target.value; });
$('btnClearDraw').addEventListener('click',function(){
  drawnLines.forEach(function(ld){
    try{if(ld.type==='hline')candleSeries.removePriceLine(ld.line);else chart.removeSeries(ld.series);}catch(e){}
  });
  drawnLines=[]; setDrawMode(null);
});

// Toolbar
$('btnToday').addEventListener('click',function(){ zoomToToday(); });
$('btnRefresh').addEventListener('click',function(){
  clearInterval(refreshTimer); refreshTimer=null;
  isFirstLoad=true; retryCount=0;
  errorEl.style.display='none'; loaderEl.style.display='flex'; chartEl.style.display='none';
  loaderText.textContent='Loading chart data\u2026'; retryEl.textContent='';
  destroyChart(); chartReady=false;
  refresh(true).then(function(){ setLiveRefresh(chkLive.checked); }).catch(function(){});
});
$('btnSettings').addEventListener('click',function(e){ e.stopPropagation(); settingsMenu.classList.toggle('open'); });
document.addEventListener('click',function(e){
  if (!$('settingsDropdown').contains(e.target)) settingsMenu.classList.remove('open');
});

window.addEventListener('resize', function(){ if(chart) chart.resize(chartEl.clientWidth,chartEl.clientHeight); });
document.addEventListener('visibilitychange', function(){
  if (document.hidden){ stopClock(); clearInterval(refreshTimer); refreshTimer=null; }
  else {
    startClock(); connectSSE();
    if (chkLive.checked&&chartReady){ refresh(false); setLiveRefresh(true); }
    if (chart) setTimeout(function(){chart.resize(chartEl.clientWidth,chartEl.clientHeight);},100);
  }
});

// ── Boot ───────────────────────────────────────────────────────────────────────
window.addEventListener('load', function(){
  startClock();
  selectedSymbol    = $('symbolSelect').value;
  selectedTimeFrame = $('tfSelect').value;
  resolveKey(selectedSymbol).then(connectSSE);
  refresh(true).then(function(){ setLiveRefresh(chkLive.checked); }).catch(function(){});
});
</script>
</body>
