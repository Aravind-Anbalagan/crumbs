<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chart with Live Visibility Toggle, Symbol & TimeFrame</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter&display=swap');
    html, body, #container {
      margin: 0; padding: 0; width: 100vw; height: 100vh; position: relative;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #2c3e50 0%, #4a5568 100%);
      color: #333;
      overflow: hidden;
    }
    #chart {
      width: calc(100% - 32px);
      height: calc(100% - 32px);
      margin: 16px;
      display: none;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      background: #ffffff;
    }
    #loader {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.95);
      z-index: 10;
      border-radius: 12px;
    }
    .spinner {
      border: 6px solid #e0e0e0;
      border-top: 6px solid #007BFF;
      border-radius: 50%;
      width: 48px; height: 48px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #error {
      position: absolute;
      top: 40%; left: 50%;
      transform: translate(-50%, -50%);
      background: #ffe6e6;
      color: #cc0000;
      padding: 20px 30px;
      border-radius: 12px;
      font-weight: 600;
      display: none;
      z-index: 20;
      max-width: 80vw;
      text-align: center;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(204,0,0,0.3);
    }
    #toolbar {
      position: absolute;
      top: 24px; left: 50%;
      transform: translateX(-50%);
      z-index: 31;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 14px 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: 14px;
      user-select: none;
      width: auto;
      max-width: 90vw;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    #toolbar .center-group {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    #toolbar label {
      margin-right: 8px;
      font-weight: 500;
      color: #444;
      line-height: 1.2;
      height: 24px;
      display: flex;
      align-items: center;
    }
    #toolbar select {
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 8px;
      min-width: 110px;
      height: 32px;
      line-height: 1.2;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
      color: #444;
      border: 2px solid #e0e0e0;
      background: white;
    }
    #toolbar select:hover, #toolbar button:hover,
    #toolbar select:focus, #toolbar button:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      transform: translateY(-1px);
    }
    #refreshButton, #settingsButton {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      font-weight: 600;
      min-width: 100px;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    #refreshButton:hover, #settingsButton:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    #settingsDropdown {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 30;
      user-select: none;
    }
    #settingsMenu {
      display: none;
      position: absolute;
      top: 48px;
      left: 0;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      padding: 16px 24px;
      min-width: 260px;
      font-size: 13px;
      color: #333;
      transition: all 0.3s ease;
    }
    #settingsMenu.visible {
      display: block;
      animation: slideDown 0.3s ease;
    }
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    #settingsMenu label {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      padding: 4px;
      border-radius: 6px;
    }
    #settingsMenu label:hover {
      background: rgba(102, 126, 234, 0.08);
    }
    #settingsMenu label:last-child {
      margin-bottom: 14px;
    }
    #settingsMenu input[type="checkbox"] {
      margin-right: 12px;
      cursor: pointer;
      width: 18px;
      height: 18px;
      accent-color: #667eea;
    }
    #resetButton, #fitButton {
      display: block;
      width: 100%;
      padding: 10px 0;
      font-size: 14px;
      background: #f4f6f8;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      color: #444;
      margin-top: 10px;
      transition: all 0.25s ease;
      user-select: none;
    }
    #fitButton {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    #resetButton:hover {
      background: #e0e0e0;
      transform: translateY(-1px);
    }
    #fitButton:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="toolbar">
      <div class="center-group">
        <label for="symbolDropdown">Name:</label>
        <select id="symbolDropdown">
          <option value="NIFTY" selected>NIFTY</option>
          <option value="CRUDEOIL">CRUDEOIL</option>
        </select>
        <label for="timeframeDropdown">TimeFrame:</label>
        <select id="timeframeDropdown">
          <option value="ONE_MINUTE">1 Min</option>
          <option value="FIVE_MINUTE" selected>5 Min</option>
          <option value="FIFTEEN_MINUTE">15 Min</option>
        </select>
      </div>
      <button id="refreshButton">Refresh</button>
    </div>
    <div id="chart"></div>
    <div id="loader"><div class="spinner"></div></div>
    <div id="error"></div>
    <div id="settingsDropdown">
      <button id="settingsButton">Settings ▼</button>
      <div id="settingsMenu">
        <label><input type="checkbox" id="togglePASupport" checked /> Price Action Support</label>
        <label><input type="checkbox" id="togglePAResistance" checked /> Price Action Resistance</label>
        <label><input type="checkbox" id="toggleFiboSupport" checked /> Fibonacci Support</label>
        <label><input type="checkbox" id="toggleFiboResistance" checked /> Fibonacci Resistance</label>
        <label><input type="checkbox" id="toggleSignals" checked /> Signals</label>
        <label><input type="checkbox" id="toggleGrid" checked /> Grid</label>
        <label><input type="checkbox" id="toggleLive" checked /> Live</label>
        <button id="resetButton">Reset Defaults</button>
        <button id="fitButton">Fit Chart</button>
      </div>
    </div>
  </div>
<script>
  // In-memory settings (no localStorage)
  const settings = {
    paSupport: true,
    paResistance: true,
    fiboSupport: true,
    fiboResistance: true,
    signals: true,
    grid: true,
    live: true,
    symbol: 'NIFTY',
    timeframe: 'FIVE_MINUTE'
  };

  const chartEl = document.getElementById('chart');
  const loaderEl = document.getElementById('loader');
  const errorEl = document.getElementById('error');
  const settingsButton = document.getElementById('settingsButton');
  const settingsMenu = document.getElementById('settingsMenu');
  const togglePASupportCheckbox = document.getElementById('togglePASupport');
  const togglePAResistanceCheckbox = document.getElementById('togglePAResistance');
  const toggleFiboSupportCheckbox = document.getElementById('toggleFiboSupport');
  const toggleFiboResistanceCheckbox = document.getElementById('toggleFiboResistance');
  const toggleSignalsCheckbox = document.getElementById('toggleSignals');
  const toggleGridCheckbox = document.getElementById('toggleGrid');
  const toggleLiveCheckbox = document.getElementById('toggleLive');
  const resetButton = document.getElementById('resetButton');
  const fitButton = document.getElementById('fitButton');
  const symbolDropdown = document.getElementById('symbolDropdown');
  const timeframeDropdown = document.getElementById('timeframeDropdown');
  
  let selectedSymbol = settings.symbol;
  let selectedTimeFrame = settings.timeframe;
  let chart, candleSeries, volumeSeries;
  let priceActionSupportLines = [];
  let priceActionResistanceLines = [];
  let fiboSupportLines = [];
  let fiboResistanceLines = [];
  let lastCandles = [];
  let lastSignals = [];
  let lastData = null;
  let isFirstLoad = true;
  let refreshInterval = null;

  function updateSettings() {
    settings.paSupport = togglePASupportCheckbox.checked;
    settings.paResistance = togglePAResistanceCheckbox.checked;
    settings.fiboSupport = toggleFiboSupportCheckbox.checked;
    settings.fiboResistance = toggleFiboResistanceCheckbox.checked;
    settings.signals = toggleSignalsCheckbox.checked;
    settings.grid = toggleGridCheckbox.checked;
    settings.live = toggleLiveCheckbox.checked;
    settings.symbol = selectedSymbol;
    settings.timeframe = selectedTimeFrame;
  }

  function clearLines(lines) {
    lines.forEach(line => candleSeries.removePriceLine(line));
    return [];
  }

  function redrawLines() {
    if (!lastData) return;
    priceActionSupportLines = clearLines(priceActionSupportLines);
    priceActionResistanceLines = clearLines(priceActionResistanceLines);
    fiboSupportLines = clearLines(fiboSupportLines);
    fiboResistanceLines = clearLines(fiboResistanceLines);
    
    if (togglePASupportCheckbox.checked && lastData.priceActionSupport) {
      priceActionSupportLines = lastData.priceActionSupport.map(price => candleSeries.createPriceLine({
        price: Number(price),
        color: 'green',
        lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: 'Price Action Support'
      }));
    }
    if (togglePAResistanceCheckbox.checked && lastData.priceActionResistance) {
      priceActionResistanceLines = lastData.priceActionResistance.map(price => candleSeries.createPriceLine({
        price: Number(price),
        color: 'red',
        lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: 'Price Action Resistance'
      }));
    }
    if (toggleFiboSupportCheckbox.checked && lastData.fiboSupport) {
      fiboSupportLines = lastData.fiboSupport.map(levelObj => candleSeries.createPriceLine({
        price: Number(levelObj.level),
        color: 'blue',
        lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: levelObj.label || 'Fibo Support'
      }));
    }
    if (toggleFiboResistanceCheckbox.checked && lastData.fiboResistance) {
      fiboResistanceLines = lastData.fiboResistance.map(levelObj => candleSeries.createPriceLine({
        price: Number(levelObj.level),
        color: 'orange',
        lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true,
        title: levelObj.label || 'Fibo Resistance'
      }));
    }
  }

  togglePASupportCheckbox.addEventListener('change', () => { updateSettings(); redrawLines(); });
  togglePAResistanceCheckbox.addEventListener('change', () => { updateSettings(); redrawLines(); });
  toggleFiboSupportCheckbox.addEventListener('change', () => { updateSettings(); redrawLines(); });
  toggleFiboResistanceCheckbox.addEventListener('change', () => { updateSettings(); redrawLines(); });
  toggleSignalsCheckbox.addEventListener('change', () => {
    updateSettings();
    if (candleSeries) candleSeries.setMarkers(toggleSignalsCheckbox.checked ? lastSignals : []);
  });
  toggleGridCheckbox.addEventListener('change', () => {
    updateSettings();
    if (!chart) return;
    chart.applyOptions({
      grid: {
        vertLines: { visible: toggleGridCheckbox.checked, color: '#eee' },
        horzLines: { visible: toggleGridCheckbox.checked, color: '#eee' }
      }
    });
  });
  toggleLiveCheckbox.addEventListener('change', () => {
    updateSettings();
    updateLiveStatus();
  });

  resetButton.addEventListener('click', () => {
    togglePASupportCheckbox.checked = true;
    togglePAResistanceCheckbox.checked = true;
    toggleFiboSupportCheckbox.checked = true;
    toggleFiboResistanceCheckbox.checked = true;
    toggleSignalsCheckbox.checked = true;
    toggleGridCheckbox.checked = true;
    toggleLiveCheckbox.checked = true;
    updateSettings();
    redrawLines();
    if (chart) {
      chart.applyOptions({
        grid: {
          vertLines: { visible: true, color: '#eee' },
          horzLines: { visible: true, color: '#eee' }
        }
      });
      if (candleSeries) candleSeries.setMarkers(lastSignals);
    }
    updateLiveStatus();
  });
  
  fitButton.addEventListener('click', () => {
    if (chart) chart.timeScale().fitContent();
  });

  function clearChart() {
    if (chart) {
      if (candleSeries) {
        chart.removeSeries(candleSeries);
        candleSeries = null;
      }
      if (volumeSeries) {
        chart.removeSeries(volumeSeries);
        volumeSeries = null;
      }
      chart.remove();
      chart = null;
    }
  }

  symbolDropdown.addEventListener('change', () => {
    selectedSymbol = symbolDropdown.value;
    clearChart();
    isFirstLoad = true;
    refresh(true);
    updateSettings();
  });
  
  timeframeDropdown.addEventListener('change', () => {
    selectedTimeFrame = timeframeDropdown.value;
    clearChart();
    isFirstLoad = true;
    refresh(true);
    updateSettings();
  });

  function initChart() {
    if (chart) return;
    chart = LightweightCharts.createChart(chartEl, {
      width: chartEl.clientWidth,
      height: chartEl.clientHeight,
      layout: { backgroundColor: '#fff', textColor: '#000' },
      rightPriceScale: { borderVisible: false, scaleMargins: { top: 0.1, bottom: 0.1 } },
      timeScale: {
        timeVisible: true,
        rightOffset: 30,
        barSpacing: 6,
        minBarSpacing: 3,
        borderColor: '#d1d4dc',
        borderVisible: true
      },
      grid: {
        vertLines: { visible: toggleGridCheckbox.checked, color: '#eee' },
        horzLines: { visible: toggleGridCheckbox.checked, color: '#eee' }
      }
    });
    candleSeries = chart.addCandlestickSeries({
      upColor: '#26a69a',
      downColor: '#ef5350',
      borderVisible: false,
      wickUpColor: '#26a69a',
      wickDownColor: '#ef5350',
    });
    chart.applyOptions({
      priceScales: {
        volume: { visible: true, borderVisible: false, scaleMargins: { top: 0.98, bottom: 0 } }
      },
    });
    volumeSeries = chart.addHistogramSeries({
      color: 'rgba(38, 166, 154, 0.07)',
      priceFormat: { type: 'volume' },
      priceScaleId: 'volume',
      scaleMargins: { top: 0.98, bottom: 0 },
      overlay: true,
      lineWidth: 1,
    });
  }

  function updateChart(data) {
    if (!data || !data.candles || !data.candles.length) return;
    lastData = data;
    if (isFirstLoad) {
      candleSeries.setData(data.candles);
      volumeSeries.setData(data.candles.map(c => ({
        time: c.time,
        value: c.volume,
        color: c.close >= c.open ? 'rgba(38, 166, 154, 0.07)' : 'rgba(239, 83, 80, 0.07)'
      })));
      lastCandles = data.candles.slice();
      chart.timeScale().fitContent();
      isFirstLoad = false;
    } else {
      let lastCandle = data.candles[data.candles.length - 1];
      candleSeries.update(lastCandle);
      volumeSeries.update({
        time: lastCandle.time,
        value: lastCandle.volume,
        color: lastCandle.close >= lastCandle.open ? 'rgba(38, 166, 154, 0.07)' : 'rgba(239, 83, 80, 0.07)'
      });
      lastCandles = data.candles.slice();
    }
    redrawLines();
    if (Array.isArray(data.signals)) {
      lastSignals = data.signals.map(signal => ({
        time: signal.time,
        position: 'aboveBar',
        color: signal.type === 'buy' ? 'green' : 'red',
        shape: signal.type === 'buy' ? 'arrowUp' : 'arrowDown',
        text: signal.type.toUpperCase()
      }));
    }
    if (candleSeries) candleSeries.setMarkers(toggleSignalsCheckbox.checked ? lastSignals : []);
  }

  async function fetchData(timeFrame = selectedTimeFrame, name = selectedSymbol) {
    const url = `/api/intraday?timeFrame=${timeFrame}&name=${name}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`API error: ${resp.status}`);
    return resp.json();
  }

  async function refresh(firstLoad = false) {
    if (firstLoad) {
      loaderEl.style.display = 'flex';
      chartEl.style.display = 'none';
      errorEl.style.display = 'none';
    }
    try {
      const data = await fetchData(selectedTimeFrame, selectedSymbol);
      if (!chart) initChart();
      updateChart(data);
      loaderEl.style.display = 'none';
      errorEl.style.display = 'none';
      chartEl.style.display = 'block';
      setTimeout(() => {
        if (chart) {
          chart.resize(chartEl.clientWidth, chartEl.clientHeight);
        }
      }, 50);
    } catch (e) {
      loaderEl.style.display = 'none';
      chartEl.style.display = 'none';
      errorEl.textContent = e.message;
      errorEl.style.display = 'block';
    }
  }

  function updateLiveStatus() {
    if (toggleLiveCheckbox.checked) {
      refresh(false);
      if (!refreshInterval) {
        refreshInterval = setInterval(() => refresh(false), 30000);
      }
    } else {
      if (refreshInterval) {
        clearInterval(refreshInterval);
        refreshInterval = null;
      }
    }
  }

  window.addEventListener('resize', () => {
    if(chart) chart.resize(chartEl.clientWidth, chartEl.clientHeight);
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (refreshInterval) {
        clearInterval(refreshInterval);
        refreshInterval = null;
      }
    } else {
      if (toggleLiveCheckbox.checked) {
        refresh(false);
        refreshInterval = setInterval(() => refresh(false), 30000);
      }
    }
  });

  const refreshButton = document.getElementById('refreshButton');
  refreshButton.addEventListener('click', () => {
    if (refreshInterval) {
      clearInterval(refreshInterval);
      refreshInterval = null;
    }
    isFirstLoad = true;
    errorEl.style.display = 'none';
    loaderEl.style.display = 'flex';
    chartEl.style.display = 'none';
    clearChart();
    refresh(true).then(() => {
      if (toggleLiveCheckbox.checked) {
        refreshInterval = setInterval(() => refresh(false), 30000);
      }
    }).catch(() => {});
  });

  settingsButton.addEventListener('click', () => {
    settingsMenu.classList.toggle('visible');
  });

  document.addEventListener('click', e => {
    if (!settingsButton.contains(e.target) && !settingsMenu.contains(e.target)) {
      settingsMenu.classList.remove('visible');
    }
  });

  refresh(true);
  updateLiveStatus();
</script>
</body>
</html>
