<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chart</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    if (!sessionStorage.getItem('isLoggedIn')) { window.location.href = '/'; }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter&display=swap');
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #container {
      margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #2c3e50 0%, #4a5568 100%);
      color: #333;
    }
    #chart {
      position: absolute; top: 16px; left: 16px;
      width: calc(100% - 32px); height: calc(100% - 32px);
      display: none; border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3); background: #fff;
    }
    #chart.drawing-mode { cursor: crosshair; }
    #loader {
      position: absolute; inset: 0; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.95); z-index: 10; gap: 16px;
    }
    .spinner {
      border: 6px solid #e0e0e0; border-top-color: #4a5568;
      border-radius: 50%; width: 48px; height: 48px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loaderText { font-size: 15px; font-weight: 600; color: #4a5568; }
    #retryCount { font-size: 13px; color: #666; }
    #error {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%);
      background: #ffe6e6; color: #cc0000; padding: 20px 30px; border-radius: 12px;
      font-weight: 600; display: none; z-index: 20; max-width: 80vw; text-align: center;
      box-shadow: 0 4px 12px rgba(204,0,0,0.3);
    }
    #apiErrorToast {
      position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
      background: rgba(239,68,68,0.95); color: #fff; padding: 14px 24px;
      border-radius: 10px; font-weight: 600; display: none; z-index: 40; font-size: 14px;
      box-shadow: 0 8px 24px rgba(239,68,68,0.4); backdrop-filter: blur(10px);
    }
    #apiErrorToast.show { display: block; }
    #apiErrorToast.fade-out { animation: fadeOut 0.5s ease forwards; }
    @keyframes fadeOut {
      from { opacity:1; transform:translateX(-50%) translateY(0); }
      to   { opacity:0; transform:translateX(-50%) translateY(-20px); }
    }

    /* ── Idle Screen ── */
    #idleScreen {
      position: absolute; inset: 0; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      z-index: 5; gap: 16px; pointer-events: none;
    }
    #idleScreen .idle-icon { font-size: 52px; opacity: .35; }
    #idleScreen .idle-msg  { font-size: 17px; font-weight: 600; color: rgba(255,255,255,.55); }
    #idleScreen .idle-sub  { font-size: 13px; color: rgba(255,255,255,.35); }

    /* ── Unified Toolbar ── */
    #toolbar {
      position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
      z-index: 31; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
      border-radius: 12px; padding: 10px 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      display: flex; gap: 6px; align-items: center; font-size: 14px;
      user-select: none; max-width: 96vw; border: 1px solid rgba(255,255,255,0.3);
    }
    /* thin vertical separator between groups */
    .tb-sep { width: 1px; height: 26px; background: #e0e0e0; flex-shrink: 0; margin: 0 2px; }

    #toolbar label { font-weight: 500; color: #555; white-space: nowrap; font-size: 13px; }
    #toolbar select {
      font-size: 13px; padding: 5px 10px; border-radius: 8px; min-width: 100px; height: 34px;
      cursor: pointer; font-weight: 500; color: #444; border: 2px solid #e0e0e0; background: #fff;
      transition: border-color .2s;
    }
    #toolbar select:focus { outline: none; border-color: #4a5568; }
    #toolbar .group { display: flex; gap: 7px; align-items: center; }

    /* standard toolbar button */
    .tb-btn {
      background: linear-gradient(135deg, #4a5568, #2d3748); color: #fff;
      border: none; font-weight: 600; padding: 0 15px; border-radius: 8px;
      cursor: pointer; font-size: 13px; box-shadow: 0 3px 8px rgba(0,0,0,.18);
      white-space: nowrap; transition: transform .15s, box-shadow .15s;
      height: 34px; display: flex; align-items: center;
    }
    .tb-btn.green { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .tb-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(0,0,0,.25); }

    /* square icon button inside toolbar */
    .draw-btn {
      width: 34px; height: 34px; flex-shrink: 0;
      border: 2px solid #e0e0e0; border-radius: 8px;
      background: #fff; cursor: pointer; font-size: 15px; font-weight: 700; color: #555;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, transform .15s; padding: 0;
    }
    .draw-btn:hover  { border-color: #4a5568; transform: translateY(-1px); }
    .draw-btn.active { background: linear-gradient(135deg,#4a5568,#2d3748); color:#fff; border-color:#4a5568; }

    /* freeze button — amber when active */
    #btnFreeze { font-size: 14px; }
    #btnFreeze.frozen {
      background: linear-gradient(135deg,#f59e0b,#d97706);
      color: #fff; border-color: #d97706;
    }
    #btnFreeze.frozen:hover { box-shadow: 0 4px 12px rgba(245,158,11,.45); }

    /* colour swatch */
    #colorPicker {
      width: 34px; height: 34px; flex-shrink: 0;
      border: 2px solid #e0e0e0; border-radius: 8px;
      cursor: pointer; padding: 2px;
    }

    /* FROZEN badge floats above toolbar */
    #freezeBadge {
      display: none; position: absolute; top: -10px; right: 16px;
      background: #f59e0b; color: #fff; font-size: 9px; font-weight: 800;
      padding: 2px 6px; border-radius: 5px; letter-spacing: .5px;
      box-shadow: 0 2px 6px rgba(245,158,11,.55); pointer-events: none;
      white-space: nowrap;
    }
    #freezeBadge.show { display: block; }

    /* Settings dropdown */
    #settingsDropdown { position: absolute; top: 24px; left: 24px; z-index: 30; user-select: none; }
    #settingsMenu {
      display: none; position: absolute; top: 48px; left: 0;
      background: rgba(255,255,255,0.98); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3); border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,.15); padding: 16px 24px;
      min-width: 300px; font-size: 13px; color: #333; max-height: 80vh; overflow-y: auto;
    }
    #settingsMenu.open { display: block; animation: slideDown .25s ease; }
    @keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
    .sec-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      color: #9ca3af; margin: 14px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #f0f0f0;
    }
    .sec-title:first-child { margin-top: 0; }
    #settingsMenu label {
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
      padding: 5px 6px; border-radius: 6px; cursor: pointer;
    }
    #settingsMenu label:hover { background: rgba(74,85,104,.07); }
    .line-dot { width: 14px; height: 3px; border-radius: 2px; flex-shrink: 0; }
    #settingsMenu input[type="checkbox"] {
      width: 16px; height: 16px; cursor: pointer; accent-color: #4a5568; margin: 0; flex-shrink: 0;
    }
    .sr-count { font-size: 10px; color: #9ca3af; margin-left: auto; }
    .conf-label { font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: .5px; margin: 8px 0 6px 6px; }
    .conf-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 8px; }
    .conf-chip { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; cursor: pointer; margin: 0; }
    .conf-chip:hover { background: rgba(74,85,104,.07); }
    .conf-chip input { width: 14px; height: 14px; margin: 0; flex-shrink: 0; cursor: pointer; accent-color: #4a5568; }
    .chip { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
    .chip.CRITICAL { background:#fef2f2; color:#dc2626; border:1px solid #fca5a5; }
    .chip.HIGH     { background:#fffbeb; color:#d97706; border:1px solid #fcd34d; }
    .chip.LOW      { background:#f0fdf4; color:#16a34a; border:1px solid #86efac; }
    .set-btn {
      display: block; width: 100%; padding: 9px 0; font-size: 13px;
      border-radius: 9px; cursor: pointer; font-weight: 600; margin-top: 7px; transition: .2s;
    }
    #btnUncheckAll { background:#fff3e0; border:2px solid #ffb74d; color:#e65100; }
    #btnReset      { background:#f4f6f8; border:2px solid #e0e0e0; color:#444; }
    #btnFit        { background:linear-gradient(135deg,#4a5568,#2d3748); border:none; color:#fff; box-shadow:0 4px 12px rgba(0,0,0,.2); }
    #btnUncheckAll:hover { background:#ffe0b2; }
    #btnReset:hover      { background:#e0e0e0; }
    #btnFit:hover        { box-shadow:0 6px 20px rgba(0,0,0,.3); transform:translateY(-1px); }

    #drawIndicator {
      position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: rgba(74,85,104,.95); color:#fff; padding:10px 22px;
      border-radius: 8px; font-size:14px; font-weight:600; display:none; z-index:30;
    }
    #clockPanel {
      position: absolute; bottom: 24px; right: 24px; z-index: 30;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
      border-radius: 10px; padding: 8px 16px; box-shadow: 0 4px 16px rgba(0,0,0,.1);
      font-size:12px; font-weight:600; color:#4a5568;
      display:flex; flex-direction:column; gap:4px; min-width:120px; text-align:center;
    }
    #liveTime { font-size:18px; font-weight:700; color:#2d3748; font-family:monospace; }
    #sseStatus { display:flex; align-items:center; justify-content:center; gap:5px; font-size:10px; color:#888; }
    #sseDot { width:6px; height:6px; border-radius:50%; background:#ccc; display:inline-block; }
    #sseDot.live { background:#22c55e; animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }
    #pricePanel {
      position: absolute; top: 90px; right: 24px; z-index: 30;
      background: rgba(255,255,255,0.98); backdrop-filter: blur(10px);
      border-radius: 12px; padding: 16px 20px; box-shadow: 0 8px 32px rgba(0,0,0,.15);
      min-width: 200px; display:none;
    }
    #pricePanel.show { display:block; }
    .pp-label { font-size:11px; font-weight:600; color:#666; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
    .pp-price { font-size:28px; font-weight:700; font-family:monospace; margin-bottom:8px; }
    .pp-price.up { color:#22c55e; } .pp-price.down { color:#ef4444; }
    .pp-change { font-size:14px; font-weight:600; margin-bottom:10px; }
    .pp-change.up { color:#22c55e; } .pp-change.down { color:#ef4444; }
    .pp-stats { border-top:1px solid #e5e7eb; padding-top:10px; font-size:12px; color:#666; display:flex; flex-direction:column; gap:5px; }
    .pp-row { display:flex; justify-content:space-between; }
    .pp-val { font-weight:700; font-family:monospace; }
    @keyframes priceFlash { 0%,100%{background:transparent} 50%{background:rgba(34,197,94,.15)} }
    .flash { animation: priceFlash .4s ease; }
    #srTooltip { position: fixed; z-index: 50; pointer-events: none; width: 270px; display: none; }
    #srTooltip.show { display:block; animation: ttFade .15s ease; }
    @keyframes ttFade { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
    .tt-card {
      background: rgba(15,23,42,.97); backdrop-filter:blur(12px);
      border-radius:12px; padding:14px 16px; color:#f1f5f9; font-size:12px;
      box-shadow: 0 16px 48px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06);
    }
    .tt-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,.08); }
    .tt-type { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; padding:3px 8px; border-radius:4px; }
    .tt-type.support    { background:rgba(34,197,94,.2);  color:#4ade80; border:1px solid rgba(34,197,94,.3); }
    .tt-type.resistance { background:rgba(239,68,68,.2);  color:#f87171; border:1px solid rgba(239,68,68,.3); }
    .tt-price { font-size:20px; font-weight:700; font-family:monospace; }
    .tt-price.support { color:#4ade80; } .tt-price.resistance { color:#f87171; }
    .tt-conf-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .tt-conf-lbl { font-size:9px; color:#94a3b8; font-weight:700; text-transform:uppercase; }
    .tt-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; }
    .tt-badge.CRITICAL { background:#7f1d1d; color:#fca5a5; border:1px solid #ef4444; }
    .tt-badge.HIGH     { background:#451a03; color:#fcd34d; border:1px solid #d97706; }
    .tt-badge.LOW      { background:#052e16; color:#86efac; border:1px solid #16a34a; }
    .tt-dots { display:flex; gap:3px; }
    .tt-dot { width:7px; height:7px; border-radius:50%; background:#334155; }
    .tt-dot.on.CRITICAL { background:#ef4444; box-shadow:0 0 5px #ef4444; }
    .tt-dot.on.HIGH     { background:#f59e0b; box-shadow:0 0 4px #f59e0b80; }
    .tt-dot.on.LOW      { background:#22c55e; box-shadow:0 0 4px #22c55e60; }
    .tt-stats { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px; }
    .tt-stat { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06); border-radius:7px; padding:7px 10px; }
    .tt-stat-lbl { font-size:9px; text-transform:uppercase; letter-spacing:.5px; color:#64748b; font-weight:700; margin-bottom:3px; }
    .tt-stat-val { font-size:16px; font-weight:700; font-family:monospace; color:#e2e8f0; }
    .tt-stat-val.green { color:#4ade80; } .tt-stat-val.red { color:#f87171; } .tt-stat-val.amber { color:#fbbf24; }
    .tt-bar-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .tt-bar-lbl { font-size:9px; text-transform:uppercase; color:#64748b; font-weight:700; width:68px; flex-shrink:0; }
    .tt-track { flex:1; height:5px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden; }
    .tt-fill { height:100%; border-radius:3px; transition:width .4s; }
    .tt-fill.critical { background:linear-gradient(90deg,#b91c1c,#ef4444); }
    .tt-fill.high     { background:linear-gradient(90deg,#d97706,#fcd34d); }
    .tt-fill.low      { background:linear-gradient(90deg,#16a34a,#4ade80); }
    .tt-fill.red      { background:linear-gradient(90deg,#dc2626,#f87171); }
    .tt-bar-num { font-size:10px; color:#94a3b8; font-weight:700; width:24px; text-align:right; }
    .tt-foot { border-top:1px solid rgba(255,255,255,.07); padding-top:8px; display:flex; align-items:center; justify-content:space-between; }
    .tt-vc { display:flex; align-items:center; gap:5px; font-size:10px; font-weight:600; }
    .tt-vc-dot { width:7px; height:7px; border-radius:50%; }
    .tt-vc-dot.on { background:#22c55e; box-shadow:0 0 5px #22c55e; } .tt-vc-dot.off { background:#475569; }
    .tt-last { font-size:10px; color:#64748b; } .tt-last span { color:#94a3b8; font-weight:700; }
    .tt-decision { margin-top:9px; padding:8px 10px; border-radius:8px; font-size:11px; font-weight:700; text-align:center; }
    .tt-decision.critical { background:rgba(239,68,68,.18); color:#fca5a5; border:1px solid rgba(239,68,68,.35); }
    .tt-decision.strong   { background:rgba(34,197,94,.15);  color:#4ade80; border:1px solid rgba(34,197,94,.25); }
    .tt-decision.watch    { background:rgba(234,179,8,.15);   color:#fbbf24; border:1px solid rgba(234,179,8,.25); }
    .tt-decision.risky    { background:rgba(100,116,139,.15); color:#94a3b8; border:1px solid rgba(100,116,139,.2); }
  </style>
</head>
<body>
<div id="container">

  <!-- ═══════════════════ UNIFIED TOOLBAR ═══════════════════ -->
  <div id="toolbar">

    <!-- Symbol -->
    <div class="group">
      <label for="symbolSelect">Name:</label>
      <select id="symbolSelect">
        <option value="NIFTY" selected>NIFTY</option>
        <option value="CRUDEOIL">CRUDEOIL</option>
        <option value="SILVERM">SILVERM</option>
      </select>
    </div>

    <div class="tb-sep"></div>

    <!-- Timeframe -->
    <div class="group">
      <label for="tfSelect">TF:</label>
      <select id="tfSelect">
        <option value="ONE_MINUTE">1 Min</option>
        <option value="FIVE_MINUTE" selected>5 Min</option>
        <option value="FIFTEEN_MINUTE">15 Min</option>
        <option value="ONE_HOUR">1 Hour</option>
        <option value="ONE_DAY">1 Day</option>
      </select>
    </div>

    <div class="tb-sep"></div>

    <!-- Navigation -->
    <div class="group">
      <button class="tb-btn green" id="btnToday">Today</button>
      <button class="tb-btn"       id="btnRefresh">Refresh</button>
    </div>

    <div class="tb-sep"></div>

    <!-- Drawing tools — live in the same bar -->
    <div class="group">
      <button class="draw-btn" id="btnHLine"    title="Draw Horizontal Line">&#8212;</button>
      <button class="draw-btn" id="btnVLine"    title="Draw Vertical Line">|</button>
      <input  type="color"     id="colorPicker" value="#22c55e" title="Line colour">
      <button class="draw-btn" id="btnFreeze"   title="Freeze lines">❄</button>
      <button class="draw-btn" id="btnClearDraw" title="Clear drawn lines">&#x2715;</button>
    </div>

    <!-- FROZEN badge — floats above top-right of toolbar -->
    <span id="freezeBadge">FROZEN</span>
  </div>
  <!-- ═════════════════════════════════════════════════════════ -->

  <div id="settingsDropdown">
    <button class="tb-btn" id="btnSettings">Settings</button>
    <div id="settingsMenu">
      <div class="sec-title">Support &amp; Resistance</div>
      <label>
        <input type="checkbox" id="chkSupport" checked>
        <span class="line-dot" style="background:#15803d"></span>
        <span>Support Levels</span>
        <span class="sr-count" id="supportCount"></span>
      </label>
      <label>
        <input type="checkbox" id="chkResistance" checked>
        <span class="line-dot" style="background:#dc2626"></span>
        <span>Resistance Levels</span>
        <span class="sr-count" id="resistanceCount"></span>
      </label>
      <div class="conf-label">Filter by Confidence</div>
      <div class="conf-grid">
        <label class="conf-chip"><input type="checkbox" id="chkCRITICAL" checked><span class="chip CRITICAL">CRITICAL</span></label>
        <label class="conf-chip"><input type="checkbox" id="chkHIGH"     checked><span class="chip HIGH">HIGH</span></label>
        <label class="conf-chip"><input type="checkbox" id="chkLOW"      checked><span class="chip LOW">LOW</span></label>
      </div>
      <div class="sec-title" id="layerTitle" style="display:none">Other Layers</div>
      <div id="dynamicLayersContainer"></div>
      <div class="sec-title">Display</div>
      <label><input type="checkbox" id="chkVolume" checked><span>Volume</span></label>
      <label><input type="checkbox" id="chkPrice"  checked><span>Current Price</span></label>
      <label><input type="checkbox" id="chkGrid"   checked><span>Grid</span></label>
      <label><input type="checkbox" id="chkLive"   checked><span>Live Updates</span></label>
      <button class="set-btn" id="btnUncheckAll">Uncheck All</button>
      <button class="set-btn" id="btnReset">Reset Defaults</button>
      <button class="set-btn" id="btnFit">Fit Chart</button>
    </div>
  </div>

  <div id="pricePanel">
    <div class="pp-label">Current Price</div>
    <div class="pp-price"  id="ppPrice">-</div>
    <div class="pp-change" id="ppChange">-</div>
    <div class="pp-stats">
      <div class="pp-row"><span>Open</span><span class="pp-val" id="ppOpen">-</span></div>
      <div class="pp-row"><span>High</span><span class="pp-val" id="ppHigh">-</span></div>
      <div class="pp-row"><span>Low</span> <span class="pp-val" id="ppLow">-</span></div>
    </div>
  </div>

  <div id="drawIndicator"></div>

  <div id="srTooltip">
    <div class="tt-card">
      <div class="tt-head">
        <span class="tt-type"  id="ttType"></span>
        <span class="tt-price" id="ttPrice"></span>
      </div>
      <div class="tt-conf-row">
        <span class="tt-conf-lbl">CONFIDENCE</span>
        <span class="tt-badge" id="ttBadge"></span>
        <div class="tt-dots"   id="ttDots"></div>
      </div>
      <div class="tt-stats">
        <div class="tt-stat"><div class="tt-stat-lbl">Visited</div>  <div class="tt-stat-val"       id="ttVisited">-</div></div>
        <div class="tt-stat"><div class="tt-stat-lbl">Reacted</div>  <div class="tt-stat-val green" id="ttReacted">-</div></div>
        <div class="tt-stat"><div class="tt-stat-lbl">Broken</div>   <div class="tt-stat-val"       id="ttBroken">-</div></div>
        <div class="tt-stat"><div class="tt-stat-lbl">Heavy Vol</div><div class="tt-stat-val"       id="ttHeavyVol">-</div></div>
      </div>
      <div class="tt-bar-row">
        <div class="tt-bar-lbl">Reactions</div>
        <div class="tt-track"><div class="tt-fill"     id="ttRejBar" style="width:0%"></div></div>
        <div class="tt-bar-num" id="ttRejNum"></div>
      </div>
      <div class="tt-bar-row">
        <div class="tt-bar-lbl">Breakouts</div>
        <div class="tt-track"><div class="tt-fill red" id="ttBrkBar" style="width:0%"></div></div>
        <div class="tt-bar-num" id="ttBrkNum"></div>
      </div>
      <div class="tt-foot">
        <div class="tt-vc"><div class="tt-vc-dot" id="ttVcDot"></div><span id="ttVcText"></span></div>
        <div class="tt-last" id="ttLast"></div>
      </div>
      <div class="tt-decision" id="ttDecision"></div>
    </div>
  </div>

  <div id="clockPanel">
    <div id="liveTime">--:--:--</div>
    <div id="sseStatus"><span id="sseDot"></span><span id="sseLabel">Disconnected</span></div>
  </div>

  <div id="idleScreen">
    <div class="idle-icon">📈</div>
    <div class="idle-msg">Chart not loaded</div>
    <div class="idle-sub">Press <strong>Refresh</strong> to load data</div>
  </div>

  <div id="chart"></div>
  <div id="loader"><div class="spinner"></div><div id="loaderText">Loading&hellip;</div><div id="retryCount"></div></div>
  <div id="error"></div>
  <div id="apiErrorToast"></div>
</div>

<script>
'use strict';

// ── Constants ─────────────────────────────────────────────────
const CONFIDENCE_LEVELS = ['CRITICAL','HIGH','LOW'];
const CONF_DOTS  = { CRITICAL:3, HIGH:2, LOW:1 };
const SR_STYLE   = { CRITICAL:{lineWidth:3,lineStyle:0}, HIGH:{lineWidth:2,lineStyle:0}, LOW:{lineWidth:1,lineStyle:2} };
const SR_COLOR   = {
  support:    { CRITICAL:'#15803d', HIGH:'#0ea5e9', LOW:'#86efac' },
  resistance: { CRITICAL:'#dc2626', HIGH:'#f97316', LOW:'#fca5a5' },
};
const TF_SECS    = { ONE_MINUTE:60, FIVE_MINUTE:300, FIFTEEN_MINUTE:900, ONE_HOUR:3600, ONE_DAY:86400 };
const IST_OFFSET = 19800;
const MAX_RETRY  = 3, RETRY_DELAY = 2000;
const NON_LAYER  = new Set(['candles','signals','supportLevels','resistanceLevels',
  'final_signal','finalSignal','final_confidence','finalConfidence','final_reason','finalReason']);
const LAYER_COLORS = ['#22c55e','#ef4444','#3b82f6','#f59e0b','#a855f7','#06b6d4','#f97316','#ec4899'];

// ── localStorage key ──────────────────────────────────────────
function frozenKey(){ return 'frozenLines_'+selectedSymbol+'_'+selectedTimeFrame; }

// ── State ─────────────────────────────────────────────────────
let chart=null, candleSeries=null, volumeSeries=null;
let selectedSymbol='NIFTY', selectedTimeFrame='FIVE_MINUTE';
let lastCandles=[], lastData=null;
let isFirstLoad=true, chartReady=false;
let refreshTimer=null, retryCount=0;
let drawMode=null, drawnLines=[], drawColor='#22c55e';
let isFrozen=false;
let ssePrevPrice=null;
let srSupLines=[], srResLines=[], srRegistry={};
let layerReg={}, layerColorIdx=0;
let sseSource=null, iKeyCurrent=null;
const iKeyCache={}, pendingTicks=[];

// ── DOM ───────────────────────────────────────────────────────
const $=id=>document.getElementById(id);
const chartEl=$('chart'), loaderEl=$('loader');
const loaderText=$('loaderText'), retryEl=$('retryCount');
const errorEl=$('error'), toastEl=$('apiErrorToast');
const pricePanel=$('pricePanel'), srTooltip=$('srTooltip');
const ppPrice=$('ppPrice'),ppChange=$('ppChange'),ppOpen=$('ppOpen'),ppHigh=$('ppHigh'),ppLow=$('ppLow');
const drawIndicator=$('drawIndicator'), settingsMenu=$('settingsMenu');
const chkSupport=$('chkSupport'), chkResistance=$('chkResistance');
const chkVolume=$('chkVolume'), chkPrice=$('chkPrice'), chkGrid=$('chkGrid'), chkLive=$('chkLive');
const idleScreen=$('idleScreen');

// ── Clock ─────────────────────────────────────────────────────
let clockTimer=null;
function tickClock(){
  $('liveTime').textContent=new Date().toLocaleTimeString('en-IN',
    {timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
}
function startClock(){if(!clockTimer){tickClock();clockTimer=setInterval(tickClock,1000);}}
function stopClock(){clearInterval(clockTimer);clockTimer=null;}

// ── Freeze helpers ────────────────────────────────────────────
function serializeLines(){
  return drawnLines.map(ld=>{
    if(ld.type==='hline') return {type:'hline', price:ld.price, color:ld.color};
    if(ld.type==='vline') return {type:'vline', time:ld.time, color:ld.color, minP:ld.minP, maxP:ld.maxP};
    return null;
  }).filter(Boolean);
}
function saveLinesToStorage(){
  try{ localStorage.setItem(frozenKey(), JSON.stringify(serializeLines())); }
  catch(e){ console.warn('[Freeze] save failed',e); }
}
function loadLinesFromStorage(){
  try{ const r=localStorage.getItem(frozenKey()); return r?JSON.parse(r):[]; }
  catch(e){ return []; }
}
function clearFrozenStorage(){ try{ localStorage.removeItem(frozenKey()); }catch(e){} }

function restoreFrozenLines(){
  const saved=loadLinesFromStorage();
  if(!saved.length||!candleSeries||!chart)return;
  saved.forEach(ld=>{
    try{
      if(ld.type==='hline'){
        const line=candleSeries.createPriceLine({
          price:ld.price, color:ld.color, lineWidth:2,
          lineStyle:LightweightCharts.LineStyle.Solid, axisLabelVisible:true, title:'❄',
        });
        drawnLines.push({type:'hline', price:ld.price, line, color:ld.color});
      }else if(ld.type==='vline'){
        const vls=chart.addLineSeries({color:ld.color,lineWidth:2,lineStyle:0,
          priceFormat:{type:'price'},lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false});
        vls.setData([{time:ld.time,value:ld.minP},{time:ld.time,value:ld.maxP}]);
        drawnLines.push({type:'vline', time:ld.time, series:vls, color:ld.color, minP:ld.minP, maxP:ld.maxP});
      }
    }catch(e){ console.warn('[Freeze] restore failed',e); }
  });
}

function applyFreezeUI(on){
  isFrozen=on;
  $('btnFreeze').classList.toggle('frozen', on);
  $('btnFreeze').title = on ? 'Unfreeze lines (clear saved)' : 'Freeze lines (save to localStorage)';
  $('freezeBadge').classList.toggle('show', on);
}
function toggleFreeze(){
  if(!isFrozen){
    if(!drawnLines.length){ showToast('No lines to freeze — draw something first'); return; }
    saveLinesToStorage(); applyFreezeUI(true);
    showToast('Lines frozen ❄ — they will reload on Refresh');
  }else{
    clearFrozenStorage(); applyFreezeUI(false);
    showToast('Lines unfrozen — cleared from storage');
  }
}
function syncFreezeState(){
  applyFreezeUI(loadLinesFromStorage().length>0);
}

// ── S/R ───────────────────────────────────────────────────────
function getEnabledConf(){
  return new Set(CONFIDENCE_LEVELS.filter(k=>{const el=$('chk'+k);return el&&el.checked;}));
}
function clearLines(arr){
  arr.forEach(l=>{try{candleSeries.removePriceLine(l);}catch(e){}});
  arr.length=0;
}
function srTitle(type,lvl){
  const arrow=type==='support'?'S':'R';
  const cmap={CRITICAL:'CRT',HIGH:'HI',LOW:'LO'};
  const conf=cmap[(lvl.confidence||'LOW').toUpperCase()]||'?';
  const vc=lvl.heavyVolume?'*':'';
  const v=lvl.visited!=null?`V:${lvl.visited}`:'';
  const r=lvl.reacted!=null?`R:${lvl.reacted}`:'';
  const b=(lvl.broken>0)?`B:${lvl.broken}`:'';
  return [arrow,conf,vc,v,r,b].filter(Boolean).join(' ');
}
function drawOneSR(type,lvl,enabledSet){
  if(!candleSeries)return null;
  const conf=(lvl.confidence||'LOW').toUpperCase();
  if(!enabledSet.has(conf))return null;
  const st=SR_STYLE[conf]||SR_STYLE.LOW;
  const color=(SR_COLOR[type]||{})[conf];
  if(!color)return null;
  srRegistry[Number(lvl.price).toFixed(2)+'_'+type]={...lvl,_type:type};
  try{
    return candleSeries.createPriceLine({
      price:Number(lvl.price),color,lineWidth:st.lineWidth,lineStyle:st.lineStyle,
      axisLabelVisible:true,title:srTitle(type,lvl),
    });
  }catch(e){console.warn('[SR]',type,lvl.price,conf,e.message);return null;}
}
function drawSupportLevels(){
  clearLines(srSupLines);
  const levels=(lastData&&lastData.supportLevels)||[];
  if(!chkSupport.checked||!candleSeries){$('supportCount').textContent='';return;}
  const enabled=getEnabledConf(); let drawn=0;
  levels.forEach(lvl=>{const l=drawOneSR('support',lvl,enabled);if(l){srSupLines.push(l);drawn++;}});
  $('supportCount').textContent=levels.length?drawn+'/'+levels.length:'';
}
function drawResistanceLevels(){
  clearLines(srResLines);
  const levels=(lastData&&lastData.resistanceLevels)||[];
  if(!chkResistance.checked||!candleSeries){$('resistanceCount').textContent='';return;}
  const enabled=getEnabledConf(); let drawn=0;
  levels.forEach(lvl=>{const l=drawOneSR('resistance',lvl,enabled);if(l){srResLines.push(l);drawn++;}});
  $('resistanceCount').textContent=levels.length?drawn+'/'+levels.length:'';
}
function redrawSR(){srRegistry={};drawSupportLevels();drawResistanceLevels();}

// ── Tooltip ───────────────────────────────────────────────────
function findNearestSR(price){
  const threshold=price*0.003; let best=null,bestDist=Infinity;
  Object.values(srRegistry).forEach(lvl=>{
    const d=Math.abs(Number(lvl.price)-price);
    if(d<=threshold&&d<bestDist){bestDist=d;best=lvl;}
  });
  return best;
}
function calcDecision(lvl){
  const r=lvl.reacted||0,b=lvl.broken||0;
  const conf=(lvl.confidence||'').toUpperCase();
  if(conf==='CRITICAL'){
    if(b===0)return{cls:'critical',icon:'🔴',label:'Priority Trade Zone',detail:`${r} reactions, zero breakouts`};
    return{cls:'watch',icon:'⚠️',label:'Critical — breaks recorded',detail:`${b} breakout${b!==1?'s':''}`};
  }
  if(conf==='HIGH'){
    if(b===0&&r>=5)return{cls:'strong',icon:'🛡',label:'Strong Hold Expected',detail:`${r} reactions, no breakouts`};
    return{cls:'watch',icon:'⚠️',label:'Watchlist Level',detail:`V:${lvl.visited||0} R:${r} B:${b}`};
  }
  return{cls:'risky',icon:'🟢',label:'Background Level — Low Priority',detail:`V:${lvl.visited||0}`};
}
function showSRTooltip(lvl,mx,my){
  const type=lvl._type,conf=(lvl.confidence||'LOW').toUpperCase();
  const price=Number(lvl.price),v=lvl.visited||0,r=lvl.reacted||0,b=lvl.broken||0,vc=!!lvl.heavyVolume;
  const typeEl=$('ttType'); typeEl.textContent=type==='support'?'Support':'Resistance'; typeEl.className='tt-type '+type;
  const priceEl=$('ttPrice'); priceEl.textContent=price.toFixed(2); priceEl.className='tt-price '+type;
  const badge=$('ttBadge'); badge.textContent=conf; badge.className='tt-badge '+conf;
  const filled=CONF_DOTS[conf]||1;
  $('ttDots').innerHTML=Array.from({length:3},(_,i)=>
    `<div class="tt-dot${i<filled?' on '+conf:''}"></div>`).join('');
  $('ttVisited').textContent=v; $('ttReacted').textContent=r;
  const bEl=$('ttBroken'); bEl.textContent=b; bEl.className='tt-stat-val '+(b===0?'green':b<=2?'amber':'red');
  const hvEl=$('ttHeavyVol'); hvEl.textContent=vc?'Yes':'No'; hvEl.className='tt-stat-val '+(vc?'green':'red');
  const allLvls=Object.values(srRegistry);
  const maxR=Math.max(...allLvls.map(l=>l.reacted||0),1);
  const maxB=Math.max(...allLvls.map(l=>l.broken||0),1);
  const rejBar=$('ttRejBar');
  rejBar.style.width=Math.min(100,(r/maxR)*100).toFixed(0)+'%';
  rejBar.className='tt-fill '+(conf==='CRITICAL'?'critical':conf==='HIGH'?'high':'low');
  $('ttBrkBar').style.width=Math.min(100,(b/maxB)*100).toFixed(0)+'%';
  $('ttRejNum').textContent=r; $('ttBrkNum').textContent=b;
  const vcDot=$('ttVcDot'); vcDot.className='tt-vc-dot '+(vc?'on':'off');
  const vcTxt=$('ttVcText'); vcTxt.textContent=vc?'Heavy Volume':'No Heavy Volume'; vcTxt.style.color=vc?'#4ade80':'#64748b';
  $('ttLast').innerHTML='Last: <span>'+(lvl.lastVisited||'&mdash;')+'</span>';
  const dec=calcDecision(lvl);
  const decEl=$('ttDecision'); decEl.className='tt-decision '+dec.cls;
  decEl.innerHTML=`${dec.icon} <strong>${dec.label}</strong> — ${dec.detail}`;
  const rect=chartEl.getBoundingClientRect();
  const ax=rect.left+mx,ay=rect.top+my,W=276,H=340;
  let left=ax+16,top=ay-H/2;
  if(left+W>window.innerWidth-16)left=ax-W-16;
  top=Math.max(8,Math.min(window.innerHeight-H-8,top));
  srTooltip.style.left=left+'px'; srTooltip.style.top=top+'px';
  srTooltip.classList.add('show');
}
function hideSRTooltip(){srTooltip.classList.remove('show');}
function initSRCrosshair(){
  chart.subscribeCrosshairMove(param=>{
    if(!param||!param.point||param.point.x==null){hideSRTooltip();return;}
    const price=candleSeries.coordinateToPrice(param.point.y);
    if(price==null){hideSRTooltip();return;}
    const lvl=findNearestSR(price);
    if(lvl)showSRTooltip(lvl,param.point.x,param.point.y); else hideSRTooltip();
  });
}

// ── Dynamic Layers ────────────────────────────────────────────
function isPriceArray(val){
  if(!Array.isArray(val)||!val.length)return false;
  const f=val[0];
  return typeof f==='number'||(typeof f==='string'&&!isNaN(+f))||(typeof f==='object'&&f!==null&&'level' in f);
}
function getValType(val){
  const f=val[0];
  if(typeof f==='number'||typeof f==='string')return 'number';
  if(typeof f==='object'&&'level' in f)return 'object';
  return null;
}
function toLabel(key){return key.replace(/([A-Z])/g,' $1').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).trim();}
function syncLayers(data){
  let changed=false;
  Object.entries(data).forEach(([key,val])=>{
    if(NON_LAYER.has(key)||!isPriceArray(val)||layerReg[key])return;
    layerReg[key]={label:toLabel(key),color:LAYER_COLORS[layerColorIdx++%LAYER_COLORS.length],enabled:true,lines:[],valType:getValType(val)};
    changed=true;
  });
  if(changed)rebuildLayerUI();
}
function rebuildLayerUI(){
  const container=$('dynamicLayersContainer'),title=$('layerTitle');
  container.innerHTML='';
  const keys=Object.keys(layerReg);
  title.style.display=keys.length?'':'none';
  keys.forEach(key=>{
    const cfg=layerReg[key];
    const lbl=document.createElement('label');
    const cb=document.createElement('input'); cb.type='checkbox'; cb.id='layer_'+key; cb.checked=cfg.enabled;
    cb.addEventListener('change',()=>{layerReg[key].enabled=cb.checked;redrawAllLayers();});
    const dot=document.createElement('span'); dot.className='line-dot'; dot.style.background=cfg.color;
    const txt=document.createElement('span'); txt.textContent=cfg.label;
    lbl.append(cb,dot,txt); container.appendChild(lbl);
  });
}
function clearLayer(key){
  const cfg=layerReg[key]; if(!cfg)return;
  cfg.lines.forEach(l=>{try{candleSeries.removePriceLine(l);}catch(e){}});
  cfg.lines=[];
}
function drawLayer(key,data){
  const cfg=layerReg[key];
  if(!cfg||!cfg.enabled||!candleSeries)return;
  clearLayer(key);
  const raw=data[key]; if(!Array.isArray(raw))return;
  raw.forEach(item=>{
    try{
      const price=cfg.valType==='object'?+item.level:+item;
      const title=cfg.valType==='object'?(item.label||cfg.label):cfg.label;
      if(!isFinite(price))return;
      const line=candleSeries.createPriceLine({price,title,color:cfg.color,lineWidth:1,
        lineStyle:LightweightCharts.LineStyle.Dashed,axisLabelVisible:true});
      cfg.lines.push(line);
    }catch(e){}
  });
}
function redrawAllLayers(){
  if(!lastData||!candleSeries)return;
  Object.keys(layerReg).forEach(k=>{clearLayer(k);if(layerReg[k].enabled)drawLayer(k,lastData);});
  redrawSR(); redrawUserLines();
}

// ── SSE ───────────────────────────────────────────────────────
async function getInstrumentKey(name){
  if(iKeyCache[name])return iKeyCache[name];
  try{
    const res=await fetch('/api/websocket/instrument/key?name='+encodeURIComponent(name));
    const data=await res.json();
    const key=data.key||data.instrumentKey||null;
    if(key)iKeyCache[name]=key;
    return key;
  }catch(e){console.error('[KEY]',name,e);return null;}
}
async function resolveKey(name){
  selectedSymbol=name||$('symbolSelect').value; iKeyCurrent=null;
  const key=await getInstrumentKey(selectedSymbol); iKeyCurrent=key;
  if(pendingTicks.length){pendingTicks.forEach(applyTick);pendingTicks.length=0;}
}
function connectSSE(){
  if(sseSource){sseSource.close();sseSource=null;}
  sseSource=new EventSource('/api/stream/market');
  sseSource.onopen=()=>{$('sseDot').className='live';$('sseLabel').textContent='Live';};
  sseSource.onerror=()=>{
    $('sseDot').className='';$('sseLabel').textContent='Reconnecting…';
    sseSource.close();sseSource=null;setTimeout(connectSSE,3000);
  };
  sseSource.addEventListener('ltp',e=>{
    let d;try{d=JSON.parse(e.data);}catch(ex){return;}
    if(!d||d.price==null)return;
    const price=+d.price,tickKey=d.key?String(d.key):null;
    if(!isFinite(price)||price<=0)return;
    if(tickKey&&!iKeyCurrent){pendingTicks.push({price,tickKey});return;}
    if(tickKey!==iKeyCurrent)return;
    applyTick(price);
  });
}
function applyTick(priceOrObj){
  const price=typeof priceOrObj==='object'?priceOrObj.price:priceOrObj;
  updatePricePanel(price); ssePrevPrice=price;
  if(!candleSeries||!lastCandles.length)return;
  const last=lastCandles[lastCandles.length-1];
  const tfSec=TF_SECS[selectedTimeFrame]||300;
  const nowIST=Math.floor(Date.now()/1000)+IST_OFFSET;
  const barFloor=Math.floor(nowIST/tfSec)*tfSec;
  if(barFloor>last.time){
    const nc={time:barFloor,open:price,high:price,low:price,close:price,volume:0};
    try{candleSeries.update(nc);volumeSeries.update({time:barFloor,value:0,color:'rgba(38,166,154,.5)'});lastCandles.push(nc);}catch(e){}
    return;
  }
  const upd={time:last.time,open:+last.open,high:Math.max(+last.high,price),low:Math.min(+last.low,price),close:price,volume:+last.volume||0};
  if(upd.close===+last.close&&upd.high===+last.high&&upd.low===+last.low)return;
  try{
    candleSeries.update(upd);
    volumeSeries.update({time:upd.time,value:upd.volume,color:upd.close>=upd.open?'rgba(38,166,154,.5)':'rgba(239,83,80,.5)'});
    lastCandles[lastCandles.length-1]=upd;
  }catch(e){}
}

// ── Price Panel ───────────────────────────────────────────────
function todayStart(){
  const now=new Date(),ist=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));
  return Math.floor(new Date(ist.getFullYear(),ist.getMonth(),ist.getDate()).getTime()/1000);
}
function updatePricePanel(price){
  if(!chkPrice.checked){pricePanel.classList.remove('show');return;}
  pricePanel.classList.add('show');
  if(ssePrevPrice!==null&&price!==ssePrevPrice){ppPrice.classList.remove('flash');void ppPrice.offsetWidth;ppPrice.classList.add('flash');}
  ppPrice.textContent=price.toFixed(2);
  ppPrice.className='pp-price '+(ssePrevPrice===null||price>=ssePrevPrice?'up':'down');
  if(!lastCandles.length)return;
  const ts=todayStart(),today=lastCandles.filter(c=>c.time>=ts);
  if(!today.length)return;
  const open=+today[0].open;
  const high=Math.max(...today.map(c=>+c.high),price);
  const low =Math.min(...today.map(c=>+c.low), price);
  const change=price-open,pct=((change/open)*100).toFixed(2);
  ppChange.innerHTML=(change>=0?'▲':'▼')+' '+Math.abs(change).toFixed(2)+' ('+Math.abs(pct)+'%)';
  ppChange.className='pp-change '+(change>=0?'up':'down');
  ppOpen.textContent=open.toFixed(2);ppHigh.textContent=high.toFixed(2);ppLow.textContent=low.toFixed(2);
}
function refreshPricePanel(){
  if(!lastCandles.length)return;
  const cp=ssePrevPrice!==null?ssePrevPrice:+lastCandles[lastCandles.length-1].close;
  updatePricePanel(cp);
}

// ── Chart ─────────────────────────────────────────────────────
function initChart(){
  if(chart)return;
  chart=LightweightCharts.createChart(chartEl,{
    width:chartEl.clientWidth,height:chartEl.clientHeight,
    layout:{backgroundColor:'#fff',textColor:'#000'},
    rightPriceScale:{borderVisible:false,scaleMargins:{top:.1,bottom:.2}},
    timeScale:{timeVisible:true,rightOffset:30,barSpacing:6,minBarSpacing:3,borderColor:'#d1d4dc'},
    crosshair:{
      mode:LightweightCharts.CrosshairMode.Normal,
      vertLine:{width:1,color:'#758696',style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:'#4a5568'},
      horzLine:{width:1,color:'#758696',style:LightweightCharts.LineStyle.Dashed,labelBackgroundColor:'#4a5568'},
    },
    grid:{vertLines:{visible:chkGrid.checked,color:'#eee'},horzLines:{visible:chkGrid.checked,color:'#eee'}},
    localization:{timeFormatter(ts){
      const d=new Date((ts+IST_OFFSET)*1000);
      return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
    }}
  });
  candleSeries=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
  volumeSeries=chart.addHistogramSeries({color:'rgba(38,166,154,.5)',priceFormat:{type:'volume'},priceScaleId:'volume',scaleMargins:{top:.9,bottom:0},overlay:true,lineWidth:1,visible:chkVolume.checked});
  chartEl.addEventListener('click',onChartClick);
  initSRCrosshair();
  chartReady=true;
}
function destroyChart(){
  hideSRTooltip(); srRegistry={};
  drawnLines.forEach(ld=>{try{if(ld.type==='hline')candleSeries.removePriceLine(ld.line);else chart.removeSeries(ld.series);}catch(e){}});
  drawnLines=[];
  clearLines(srSupLines); clearLines(srResLines);
  Object.values(layerReg).forEach(cfg=>{cfg.lines.forEach(l=>{try{candleSeries.removePriceLine(l);}catch(e){}});cfg.lines=[];});
  if(chart){
    if(candleSeries){try{chart.removeSeries(candleSeries);}catch(e){} candleSeries=null;}
    if(volumeSeries){try{chart.removeSeries(volumeSeries);}catch(e){} volumeSeries=null;}
    try{chart.remove();}catch(e){} chart=null;
  }
  chartReady=false;
}
function vc(c){return +c.close>=+c.open?'rgba(38,166,154,.5)':'rgba(239,83,80,.5)';}
function updateChart(data){
  if(!data||!data.candles||!data.candles.length)return;
  lastData=data;
  const candles=data.candles;
  syncLayers(data);
  if(isFirstLoad){
    candleSeries.setData(candles);
    volumeSeries.setData(candles.map(c=>({time:c.time,value:c.volume,color:vc(c)})));
    lastCandles=candles.slice();
    restoreFrozenLines();
    redrawAllLayers(); refreshPricePanel();
    chart.timeScale().fitContent();
    isFirstLoad=false; return;
  }
  const lastT=lastCandles.length?lastCandles[lastCandles.length-1].time:0;
  if(candles.length<lastCandles.length){
    candleSeries.setData(candles);
    volumeSeries.setData(candles.map(c=>({time:c.time,value:c.volume,color:vc(c)})));
    lastCandles=candles.slice(); setTimeout(redrawAllLayers,50);
  }else{
    const idx=candles.findIndex(c=>c.time===lastT);
    const missing=(idx>=0&&idx<candles.length-1)?candles.slice(idx+1):[];
    if(missing.length>2){
      candleSeries.setData(candles);
      volumeSeries.setData(candles.map(c=>({time:c.time,value:c.volume,color:vc(c)})));
      lastCandles=candles.slice(); setTimeout(redrawAllLayers,50);
    }else if(missing.length>0){
      missing.forEach(c=>{candleSeries.update(c);volumeSeries.update({time:c.time,value:c.volume,color:vc(c)});});
      lastCandles=candles.slice();
    }else{
      const nl=candles[candles.length-1],ol=lastCandles[lastCandles.length-1];
      if(ol.time===nl.time){
        if(ol.close!==nl.close||ol.high!==nl.high||ol.low!==nl.low||ol.volume!==nl.volume){
          candleSeries.update(nl);
          volumeSeries.update({time:nl.time,value:nl.volume,color:vc(nl)});
          lastCandles[lastCandles.length-1]=nl;
        }
      }else if(+nl.time>+ol.time){
        candleSeries.update(nl);volumeSeries.update({time:nl.time,value:nl.volume,color:vc(nl)});
        lastCandles=candles.slice();
      }
    }
    setTimeout(redrawAllLayers,50);
  }
  refreshPricePanel();
}

// ── Fetch ─────────────────────────────────────────────────────
async function fetchData(){
  const r=await fetch('/api/intraday?timeFrame='+selectedTimeFrame+'&name='+selectedSymbol);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
function showToast(msg){
  toastEl.textContent='⚠️ '+msg;
  toastEl.classList.remove('fade-out');toastEl.classList.add('show');
  setTimeout(()=>{toastEl.classList.add('fade-out');setTimeout(()=>toastEl.classList.remove('show','fade-out'),500);},3000);
}
async function refresh(firstLoad){
  if(idleScreen) idleScreen.style.display='none';
  if(firstLoad){
    loaderEl.style.display='flex';chartEl.style.display='none';errorEl.style.display='none';
    retryCount=0;loaderText.textContent='Loading chart data…';retryEl.textContent='';
  }
  try{
    const data=await fetchData();
    if(!chart)initChart();
    updateChart(data);
    loaderEl.style.display='none';errorEl.style.display='none';chartEl.style.display='block';retryCount=0;
    if(firstLoad)setTimeout(()=>{if(chart)chart.resize(chartEl.clientWidth,chartEl.clientHeight);},50);
  }catch(e){
    if(firstLoad&&retryCount<MAX_RETRY){
      retryCount++;loaderText.textContent='Connection failed. Retrying…';retryEl.textContent='Attempt '+retryCount+' of '+MAX_RETRY;
      setTimeout(()=>refresh(true),RETRY_DELAY);
    }else if(firstLoad){
      loaderEl.style.display='none';chartEl.style.display='none';
      if(idleScreen){
        idleScreen.style.display='flex';
        idleScreen.querySelector('.idle-msg').textContent='Load failed';
        idleScreen.querySelector('.idle-sub').textContent=e.message+' — press Refresh to retry';
      }
      errorEl.textContent='Failed after '+MAX_RETRY+' attempts: '+e.message;errorEl.style.display='block';retryCount=0;
    }else{ showToast('API Error – Retrying…'); }
  }
}
function setLiveRefresh(on){
  clearInterval(refreshTimer);refreshTimer=null;
  if(on&&chartReady)refreshTimer=setInterval(()=>refresh(false),30000);
}

// ── Drawing ───────────────────────────────────────────────────
function setDrawMode(mode){
  drawMode=drawMode===mode?null:mode;
  $('btnHLine').classList.toggle('active',drawMode==='hline');
  $('btnVLine').classList.toggle('active',drawMode==='vline');
  chartEl.classList.toggle('drawing-mode',drawMode!==null);
  if(drawMode){
    drawIndicator.style.display='block';
    drawIndicator.textContent=drawMode==='hline'?'Click to draw horizontal line':'Click to draw vertical line';
  }else drawIndicator.style.display='none';
}
function onChartClick(e){
  if(!drawMode||!chart)return;
  const rect=chartEl.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
  if(drawMode==='hline'){
    const price=candleSeries.coordinateToPrice(y);
    if(price!=null){
      const line=candleSeries.createPriceLine({price,color:drawColor,lineWidth:2,lineStyle:LightweightCharts.LineStyle.Solid,axisLabelVisible:true,title:'—'});
      drawnLines.push({type:'hline',price,line,color:drawColor});
      if(isFrozen) saveLinesToStorage();
    }
  }else if(drawMode==='vline'){
    const time=chart.timeScale().coordinateToTime(x);
    if(time&&lastCandles.length){
      const lows=lastCandles.map(c=>+c.low),highs=lastCandles.map(c=>+c.high);
      const pad=(Math.max(...highs)-Math.min(...lows))*0.1;
      const minP=Math.min(...lows)-pad,maxP=Math.max(...highs)+pad;
      const vls=chart.addLineSeries({color:drawColor,lineWidth:2,lineStyle:0,priceFormat:{type:'price'},lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false});
      vls.setData([{time,value:minP},{time,value:maxP}]);
      drawnLines.push({type:'vline',time,series:vls,color:drawColor,minP,maxP});
      if(isFrozen) saveLinesToStorage();
    }
  }
  setDrawMode(null);
}
function redrawUserLines(){
  if(!candleSeries||!chart)return;
  const valid=[];
  drawnLines.forEach(ld=>{
    try{
      if(ld.type==='hline'){
        if(ld.line){try{candleSeries.removePriceLine(ld.line);}catch(e){}}
        const nl=candleSeries.createPriceLine({price:ld.price,color:ld.color,lineWidth:2,lineStyle:LightweightCharts.LineStyle.Solid,axisLabelVisible:true,title:isFrozen?'❄':'—'});
        valid.push({type:'hline',price:ld.price,line:nl,color:ld.color});
      }else if(ld.type==='vline'){
        if(ld.series){try{chart.removeSeries(ld.series);}catch(e){}}
        const vls=chart.addLineSeries({color:ld.color,lineWidth:2,lineStyle:0,priceFormat:{type:'price'},lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false});
        vls.setData([{time:ld.time,value:ld.minP},{time:ld.time,value:ld.maxP}]);
        valid.push({type:'vline',time:ld.time,series:vls,color:ld.color,minP:ld.minP,maxP:ld.maxP});
      }
    }catch(e){}
  });
  drawnLines=valid;
}

// ── Today Zoom ────────────────────────────────────────────────
function zoomToToday(){
  if(!chart||!lastCandles.length)return;
  const ts=todayStart(),today=lastCandles.filter(c=>c.time>=ts);
  if(!today.length){chart.timeScale().fitContent();return;}
  const lastT=today[today.length-1].time,tfSec=TF_SECS[selectedTimeFrame]||300;
  const bars=selectedTimeFrame==='ONE_MINUTE'?60:selectedTimeFrame==='FIFTEEN_MINUTE'?40:50;
  try{chart.timeScale().setVisibleRange({from:Math.max(ts,lastT-bars*tfSec*0.6),to:lastT+bars*tfSec*0.4});}
  catch(e){chart.timeScale().fitContent();}
}

// ── Event wiring ──────────────────────────────────────────────
chkVolume.addEventListener('change',()=>{if(volumeSeries)volumeSeries.applyOptions({visible:chkVolume.checked});});
chkPrice.addEventListener('change', ()=>refreshPricePanel());
chkGrid.addEventListener('change',  ()=>{if(chart)chart.applyOptions({grid:{vertLines:{visible:chkGrid.checked,color:'#eee'},horzLines:{visible:chkGrid.checked,color:'#eee'}}});});
chkLive.addEventListener('change',  ()=>setLiveRefresh(chkLive.checked));
chkSupport.addEventListener('change',    ()=>redrawSR());
chkResistance.addEventListener('change', ()=>redrawSR());
CONFIDENCE_LEVELS.forEach(k=>{const el=$('chk'+k);if(el)el.addEventListener('change',()=>redrawSR());});

const SR_CHKS=['chkSupport','chkResistance',...CONFIDENCE_LEVELS.map(k=>'chk'+k)];
const ALL_CHKS=['chkVolume','chkPrice','chkGrid','chkLive',...SR_CHKS];

$('btnReset').addEventListener('click',()=>{
  ALL_CHKS.forEach(id=>{const el=$(id);if(el)el.checked=true;});
  Object.values(layerReg).forEach(cfg=>cfg.enabled=true);rebuildLayerUI();
  if(chart)chart.applyOptions({grid:{vertLines:{visible:true,color:'#eee'},horzLines:{visible:true,color:'#eee'}}});
  if(volumeSeries)volumeSeries.applyOptions({visible:true});
  redrawAllLayers();refreshPricePanel();setLiveRefresh(true);
});
$('btnUncheckAll').addEventListener('click',()=>{
  ALL_CHKS.forEach(id=>{const el=$(id);if(el)el.checked=false;});
  Object.values(layerReg).forEach(cfg=>cfg.enabled=false);rebuildLayerUI();
  if(chart)chart.applyOptions({grid:{vertLines:{visible:false,color:'#eee'},horzLines:{visible:false,color:'#eee'}}});
  if(volumeSeries)volumeSeries.applyOptions({visible:false});
  redrawAllLayers();pricePanel.classList.remove('show');setLiveRefresh(false);
});
$('btnFit').addEventListener('click',()=>{if(chart)chart.timeScale().fitContent();});

$('symbolSelect').addEventListener('change',()=>{
  const name=$('symbolSelect').value;
  selectedSymbol=name;ssePrevPrice=null;iKeyCurrent=null;pendingTicks.length=0;
  layerReg={};layerColorIdx=0;resolveKey(name);
  syncFreezeState();
  destroyChart();isFirstLoad=true;lastCandles=[];refresh(true);
});
$('tfSelect').addEventListener('change',()=>{
  selectedTimeFrame=$('tfSelect').value;
  syncFreezeState();
  destroyChart();isFirstLoad=true;lastCandles=[];refresh(true);
});

$('btnHLine').addEventListener('click',    ()=>setDrawMode('hline'));
$('btnVLine').addEventListener('click',    ()=>setDrawMode('vline'));
$('colorPicker').addEventListener('change',e=>drawColor=e.target.value);
$('btnFreeze').addEventListener('click',   ()=>toggleFreeze());
$('btnClearDraw').addEventListener('click',()=>{
  drawnLines.forEach(ld=>{try{if(ld.type==='hline')candleSeries.removePriceLine(ld.line);else chart.removeSeries(ld.series);}catch(e){}});
  drawnLines=[];setDrawMode(null);
  if(isFrozen) saveLinesToStorage();
});

$('btnToday').addEventListener('click',()=>zoomToToday());
$('btnRefresh').addEventListener('click',()=>{
  clearInterval(refreshTimer);refreshTimer=null;
  isFirstLoad=true;retryCount=0;
  errorEl.style.display='none';loaderEl.style.display='flex';chartEl.style.display='none';
  loaderText.textContent='Loading chart data…';retryEl.textContent='';
  destroyChart();chartReady=false;
  refresh(true).then(()=>setLiveRefresh(chkLive.checked)).catch(()=>{});
});
$('btnSettings').addEventListener('click',e=>{e.stopPropagation();settingsMenu.classList.toggle('open');});
document.addEventListener('click',e=>{if(!$('settingsDropdown').contains(e.target))settingsMenu.classList.remove('open');});

window.addEventListener('resize',()=>{if(chart)chart.resize(chartEl.clientWidth,chartEl.clientHeight);});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopClock();clearInterval(refreshTimer);refreshTimer=null;}
  else{
    startClock();connectSSE();
    if(chkLive.checked&&chartReady){refresh(false);setLiveRefresh(true);}
    if(chart)setTimeout(()=>chart.resize(chartEl.clientWidth,chartEl.clientHeight),100);
  }
});

// ── Boot ──────────────────────────────────────────────────────
window.addEventListener('load',()=>{
  startClock();
  selectedSymbol    = $('symbolSelect').value;
  selectedTimeFrame = $('tfSelect').value;
  resolveKey(selectedSymbol).then(connectSSE);
  syncFreezeState();
  // No auto fetch — user presses Refresh
});
</script>
