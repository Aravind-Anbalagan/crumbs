<style>
    .trades-container {
        padding: 1rem;
        height: 100%;
        overflow-y: auto;
    }

    .stats-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 0.75rem;
        margin-bottom: 1rem;
    }

    .stat-card {
        background: rgba(30, 41, 59, 0.5);
        backdrop-filter: blur(10px);
        border-radius: 10px;
        padding: 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
    }

    [data-theme="light"] .stat-card {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .stat-label {
        font-size: 0.7rem;
        color: var(--text-secondary);
        margin-bottom: 0.2rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .stat-value {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-primary);
    }

    .stat-value.positive { color: var(--success); }
    .stat-value.negative { color: var(--error); }

    .filters {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
    }

    .filter-btn {
        padding: 0.4rem 0.75rem;
        background: rgba(30, 41, 59, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        color: var(--text-primary);
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 0.8rem;
        font-weight: 500;
    }

    [data-theme="light"] .filter-btn {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .filter-btn:hover {
        background: rgba(99, 102, 241, 0.2);
        border-color: var(--primary);
    }

    .filter-btn.active {
        background: rgba(99, 102, 241, 0.25);
        border-color: var(--primary);
        color: var(--primary);
    }

    [data-theme="light"] .filter-btn.active {
        background: rgba(99, 102, 241, 0.15);
    }

    .trades-table-wrapper {
        background: rgba(30, 41, 59, 0.3);
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
    }

    [data-theme="light"] .trades-table-wrapper {
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .trades-table {
        width: 100%;
        border-collapse: collapse;
    }

    .trades-table thead {
        background: rgba(15, 23, 42, 0.5);
        position: sticky;
        top: 0;
        z-index: 10;
    }

    [data-theme="light"] .trades-table thead {
        background: rgba(248, 250, 252, 0.9);
    }

    .trades-table th {
        padding: 0.6rem 0.75rem;
        text-align: left;
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    [data-theme="light"] .trades-table th {
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .trades-table td {
        padding: 0.6rem 0.75rem;
        font-size: 0.8rem;
        color: var(--text-primary);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    [data-theme="light"] .trades-table td {
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .trades-table tbody tr { transition: background 0.2s ease; }
    .trades-table tbody tr:hover { background: rgba(99, 102, 241, 0.08); }

    .badge {
        display: inline-block;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
    }

    .badge.buy {
        background: rgba(16, 185, 129, 0.2);
        color: var(--success);
        border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge.sell {
        background: rgba(239, 68, 68, 0.2);
        color: var(--error);
        border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .badge.open {
        background: rgba(245, 158, 11, 0.2);
        color: var(--warning);
        border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge.closed {
        background: rgba(100, 116, 139, 0.2);
        color: var(--text-secondary);
        border: 1px solid rgba(100, 116, 139, 0.3);
    }

    .pnl-positive { color: var(--success); font-weight: 600; }
    .pnl-negative { color: var(--error); font-weight: 600; }

    .no-trades {
        text-align: center;
        padding: 3rem;
        color: var(--text-secondary);
    }

    .pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem;
        background: rgba(30, 41, 59, 0.3);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    [data-theme="light"] .pagination {
        background: rgba(255, 255, 255, 0.6);
        border-top: 1px solid rgba(0, 0, 0, 0.08);
    }

    .pagination-info {
        font-size: 0.8rem;
        color: var(--text-secondary);
    }

    .pagination-controls {
        display: flex;
        gap: 0.5rem;
        align-items: center;
    }

    .pagination-btn {
        padding: 0.4rem 0.75rem;
        background: rgba(30, 41, 59, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        color: var(--text-primary);
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 0.8rem;
        font-weight: 500;
        min-width: 35px;
    }

    [data-theme="light"] .pagination-btn {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .pagination-btn:hover:not(:disabled) {
        background: rgba(99, 102, 241, 0.2);
        border-color: var(--primary);
    }

    .pagination-btn.active {
        background: rgba(99, 102, 241, 0.25);
        border-color: var(--primary);
        color: var(--primary);
    }

    .pagination-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .page-size-selector {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        font-size: 0.8rem;
        color: var(--text-secondary);
    }

    .page-size-selector select {
        padding: 0.4rem 0.75rem;
        background: rgba(30, 41, 59, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        color: var(--text-primary);
        cursor: pointer;
        font-size: 0.8rem;
    }

    [data-theme="light"] .page-size-selector select {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .spinner {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 50%;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: var(--primary);
        animation: spin 0.8s linear infinite;
        margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
        .trades-container { padding: 1rem; }
        .stats-row { grid-template-columns: repeat(2, 1fr); }
        .trades-table { font-size: 0.75rem; }
        .trades-table th,
        .trades-table td { padding: 0.6rem 0.5rem; }
    }
</style>

<div class="trades-container">
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-label">Total Trades</div>
            <div class="stat-value" id="totalTrades">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Win Rate</div>
            <div class="stat-value" id="winRate">0%</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total P&L</div>
            <div class="stat-value" id="totalPnl">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Open Trades</div>
            <div class="stat-value" id="openTrades">0</div>
        </div>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="window.filterTrades('all')">All</button>
        <button class="filter-btn" onclick="window.filterTrades('open')">Open</button>
        <button class="filter-btn" onclick="window.filterTrades('closed')">Closed</button>
        <button class="filter-btn" onclick="window.filterTrades('buy')">Buy</button>
        <button class="filter-btn" onclick="window.filterTrades('sell')">Sell</button>
        <button class="filter-btn" onclick="window.filterTrades('profitable')">Profitable</button>
        <button class="filter-btn" onclick="window.filterTrades('loss')">Loss</button>
    </div>

    <div class="trades-table-wrapper">
        <table class="trades-table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Symbol</th>
                <th>Type</th>
                <th>Status</th>
                <th>Entry Time</th>
                <th>Entry</th>
                <th>Exit Time</th>
                <th>Exit</th>
                <th>Qty</th>
                <th>Target</th>
                <th>SL</th>
                <th>P&L</th>
            </tr>
            </thead>
            <tbody id="tradesTableBody">
            <tr>
                <td colspan="12" class="no-trades">
                    <div class="spinner" style="margin-bottom:0.75rem;"></div>
                    Loading trades...
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination">
        <div class="page-size-selector">
            <span>Show:</span>
            <select id="pageSizeSelect" onchange="window.changePageSize(this.value)">
                <option value="8" selected>8</option>
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
            <span>per page</span>
        </div>

        <div class="pagination-info" id="paginationInfo">
            Showing 0-0 of 0
        </div>

        <div class="pagination-controls">
            <button class="pagination-btn" onclick="window.goToFirstPage()" id="firstPageBtn">«</button>
            <button class="pagination-btn" onclick="window.goToPrevPage()" id="prevPageBtn">‹</button>
            <span id="pageNumbers" style="display: flex; gap: 0.5rem;"></span>
            <button class="pagination-btn" onclick="window.goToNextPage()" id="nextPageBtn">›</button>
            <button class="pagination-btn" onclick="window.goToLastPage()" id="lastPageBtn">»</button>
        </div>
    </div>
</div>

<script>
    let tradesData = [];
    let currentFilter = 'all';
    let filteredTrades = [];
    let autoRefreshInterval = null;

    let currentPage = 1;
    let pageSize = 8;
    let totalPages = 1;

    let isLoading = false;
    let lastJsonString = null; // ← new: cache of last response

    function setLoading(loading) {
        isLoading = loading;
        const tbody = document.getElementById('tradesTableBody');
        if (!tbody) return;

        if (loading) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="12" class="no-trades">
                        <div class="spinner" style="margin-bottom:0.75rem;"></div>
                        Loading trades...
                    </td>
                </tr>
            `;
        }
    }

    async function fetchTrades(showLoader = false) {
        try {
            if (showLoader) setLoading(true);

            const apiName = window.currentStrategyApiName || null;
            const params = apiName ? `?name=${encodeURIComponent(apiName)}` : '';
            const response = await fetch(`/api/orders/orderList${params}`);
            if (!response.ok) {
                throw new Error('Failed to fetch trades');
            }

            const newData = await response.json();
            const newJson = JSON.stringify(newData);

            // If data is identical to last time, skip DOM updates -> no flicker
            if (newJson === lastJsonString) {
                return;
            }
            lastJsonString = newJson;

            tradesData = newData;
            filteredTrades = [...tradesData];
            calculateStats();
            renderTrades(filteredTrades);
        } catch (error) {
            console.error('Error fetching trades:', error);
            const tbody = document.getElementById('tradesTableBody');
            if (tbody) {
                tbody.innerHTML =
                    '<tr><td colspan="12" class="no-trades">Error loading trades. Please check API connection.</td></tr>';
            }
        } finally {
            if (showLoader) setLoading(false);
        }
    }

    function formatTime(dateString) {
        if (!dateString) return '-';
        const date = new Date(dateString);
        return date.toLocaleTimeString('en-US', {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        });
    }

    function formatDate(dateString) {
        if (!dateString) return '-';
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric'
        });
    }

    function calculateStats() {
        const closedTrades = tradesData.filter(t => t.status === 'CLOSED' && t.pnl !== null);
        const openTrades = tradesData.filter(t => t.status === 'OPEN').length;
        const profitableTrades = closedTrades.filter(t => t.pnl > 0).length;
        const totalPnl = closedTrades.reduce((sum, t) => sum + (t.pnl || 0), 0);
        const winRate = closedTrades.length > 0
            ? (profitableTrades / closedTrades.length * 100).toFixed(1)
            : 0;

        const totalTradesEl = document.getElementById('totalTrades');
        const winRateEl = document.getElementById('winRate');
        const totalPnlEl = document.getElementById('totalPnl');
        const openTradesEl = document.getElementById('openTrades');

        if (totalTradesEl) totalTradesEl.textContent = tradesData.length;
        if (winRateEl) winRateEl.textContent = winRate + '%';

        if (totalPnlEl) {
            totalPnlEl.textContent = totalPnl.toFixed(1);
            totalPnlEl.className = 'stat-value ' + (totalPnl >= 0 ? 'positive' : 'negative');
        }

        if (openTradesEl) openTradesEl.textContent = openTrades;
    }

    function renderTrades(trades) {
        const tbody = document.getElementById('tradesTableBody');
        if (!tbody) return;

        totalPages = Math.ceil(trades.length / pageSize) || 1;
        if (currentPage > totalPages) currentPage = totalPages;

        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = startIndex + pageSize;
        const paginatedTrades = trades.slice(startIndex, endIndex);

        if (trades.length === 0) {
            tbody.innerHTML = '<tr><td colspan="12" class="no-trades">No trades found</td></tr>';
            updatePaginationUI(0, 0, 0);
            return;
        }

        tbody.innerHTML = paginatedTrades.map(trade => `
            <tr>
                <td>${trade.strategy ?? '-'}</td>
                <td><strong>${trade.symbol ?? '-'}</strong></td>
                <td><span class="badge ${trade.tradeType ? trade.tradeType.toLowerCase() : ''}">
                      ${trade.tradeType ?? '-'}
                    </span>
                </td>
                <td><span class="badge ${trade.status ? trade.status.toLowerCase() : ''}">
                      ${trade.status ?? '-'}
                    </span>
                </td>
                <td>${formatDate(trade.entryTime)} ${formatTime(trade.entryTime)}</td>
                <td>${trade.entryPrice ?? '-'}</td>
                <td>${formatDate(trade.exitTime)} ${formatTime(trade.exitTime)}</td>
                <td>${trade.exitPrice ?? '-'}</td>
                <td>${trade.quantity ?? '-'}</td>
                <td>${trade.targetPrice ?? '-'}</td>
                <td>${trade.slPrice ?? '-'}</td>
                <td class="${trade.pnl !== null && trade.pnl !== undefined ? (trade.pnl >= 0 ? 'pnl-positive' : 'pnl-negative') : ''}">
                    ${trade.pnl !== null && trade.pnl !== undefined ? trade.pnl.toFixed(1) : '-'}
                </td>
            </tr>
        `).join('');

        updatePaginationUI(startIndex + 1, Math.min(endIndex, trades.length), trades.length);
    }

    function updatePaginationUI(start, end, total) {
        const infoEl = document.getElementById('paginationInfo');
        if (infoEl) {
            infoEl.textContent = total === 0 ? 'Showing 0-0 of 0' : `Showing ${start}-${end} of ${total}`;
        }

        const firstBtn = document.getElementById('firstPageBtn');
        const prevBtn = document.getElementById('prevPageBtn');
        const nextBtn = document.getElementById('nextPageBtn');
        const lastBtn = document.getElementById('lastPageBtn');

        if (firstBtn) firstBtn.disabled = currentPage === 1;
        if (prevBtn) prevBtn.disabled = currentPage === 1;
        if (nextBtn) nextBtn.disabled = currentPage === totalPages;
        if (lastBtn) lastBtn.disabled = currentPage === totalPages;

        renderPageNumbers();
    }

    function renderPageNumbers() {
        const pageNumbersEl = document.getElementById('pageNumbers');
        if (!pageNumbersEl) return;

        const maxButtons = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
        let endPage = Math.min(totalPages, startPage + maxButtons - 1);

        if (endPage - startPage < maxButtons - 1) {
            startPage = Math.max(1, endPage - maxButtons + 1);
        }

        let html = '';
        for (let i = startPage; i <= endPage; i++) {
            html += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="window.paginationGoToPage(${i})">${i}</button>`;
        }
        pageNumbersEl.innerHTML = html;
    }

    function goToPage(page) {
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        renderTrades(filteredTrades);
    }

    function goToFirstPage() { goToPage(1); }
    function goToPrevPage() { goToPage(currentPage - 1); }
    function goToNextPage() { goToPage(currentPage + 1); }
    function goToLastPage() { goToPage(totalPages); }

    function changePageSize(newSize) {
        pageSize = parseInt(newSize, 10);
        currentPage = 1;
        renderTrades(filteredTrades);
    }

    window.paginationGoToPage = goToPage;
    window.goToFirstPage = goToFirstPage;
    window.goToPrevPage = goToPrevPage;
    window.goToNextPage = goToNextPage;
    window.goToLastPage = goToLastPage;
    window.changePageSize = changePageSize;

    function filterTrades(filter) {
        currentFilter = filter;
        currentPage = 1;

        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');

        if (filter === 'all') {
            filteredTrades = [...tradesData];
        } else if (filter === 'open') {
            filteredTrades = tradesData.filter(t => t.status === 'OPEN');
        } else if (filter === 'closed') {
            filteredTrades = tradesData.filter(t => t.status === 'CLOSED');
        } else if (filter === 'buy') {
            filteredTrades = tradesData.filter(t => t.tradeType === 'BUY');
        } else if (filter === 'sell') {
            filteredTrades = tradesData.filter(t => t.tradeType === 'SELL');
        } else if (filter === 'profitable') {
            filteredTrades = tradesData.filter(t => t.pnl !== null && t.pnl > 0);
        } else if (filter === 'loss') {
            filteredTrades = tradesData.filter(t => t.pnl !== null && t.pnl < 0);
        }

        renderTrades(filteredTrades);
    }
    window.filterTrades = filterTrades;

    function startAutoRefresh() {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        fetchTrades(true);                 // first load with loader
        autoRefreshInterval = setInterval(() => fetchTrades(false), 30000); // later loads, no loader/flicker if unchanged
    }

    function cleanup() {
        if (autoRefreshInterval) {
            clearInterval(autoRefreshInterval);
            autoRefreshInterval = null;
        }
    }

    startAutoRefresh();
    window.addEventListener('beforeunload', cleanup);
</script>
