<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futures Filter Dashboard</title>
    <style>
        :root {
            /* Light theme colors */
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #555555;
            --text-tertiary: #666666;
            --border-color: #e0e0e0;
            --border-light: #f0f0f0;
            --input-bg: #ffffff;
            --input-border: #e0e0e0;
            --input-focus: #667eea;
            --hover-bg: #f8f9ff;
            --secondary-bg: #f0f0f0;
            --secondary-hover: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.2);
            --table-header-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --table-header-text: #ffffff;
            --empty-state-color: #999999;
        }

        [data-theme="dark"] {
            /* Dark theme colors */
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --card-bg: #0f1419;
            --text-primary: #e4e6eb;
            --text-secondary: #b0b3b8;
            --text-tertiary: #8a8d91;
            --border-color: #2f3336;
            --border-light: #38444d;
            --input-bg: #1c1f26;
            --input-border: #2f3336;
            --input-focus: #667eea;
            --hover-bg: #1a1f2e;
            --secondary-bg: #2a2f3a;
            --secondary-hover: #353a45;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --table-header-bg: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            --table-header-text: #e4e6eb;
            --empty-state-color: #555555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container {
            max-width: 98%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 15px;
            position: relative;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .theme-toggle {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 10px 15px;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .config-section {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px var(--shadow-color);
            transition: background 0.3s ease;
        }

        .config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-light);
        }

        .config-header h2 {
            color: var(--text-primary);
            font-size: 1.2rem;
        }

        .config-header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Toggle Switch */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: #667eea;
        }

        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        .toggle-slider.disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .config-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-group input {
            padding: 8px 10px;
            border: 2px solid var(--input-border);
            border-radius: 6px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input:disabled {
            background: var(--secondary-bg);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: var(--secondary-bg);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--secondary-hover);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn:disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .data-section {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px 20px;
            box-shadow: 0 5px 15px var(--shadow-color);
            transition: background 0.3s ease;
        }

        .data-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-light);
            flex-wrap: wrap;
            gap: 10px;
        }

        .data-header h2 {
            color: var(--text-primary);
            font-size: 1.2rem;
        }

        .data-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            padding: 8px 12px;
            border: 2px solid var(--input-border);
            border-radius: 6px;
            font-size: 0.85rem;
            background: var(--input-bg);
            color: var(--text-primary);
            min-width: 200px;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-icon {
            padding: 8px 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .filter-select {
            padding: 8px 12px;
            border: 2px solid var(--input-border);
            border-radius: 6px;
            font-size: 0.9rem;
            background: var(--input-bg);
            color: var(--text-primary);
            cursor: pointer;
            min-width: 180px;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid var(--border-light);
            flex-wrap: wrap;
            gap: 15px;
        }

        .pagination-info {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .pagination-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .pagination-btn {
            padding: 8px 16px;
            border: 2px solid var(--input-border);
            background: var(--card-bg);
            color: var(--text-primary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .pagination-btn:hover:not(:disabled) {
            background: var(--hover-bg);
            border-color: var(--input-focus);
        }

        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-size-select {
            padding: 8px 12px;
            border: 2px solid var(--input-border);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .sort-icon {
            margin-left: 5px;
            font-size: 0.8rem;
            opacity: 0.5;
        }

        th.sortable {
            cursor: pointer;
            user-select: none;
        }

        th.sortable:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .stats {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--text-tertiary);
            margin-bottom: 12px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: opacity 0.2s ease;
        }

        .table-container.updating {
            opacity: 0.6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
        }

        thead {
            background: var(--table-header-bg);
            color: var(--table-header-text);
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        tbody tr:hover {
            background: var(--hover-bg);
        }

        .positive {
            color: #10b981;
            font-weight: 600;
        }

        .negative {
            color: #ef4444;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-tertiary);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 10px var(--shadow-color);
            z-index: 10;
        }

        .loading-container {
            position: relative;
            min-height: 100px;
        }

        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #3c3;
        }

        [data-theme="dark"] .error {
            background: #3d1a1a;
            color: #ff6b6b;
        }

        [data-theme="dark"] .success {
            background: #1a3d1a;
            color: #51cf66;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--empty-state-color);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .config-form {
                grid-template-columns: 1fr;
            }

            .table-container {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>
            <h1>📊 Futures Filter Dashboard</h1>
            <p>Monitor stocks with 1% movement in futures</p>
        </div>

        <!-- Configuration Section -->
        <div class="config-section">
            <div class="config-header">
                <div class="config-header-left">
                    <h2>⚙️ Configuration</h2>
                    <div class="toggle-container">
                        <span class="toggle-label">Edit Mode</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="editToggle" onchange="toggleEditMode()">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
                <div class="button-group">
                    <button class="btn btn-secondary" onclick="loadConfig()" id="reloadBtn" disabled>🔄 Reload</button>
                    <button class="btn btn-primary" onclick="saveConfig()" id="saveBtn" disabled>💾 Save Config</button>
                </div>
            </div>

            <div id="configMessage"></div>

            <form id="configForm" class="config-form">
                <div class="form-group">
                    <label for="expiryDate">Expiry Date</label>
                    <input type="date" id="expiryDate" name="expiryDate" required disabled>
                </div>
                <div class="form-group">
                    <label for="movementPercent">Movement Percentage (%)</label>
                    <input type="number" id="movementPercent" name="movementPercent" step="0.01" min="0" max="100" required disabled>
                </div>
            </form>
        </div>

        <!-- Filtered Data Section -->
        <div class="data-section">
            <div class="data-header">
                <h2>📈 Filtered Futures Data</h2>
                <div class="data-controls">
                    <select class="filter-select" id="percentFilter" onchange="filterByPercentage()">
                        <option value="all">All % Moves</option>
                        <option value="<-5">< -5%</option>
                        <option value="-5to-4">-5% to -4%</option>
                        <option value="-4to-3">-4% to -3%</option>
                        <option value="-3to-2">-3% to -2%</option>
                        <option value="-2to-1">-2% to -1%</option>
                        <option value="-1to0">-1% to 0%</option>
                        <option value="0to1" selected>0% to 1%</option>
                        <option value="1to2">1% to 2%</option>
                        <option value="2to3">2% to 3%</option>
                        <option value="3to4">3% to 4%</option>
                        <option value="4to5">4% to 5%</option>
                        <option value=">5">> 5%</option>
                    </select>
                    <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search other fields..." onkeyup="filterTable()">
                    <button class="btn btn-primary btn-icon" onclick="exportToCSV()">
                        📥 CSV
                    </button>
                    <button class="btn btn-secondary btn-icon" onclick="loadFilteredData()">
                        🔄
                    </button>
                </div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span>Total Records:</span>
                    <strong id="totalCount">0</strong>
                </div>
                <div class="stat-item">
                    <span>Showing:</span>
                    <strong id="showingCount">0</strong>
                </div>
                <div class="stat-item">
                    <span>Last Updated:</span>
                    <strong id="lastUpdate">-</strong>
                </div>
            </div>

            <div id="dataMessage"></div>

            <div class="loading-container">
                <div id="dataLoading" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>

                <div id="tableContainer"></div>
            </div>

            <div id="paginationContainer" style="display: none;">
                <div class="pagination">
                    <div class="pagination-info">
                        <span>Rows per page:</span>
                        <select class="page-size-select" id="pageSize" onchange="changePageSize()">
                            <option value="10" selected>10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                    <div class="pagination-controls">
                        <button class="pagination-btn" onclick="goToFirstPage()">⏮️ First</button>
                        <button class="pagination-btn" onclick="previousPage()">◀️ Prev</button>
                        <span class="pagination-info" id="pageInfo">Page 1 of 1</span>
                        <button class="pagination-btn" onclick="nextPage()">Next ▶️</button>
                        <button class="pagination-btn" onclick="goToLastPage()">Last ⏭️</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api/futures';

        // Global state
        window.fullData = null;
        window.filteredData = null;
        window.currentPage = 1;
        window.pageSize = 10;
        window.sortColumn = null;
        window.sortDirection = 'asc';
        window.percentColumnName = null;

        // Theme Management
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const themeToggle = document.getElementById('themeToggle');
            themeToggle.textContent = theme === 'light' ? '🌙' : '☀️';
        }

        // Edit Mode Management
        function toggleEditMode() {
            const editToggle = document.getElementById('editToggle');
            const isEditMode = editToggle.checked;
            
            document.getElementById('expiryDate').disabled = !isEditMode;
            document.getElementById('movementPercent').disabled = !isEditMode;
            document.getElementById('reloadBtn').disabled = !isEditMode;
            document.getElementById('saveBtn').disabled = !isEditMode;
        }

        // Load configuration on page load
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadConfig();
            loadFilteredData();
        });

        // Load configuration
        async function loadConfig() {
            try {
                const response = await fetch(API_BASE_URL, {
                    method: 'GET',
                    headers: {
                        'Accept': '*/*'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const config = await response.json();
                
                if (config.expiryDate) {
                    document.getElementById('expiryDate').value = config.expiryDate;
                }
                if (config.movementPercent !== undefined) {
                    document.getElementById('movementPercent').value = config.movementPercent;
                }

                if (window.configLoadedOnce) {
                    showMessage('configMessage', 'Configuration loaded successfully', 'success');
                    setTimeout(() => clearMessage('configMessage'), 3000);
                }
                window.configLoadedOnce = true;

            } catch (error) {
                console.error('Error loading config:', error);
                showMessage('configMessage', 'Error loading configuration: ' + error.message, 'error');
            }
        }

        // Save configuration
        async function saveConfig() {
            try {
                const expiryDate = document.getElementById('expiryDate').value;
                const movementPercent = parseFloat(document.getElementById('movementPercent').value);

                if (!expiryDate || isNaN(movementPercent)) {
                    showMessage('configMessage', 'Please fill in all required fields', 'error');
                    return;
                }

                const config = {
                    expiryDate: expiryDate,
                    movementPercent: movementPercent
                };

                const response = await fetch(API_BASE_URL, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': '*/*'
                    },
                    body: JSON.stringify(config)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                showMessage('configMessage', 'Configuration saved successfully! Reloading filtered data...', 'success');
                
                setTimeout(() => {
                    loadFilteredData();
                    clearMessage('configMessage');
                }, 2000);

            } catch (error) {
                console.error('Error saving config:', error);
                showMessage('configMessage', 'Error saving configuration: ' + error.message, 'error');
            }
        }

        // Load filtered data
        async function loadFilteredData() {
            const loadingDiv = document.getElementById('dataLoading');
            const tableContainer = document.getElementById('tableContainer');
            
            if (tableContainer.innerHTML) {
                const tableDiv = tableContainer.querySelector('.table-container');
                if (tableDiv) {
                    tableDiv.classList.add('updating');
                }
            } else {
                loadingDiv.style.display = 'block';
            }

            try {
                const response = await fetch(`${API_BASE_URL}/filtered`, {
                    method: 'GET',
                    headers: {
                        'Accept': '*/*'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                loadingDiv.style.display = 'none';

                console.log('✅ Data loaded:', data.length, 'records');

                if (!data || data.length === 0) {
                    tableContainer.innerHTML = '';
                    showEmptyState();
                    document.getElementById('paginationContainer').style.display = 'none';
                    return;
                }

                // Store data
                window.fullData = data;
                window.filteredData = data;

                // Auto-detect percent column
                detectPercentColumn(data);

                // Apply filters (this will respect the dropdown selection)
                applyFilters();

                document.getElementById('paginationContainer').style.display = 'block';

                setTimeout(() => {
                    const tableDiv = tableContainer.querySelector('.table-container');
                    if (tableDiv) {
                        tableDiv.classList.remove('updating');
                    }
                }, 100);

            } catch (error) {
                console.error('Error loading filtered data:', error);
                loadingDiv.style.display = 'none';
                const tableDiv = tableContainer.querySelector('.table-container');
                if (tableDiv) {
                    tableDiv.classList.remove('updating');
                }
                showMessage('dataMessage', 'Error loading filtered data: ' + error.message, 'error');
            }
        }

        // Detect percent column
        function detectPercentColumn(data) {
            if (!data || data.length === 0) {
                window.percentColumnName = null;
                return;
            }
            
            const firstRow = data[0];
            const keys = Object.keys(firstRow);
            
            let percentKey = keys.find(key => 
                key.toLowerCase() === 'percentmove' || 
                key.toLowerCase() === 'percent move' ||
                key.toLowerCase() === 'percentagemove'
            );
            
            if (!percentKey) {
                percentKey = keys.find(key => {
                    const lower = key.toLowerCase();
                    return lower.includes('percent') && lower.includes('move');
                });
            }
            
            if (!percentKey) {
                percentKey = keys.find(key => {
                    const lower = key.toLowerCase();
                    return lower.includes('percent') || 
                           lower.includes('change') || 
                           lower.includes('pct') ||
                           key.includes('%');
                });
            }
            
            if (!percentKey) {
                percentKey = keys.find(key => key.toLowerCase().includes('move'));
            }
            
            window.percentColumnName = percentKey;
            console.log('✅ Detected percent column:', percentKey);
        }

        // Get percent value
        function getPercentValue(row) {
            if (!window.percentColumnName) return null;
            return row[window.percentColumnName];
        }

        // Apply filters
        function applyFilters() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const percentFilter = document.getElementById('percentFilter').value;
            
            if (!window.fullData) {
                console.log('⚠️ No fullData available');
                return;
            }
            
            let filtered = [...window.fullData];

            // Apply percentage filter
            if (percentFilter !== 'all' && window.percentColumnName) {
                filtered = filtered.filter(row => {
                    const percentValue = getPercentValue(row);
                    
                    if (percentValue !== undefined && percentValue !== null) {
                        const pct = parseFloat(percentValue);
                        if (!isNaN(pct)) {
                            if (percentFilter.startsWith('<')) {
                                const threshold = parseFloat(percentFilter.substring(1));
                                return pct < threshold;
                            } else if (percentFilter.startsWith('>')) {
                                const threshold = parseFloat(percentFilter.substring(1));
                                return pct > threshold;
                            } else if (percentFilter.includes('to')) {
                                const [start, end] = percentFilter.split('to').map(v => parseFloat(v));
                                return pct >= start && pct < end;
                            }
                        }
                    }
                    return false;
                });
            }

            // Apply search filter
            if (searchTerm) {
                filtered = filtered.filter(row => {
                    return Object.values(row).some(val => 
                        String(val).toLowerCase().includes(searchTerm)
                    );
                });
            }
            
            console.log('✅ Filtered:', filtered.length, 'records');
            
            window.filteredData = filtered;
            window.currentPage = 1;
            
            renderTable();
            updateStats();
        }

        // Filter functions
        function filterTable() {
            applyFilters();
        }

        function filterByPercentage() {
            applyFilters();
        }

        // Sort table
        function sortTable(column) {
            if (window.sortColumn === column) {
                window.sortDirection = window.sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                window.sortColumn = column;
                window.sortDirection = 'asc';
            }

            window.filteredData.sort((a, b) => {
                let valA = a[column];
                let valB = b[column];

                if (valA == null) return 1;
                if (valB == null) return -1;

                const numA = parseFloat(valA);
                const numB = parseFloat(valB);

                if (!isNaN(numA) && !isNaN(numB)) {
                    return window.sortDirection === 'asc' ? numA - numB : numB - numA;
                }

                const strA = String(valA).toLowerCase();
                const strB = String(valB).toLowerCase();
                
                if (window.sortDirection === 'asc') {
                    return strA.localeCompare(strB);
                } else {
                    return strB.localeCompare(strA);
                }
            });

            renderTable();
        }

        // Pagination functions
        function changePageSize() {
            window.pageSize = parseInt(document.getElementById('pageSize').value);
            window.currentPage = 1;
            renderTable();
        }

        function goToFirstPage() {
            window.currentPage = 1;
            renderTable();
        }

        function previousPage() {
            if (window.currentPage > 1) {
                window.currentPage--;
                renderTable();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(window.filteredData.length / window.pageSize);
            if (window.currentPage < totalPages) {
                window.currentPage++;
                renderTable();
            }
        }

        function goToLastPage() {
            const totalPages = Math.ceil(window.filteredData.length / window.pageSize);
            window.currentPage = totalPages;
            renderTable();
        }

        // Render table
        function renderTable() {
            const tableContainer = document.getElementById('tableContainer');
            
            if (!window.filteredData || window.filteredData.length === 0) {
                console.log('⚠️ No data to display');
                showEmptyState();
                return;
            }

            console.log('🎨 Rendering table with', window.filteredData.length, 'records');

            const columnsToShow = [
                'name',
                'lastExpiryDate', 
                'lastExpiryPrice',
                'lastTradedDate',
                'lastTradedPrice',
                'percentMove',
                'direction'
            ];

            const allKeys = Object.keys(window.filteredData[0]);
            const columns = columnsToShow.filter(col => allKeys.includes(col));

            const startIndex = (window.currentPage - 1) * window.pageSize;
            const endIndex = startIndex + window.pageSize;
            const paginatedData = window.filteredData.slice(startIndex, endIndex);

            const getSortIcon = (col) => {
                if (window.sortColumn === col) {
                    return window.sortDirection === 'asc' ? '▲' : '▼';
                }
                return '↕';
            };

            let tableHTML = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                ${columns.map(col => `
                                    <th class="sortable" onclick="sortTable('${col}')">
                                        ${formatColumnName(col)}
                                        <span class="sort-icon">${getSortIcon(col)}</span>
                                    </th>
                                `).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            ${paginatedData.map(row => `
                                <tr>
                                    ${columns.map(col => `<td>${formatCellValue(col, row[col])}</td>`).join('')}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            tableContainer.innerHTML = tableHTML;
            console.log('✅ Table rendered successfully');

            updatePaginationInfo();
        }

        // Update pagination info
        function updatePaginationInfo() {
            if (!window.filteredData) return;
            
            const totalPages = Math.ceil(window.filteredData.length / window.pageSize);
            const pageInfoElem = document.getElementById('pageInfo');
            
            if (pageInfoElem) {
                pageInfoElem.textContent = `Page ${window.currentPage} of ${totalPages}`;
            }
        }

        // Update stats
        function updateStats() {
            const totalCountElem = document.getElementById('totalCount');
            const showingCountElem = document.getElementById('showingCount');
            const lastUpdateElem = document.getElementById('lastUpdate');
            
            if (totalCountElem && window.fullData) {
                totalCountElem.textContent = window.fullData.length;
            }
            
            if (showingCountElem && window.filteredData) {
                const startIndex = (window.currentPage - 1) * window.pageSize;
                const endIndex = Math.min(startIndex + window.pageSize, window.filteredData.length);
                showingCountElem.textContent = `${startIndex + 1}-${endIndex} of ${window.filteredData.length}`;
            }
            
            if (lastUpdateElem) {
                lastUpdateElem.textContent = new Date().toLocaleTimeString();
            }
        }

        // Format column names
        function formatColumnName(name) {
            return name
                .replace(/([A-Z])/g, ' $1')
                .replace(/^./, str => str.toUpperCase())
                .trim();
        }

        // Format cell values
        function formatCellValue(column, value) {
            if (value === null || value === undefined) return '-';

            if (column.toLowerCase().includes('percent') || column.toLowerCase().includes('change')) {
                const num = parseFloat(value);
                if (!isNaN(num)) {
                    const className = num >= 0 ? 'positive' : 'negative';
                    return `<span class="${className}">${num >= 0 ? '+' : ''}${num.toFixed(2)}%</span>`;
                }
            }

            if (typeof value === 'number') {
                return value.toFixed(2);
            }

            return value;
        }

        // Export to CSV
        function exportToCSV() {
            if (!window.fullData || window.fullData.length === 0) {
                alert('No data to export');
                return;
            }

            const data = window.filteredData || window.fullData;
            const columns = Object.keys(data[0]);
            
            let csv = columns.join(',') + '\n';
            
            data.forEach(row => {
                const values = columns.map(col => {
                    const val = row[col];
                    if (val === null || val === undefined) return '';
                    const str = String(val);
                    if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                        return '"' + str.replace(/"/g, '""') + '"';
                    }
                    return str;
                });
                csv += values.join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', `futures_data_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Show empty state
        function showEmptyState() {
            const tableContainer = document.getElementById('tableContainer');
            tableContainer.innerHTML = `
                <div class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                    </svg>
                    <h3>No Data Available</h3>
                    <p>No stocks matching the filter criteria found.</p>
                </div>
            `;
        }

        // Show message
        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="${type}">${message}</div>`;
        }

        // Clear message
        function clearMessage(elementId) {
            document.getElementById(elementId).innerHTML = '';
        }

        // Auto-refresh every 30 minutes
        setInterval(() => {
            loadFilteredData();
        }, 1800000);
    </script>
</body>
</html>
