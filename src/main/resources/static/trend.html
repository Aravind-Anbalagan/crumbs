<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crumbs Execution Terminal</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #131722;
            --text-color: #d1d4dc;
            --header-bg: #1e222d;
            --border-color: #2b2b43;
            --btn-bg: #2b2b43;
            --btn-hover: #363a45;
            --accent-blue: #2962FF;
        }

        body.light-mode {
            --bg-color: #ffffff;
            --text-color: #191919;
            --header-bg: #f0f3fa;
            --border-color: #d1d4dc;
            --btn-bg: #e0e3eb;
            --btn-hover: #c5cbce;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #header {
            padding: 10px 15px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            gap: 10px;
        }

        .controls { display: flex; align-items: center; gap: 12px; }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-color);
            padding: 6px 14px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .toggle-group label { display: flex; align-items: center; cursor: pointer; gap: 6px; font-weight: 500; }

        .controls select, .controls button {
            background: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        #theme-btn { 
            padding: 7px 12px; 
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #chart-wrapper {
            flex-grow: 1;
            position: relative;
            width: 100%;
        }

        #chart-container {
            width: 100%;
            height: 100%;
        }

        #chart-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(19, 23, 34, 0.8);
            z-index: 10;
            color: #ef5350;
            font-weight: bold;
        }

        input[type="radio"], input[type="checkbox"] { accent-color: var(--accent-blue); cursor: pointer; }
        
        .color-vwap { color: #ff9800; }
        .color-fast { color: #2962FF; }
        .color-slow { color: #FF6D00; }
    </style>
</head>
<body>

    <div id="header">
        <h2>⚡ Crumbs Terminal</h2>
        
        <div class="toggle-group">
            <label class="color-vwap"><input type="checkbox" id="toggle-vwap" checked onchange="applyToggles()"> VWAP</label>
            <label class="color-fast"><input type="checkbox" id="toggle-fast-ema" checked onchange="applyToggles()"> Fast EMA</label>
            <label class="color-slow"><input type="checkbox" id="toggle-slow-ema" checked onchange="applyToggles()"> Slow EMA</label>
            <label><input type="checkbox" id="toggle-crossovers" checked onchange="applyToggles()"> 🎯 Signals</label>
        </div>

        <div class="controls">
            <button id="theme-btn" onclick="toggleTheme()" title="Switch Light/Dark Mode">🌓 Theme</button>

            <div class="toggle-group">
                <label><input type="radio" name="symbol-select" id="sym-nifty" value="SAMCO_NIFTY" onchange="updateChart()"> NIFTY</label>
                <label><input type="radio" name="symbol-select" id="sym-crude" value="CRUDEOIL" onchange="updateChart()"> CRUDEOIL</label>
            </div>

            <select id="select-chart-type" onchange="applyToggles()">
                <option value="candle">Candlesticks</option>
                <option value="line">Line (Close)</option>
            </select>
            
            <button onclick="updateChart()">🔄 Sync</button>
        </div>
    </div>

    <div id="chart-wrapper">
        <div id="chart-overlay">
            <div id="overlay-message">Searching for data...</div>
        </div>
        <div id="chart-container"></div>
    </div>

    <script>
        const AppState = {
            chart: null,
            series: { candle: null, priceLine: null, vwap: null, fastEma: null, slowEma: null },
            data: { candles: [], priceLine: [], vwap: [], fastEma: [], slowEma: [], markers: { crossovers: [] } }
        };

        function initApp() {
            const now = new Date();
            const hour = now.getHours();
            
            // Logic: 9 AM to 4 PM (16:00)
            const isDaytime = (hour >= 9 && hour < 16);

            // Set default theme based on time
            if (isDaytime) {
                document.body.classList.add('light-mode');
            }

            // Set default symbol based on time
            if (isDaytime) {
                document.getElementById('sym-nifty').checked = true;
            } else {
                document.getElementById('sym-crude').checked = true;
            }

            setupChart();
            
            window.addEventListener('resize', () => {
                const wrapper = document.getElementById('chart-wrapper');
                if (AppState.chart) AppState.chart.resize(wrapper.clientWidth, wrapper.clientHeight);
            });

            updateChart();
        }

        function setupChart() {
            const container = document.getElementById('chart-container');
            const wrapper = document.getElementById('chart-wrapper');
            
            AppState.chart = LightweightCharts.createChart(container, {
                width: wrapper.clientWidth,
                height: wrapper.clientHeight,
                timeScale: { timeVisible: true }
            });

            syncChartColors();

            AppState.series.candle = AppState.chart.addCandlestickSeries({ upColor: '#26a69a', downColor: '#ef5350' });
            AppState.series.priceLine = AppState.chart.addLineSeries({ color: '#2962FF', visible: false });
            AppState.series.vwap = AppState.chart.addLineSeries({ color: '#ff9800', lineWidth: 2 });
            AppState.series.fastEma = AppState.chart.addLineSeries({ color: '#2962FF', lineWidth: 2 });
            AppState.series.slowEma = AppState.chart.addLineSeries({ color: '#FF6D00', lineWidth: 2 });
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            syncChartColors();
        }

        function syncChartColors() {
            const isLight = document.body.classList.contains('light-mode');
            const themeCfg = {
                background: isLight ? '#ffffff' : '#131722',
                text: isLight ? '#191919' : '#d1d4dc',
                grid: isLight ? '#f0f3fa' : '#2b2b43'
            };

            AppState.chart.applyOptions({
                layout: { background: { type: 'solid', color: themeCfg.background }, textColor: themeCfg.text },
                grid: { vertLines: { color: themeCfg.grid }, horzLines: { color: themeCfg.grid } }
            });

            const overlay = document.getElementById('chart-overlay');
            overlay.style.backgroundColor = isLight ? 'rgba(255,255,255,0.8)' : 'rgba(19,23,34,0.8)';
        }

        function showOverlay(msg) {
            const overlay = document.getElementById('chart-overlay');
            const messageEl = document.getElementById('overlay-message');
            messageEl.innerText = msg;
            overlay.style.display = 'flex';
        }

        function hideOverlay() {
            document.getElementById('chart-overlay').style.display = 'none';
        }

        function clearChart() {
            Object.values(AppState.series).forEach(s => s && s.setData([]));
            AppState.series.candle.setMarkers([]);
        }

        async function updateChart() {
            const symbol = document.querySelector('input[name="symbol-select"]:checked').value;
            
            clearChart();
            showOverlay(`Fetching ${symbol} data...`);

            try {
                const response = await fetch(`/api/v1/market-trend/chart-data?symbol=${symbol}&timeframe=FIVE_MINUTE`);
                const rawData = await response.json();

                if (!rawData || !Array.isArray(rawData) || rawData.length === 0) {
                    showOverlay(`🚫 No data found for ${symbol}`);
                    return;
                }

                hideOverlay();
                processData(rawData);
                
                AppState.series.candle.setData(AppState.data.candles);
                AppState.series.priceLine.setData(AppState.data.priceLine);
                AppState.series.vwap.setData(AppState.data.vwap);
                AppState.series.fastEma.setData(AppState.data.fastEma);
                AppState.series.slowEma.setData(AppState.data.slowEma);
                
                applyToggles();
                AppState.chart.timeScale().fitContent();

            } catch (error) {
                console.error(error);
                showOverlay(`⚠️ Error syncing ${symbol} data`);
            }
        }

        function processData(rawData) {
            AppState.data = { candles: [], priceLine: [], vwap: [], fastEma: [], slowEma: [], markers: { crossovers: [] } };
            rawData.forEach(item => {
                const time = Math.floor(new Date(item.timestamp).getTime() / 1000) + 19800; 
                if (item.close) {
                    AppState.data.candles.push({ time, open: item.open, high: item.high, low: item.low, close: item.close });
                    AppState.data.priceLine.push({ time, value: item.close });
                }
                if (item.vwap) AppState.data.vwap.push({ time, value: item.vwap });
                if (item.fastEma) AppState.data.fastEma.push({ time, value: item.fastEma });
                if (item.slowEma) AppState.data.slowEma.push({ time, value: item.slowEma });
                
                if (item.crossoverEvent === 'BUY_CROSS') {
                    AppState.data.markers.crossovers.push({ time, position: 'belowBar', color: '#26a69a', shape: 'arrowUp', text: 'BUY' });
                } else if (item.crossoverEvent === 'SELL_CROSS') {
                    AppState.data.markers.crossovers.push({ time, position: 'aboveBar', color: '#ef5350', shape: 'arrowDown', text: 'SELL' });
                }
            });
        }

        function applyToggles() {
            const isLine = document.getElementById('select-chart-type').value === 'line';
            AppState.series.candle.applyOptions({ visible: !isLine });
            AppState.series.priceLine.applyOptions({ visible: isLine });
            AppState.series.vwap.applyOptions({ visible: document.getElementById('toggle-vwap').checked });
            AppState.series.fastEma.applyOptions({ visible: document.getElementById('toggle-fast-ema').checked });
            AppState.series.slowEma.applyOptions({ visible: document.getElementById('toggle-slow-ema').checked });

            const markers = document.getElementById('toggle-crossovers').checked ? AppState.data.markers.crossovers : [];
            AppState.series.candle.setMarkers(isLine ? [] : markers);
            AppState.series.priceLine.setMarkers(isLine ? markers : []);
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
