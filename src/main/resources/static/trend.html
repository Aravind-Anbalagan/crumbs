<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crumbs Terminal - Glass Execution</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        /* --- Glassmorphism Theme Variables --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #090e17, #131722, #1a1625);
            --glass-bg: rgba(19, 23, 34, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);

            --btn-glass: rgba(255, 255, 255, 0.05);
            --btn-glass-hover: rgba(255, 255, 255, 0.1);

            --text-color: #e2e8f0;
            --text-muted: #8b94a5;
            --accent-blue: #3b82f6;
            --chart-grid: rgba(255, 255, 255, 0.05);
        }

        body.light-mode {
            --bg-gradient: linear-gradient(135deg, #e0e7ff, #f8fafc, #f3e8ff);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);

            --btn-glass: rgba(0, 0, 0, 0.04);
            --btn-glass-hover: rgba(0, 0, 0, 0.08);

            --text-color: #1e293b;
            --text-muted: #64748b;
            --chart-grid: rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* --- Glass Panel Utility --- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            transition: all 0.4s ease;
        }

        /* --- Header Styles --- */
        #header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            gap: 15px;
            z-index: 10;
        }

        .title-wrapper { display: flex; align-items: center; gap: 10px; margin: 0; }
        .title-wrapper h2 { margin: 0; font-size: 1.3rem; letter-spacing: 0.5px; }

        .live-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #ef5350; display: inline-block;
            transition: background 0.3s;
        }
        .live-dot.connected {
            background: #26a69a;
            box-shadow: 0 0 10px #26a69a;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .controls { display: flex; align-items: center; gap: 12px; }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--btn-glass);
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .toggle-group label { display: flex; align-items: center; cursor: pointer; gap: 6px; font-weight: 500; }

        .controls select, .controls button {
            background: var(--btn-glass);
            color: var(--text-color);
            border: 1px solid var(--glass-border);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }
        .controls button:hover, .controls select:hover { background: var(--btn-glass-hover); }

        #theme-btn { padding: 7px 12px; font-size: 1rem; display: flex; align-items: center; gap: 5px; }

        /* --- Layout Wrappers --- */
        #main-wrapper {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
            width: 100%;
            padding: 15px;
            gap: 15px;
        }

        /* --- Chart Area --- */
        #chart-wrapper {
            flex-grow: 1;
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
        }

        #chart-container {
            width: 100%;
            height: 100%;
        }

        #chart-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            z-index: 10;
            color: var(--accent-blue);
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        input[type="radio"], input[type="checkbox"] { accent-color: var(--accent-blue); cursor: pointer; }

        .color-vwap { color: #d946ef; font-weight: bold; }
        .color-fast { color: #10b981; font-weight: bold; }
        .color-slow { color: #ef4444; font-weight: bold; }

        /* Custom Scrollbar for logs */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(150, 150, 150, 0.5); }
    </style>
</head>
<body>

    <div id="header" class="glass-panel">
        <div class="title-wrapper">
            <h2>⚡ Crumbs Terminal</h2>
            <span id="live-dot" class="live-dot" title="SSE Disconnected"></span>
        </div>

        <div class="toggle-group">
            <label class="color-vwap"><input type="checkbox" id="toggle-vwap" checked onchange="applyToggles()"> VWAP</label>
            <label class="color-fast"><input type="checkbox" id="toggle-fast-ema" checked onchange="applyToggles()"> Fast EMA</label>
            <label class="color-slow"><input type="checkbox" id="toggle-slow-ema" checked onchange="applyToggles()"> Slow EMA</label>
            <label><input type="checkbox" id="toggle-crossovers" checked onchange="applyToggles()"> 🎯 Signals</label>
        </div>

        <div class="controls">
            <button id="theme-btn" onclick="toggleTheme()" title="Switch Light/Dark Mode">🌓 Theme</button>

            <div class="toggle-group">
                <label><input type="radio" name="symbol-select" id="sym-nifty" value="SAMCO_NIFTY" onchange="updateChart()"> NIFTY</label>
                <label><input type="radio" name="symbol-select" id="sym-crude" value="CRUDEOIL" onchange="updateChart()"> CRUDEOIL</label>
            </div>

            <button onclick="updateChart()">🔄 Sync</button>
        </div>
    </div>

    <div id="main-wrapper">
        <div id="chart-wrapper" class="glass-panel">
            <div id="chart-overlay">
                <div id="overlay-message">Searching for data...</div>
            </div>
            <div id="chart-container"></div>
        </div>
    </div>

    <script>
        // --- Core App State ---
        const AppState = {
            chart: null,
            series: { candle: null, vwap: null, fastEma: null, slowEma: null },
            data: { candles: [], vwap: [], fastEma: [], slowEma: [], markers: { crossovers: [] } }
        };

        // --- SSE Stream State ---
        const StreamState = {
            source: null,
            iKeyCurrent: null,
            iKeyCache: {},
            pendingTicks: [],
            TF_SECS: 300,
            IST_OFFSET: 19800
        };

        function initApp() {
            const now = new Date();
            const hour = now.getHours();

            const isDaytime = (hour >= 9 && hour < 16);

            if (isDaytime) {
                document.body.classList.add('light-mode');
                document.getElementById('sym-nifty').checked = true;
            } else {
                document.getElementById('sym-crude').checked = true;
            }

            setupChart();

            // Replaced default event listener with ResizeObserver to prevent shrinking/squishing
            const wrapper = document.getElementById('chart-wrapper');
            const resizeObserver = new ResizeObserver(entries => {
                if (entries.length === 0 || !AppState.chart) return;
                const { width, height } = entries[0].contentRect;
                AppState.chart.applyOptions({ width, height });
            });
            resizeObserver.observe(wrapper);

            updateChart();
            connectSSE();
        }

        function setupChart() {
            const container = document.getElementById('chart-container');
            const wrapper = document.getElementById('chart-wrapper');

            AppState.chart = LightweightCharts.createChart(container, {
                width: wrapper.clientWidth,
                height: wrapper.clientHeight,
                timeScale: { timeVisible: true },
                layout: { background: { type: 'solid', color: 'transparent' } } // Required for glass background to show through
            });

            syncChartColors();

            AppState.series.candle = AppState.chart.addCandlestickSeries({ upColor: '#10b981', downColor: '#ef4444' });

            AppState.series.vwap = AppState.chart.addLineSeries({ color: '#d946ef', lineWidth: 2 });
            AppState.series.fastEma = AppState.chart.addLineSeries({ color: '#10b981', lineWidth: 2 });
            AppState.series.slowEma = AppState.chart.addLineSeries({ color: '#ef4444', lineWidth: 2 });
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            syncChartColors();
        }

        function syncChartColors() {
            const isLight = document.body.classList.contains('light-mode');
            const textColor = isLight ? '#1e293b' : '#e2e8f0';
            const gridColor = isLight ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.05)';

            if(AppState.chart) {
                AppState.chart.applyOptions({
                    layout: { textColor: textColor },
                    grid: { vertLines: { color: gridColor }, horzLines: { color: gridColor } }
                });
            }

            if (AppState.data.markers.crossovers.length > 0) applyToggles();
        }

        function showOverlay(msg) {
            const overlay = document.getElementById('chart-overlay');
            document.getElementById('overlay-message').innerText = msg;
            overlay.style.display = 'flex';
        }

        function hideOverlay() {
            document.getElementById('chart-overlay').style.display = 'none';
        }

        function clearChart() {
            Object.values(AppState.series).forEach(s => s && s.setData([]));
            AppState.series.candle.setMarkers([]);
        }

        async function updateChart() {
            const symbol = document.querySelector('input[name="symbol-select"]:checked').value;
            const wsSymbol = symbol === 'SAMCO_NIFTY' ? 'NIFTY' : symbol;

            clearChart();
            showOverlay(`Fetching ${symbol} data...`);

            try {
                const response = await fetch(`/api/v1/market-trend/chart-data?symbol=${symbol}&timeframe=FIVE_MINUTE`);
                const rawData = await response.json();

                if (!rawData || !Array.isArray(rawData) || rawData.length === 0) {
                    showOverlay(`🚫 No data found for ${symbol}`);
                    return;
                }

                hideOverlay();
                processData(rawData);

                AppState.series.candle.setData(AppState.data.candles);
                AppState.series.vwap.setData(AppState.data.vwap);
                AppState.series.fastEma.setData(AppState.data.fastEma);
                AppState.series.slowEma.setData(AppState.data.slowEma);

                applyToggles();

                // Wrapping in a slight timeout ensures fitContent accounts for flexbox loading sizes
                setTimeout(() => {
                    AppState.chart.timeScale().fitContent();
                }, 50);

                resolveStreamKey(symbol);

            } catch (error) {
                console.error(error);
                showOverlay(`⚠️ Error syncing ${symbol} data`);
            }
        }

        function processData(rawData) {
            AppState.data = { candles: [], vwap: [], fastEma: [], slowEma: [], markers: { crossovers: [] } };

            // Sort data chronologically to prevent chart shrinking due to unsorted items
            rawData.sort((a, b) => new Date(a.timestamp).getTime() - new Date(b.timestamp).getTime());

            rawData.forEach(item => {
                const time = Math.floor(new Date(item.timestamp).getTime() / 1000) + StreamState.IST_OFFSET;
                if (item.close) {
                    AppState.data.candles.push({ time, open: item.open, high: item.high, low: item.low, close: item.close });
                }
                if (item.vwap) AppState.data.vwap.push({ time, value: item.vwap });
                if (item.fastEma) AppState.data.fastEma.push({ time, value: item.fastEma });
                if (item.slowEma) AppState.data.slowEma.push({ time, value: item.slowEma });

                if (item.signal === 'BUY') {
                    AppState.data.markers.crossovers.push({ time, position: 'belowBar', color: '#10b981', shape: 'arrowUp', text: 'BUY' });
                } else if (item.signal === 'SELL') {
                    AppState.data.markers.crossovers.push({ time, position: 'aboveBar', color: '#ef4444', shape: 'arrowDown', text: 'SELL' });
                }
            });
        }

        function applyToggles() {
            AppState.series.vwap.applyOptions({ visible: document.getElementById('toggle-vwap').checked });
            AppState.series.fastEma.applyOptions({ visible: document.getElementById('toggle-fast-ema').checked });
            AppState.series.slowEma.applyOptions({ visible: document.getElementById('toggle-slow-ema').checked });

            const isLight = document.body.classList.contains('light-mode');
            const safeBuyColor = isLight ? '#059669' : '#34d399';
            const safeSellColor = isLight ? '#dc2626' : '#f87171';

            const themeAwareMarkers = AppState.data.markers.crossovers.map(m => ({
                time: m.time,
                position: m.position,
                color: m.text === 'BUY' ? safeBuyColor : safeSellColor,
                shape: m.shape,
                text: m.text
            }));

            const activeMarkers = document.getElementById('toggle-crossovers').checked ? themeAwareMarkers : [];
            AppState.series.candle.setMarkers(activeMarkers);
        }

        async function getInstrumentKey(name) {
            if (StreamState.iKeyCache[name]) return StreamState.iKeyCache[name];
            try {
                const res = await fetch(`/api/websocket/instrument/key?name=${encodeURIComponent(name)}`);
                const data = await res.json();
                const key = data.key || data.instrumentKey || null;
                if (key) StreamState.iKeyCache[name] = key;
                return key;
            } catch (e) {
                return null;
            }
        }

        async function resolveStreamKey(symbol) {
            StreamState.iKeyCurrent = null;
            const wsSymbol = symbol === 'SAMCO_NIFTY' ? 'NIFTY' : symbol;

            const key = await getInstrumentKey(wsSymbol);
            StreamState.iKeyCurrent = key;

            if (StreamState.pendingTicks.length) {
                StreamState.pendingTicks.forEach(applyTick);
                StreamState.pendingTicks.length = 0;
            }
        }

        function connectSSE() {
            if (StreamState.source) { StreamState.source.close(); StreamState.source = null; }

            StreamState.source = new EventSource('/api/stream/market');

            StreamState.source.onopen = () => {
                document.getElementById('live-dot').className = 'live-dot connected';
                document.getElementById('live-dot').title = 'SSE Connected (Live)';
            };

            StreamState.source.onerror = () => {
                document.getElementById('live-dot').className = 'live-dot';
                document.getElementById('live-dot').title = 'Reconnecting...';
                StreamState.source.close();
                StreamState.source = null;
                setTimeout(connectSSE, 3000);
            };

            StreamState.source.addEventListener('ltp', e => {
                let d;
                try { d = JSON.parse(e.data); } catch (ex) { return; }
                if (!d || d.price == null) return;

                const price = +d.price;
                const tickKey = d.key ? String(d.key) : null;

                if (!isFinite(price) || price <= 0) return;

                if (tickKey && !StreamState.iKeyCurrent) {
                    StreamState.pendingTicks.push({ price, tickKey });
                    return;
                }

                if (tickKey !== StreamState.iKeyCurrent) return;

                applyTick(price);
            });
        }

        function applyTick(priceOrObj) {
            const rawPrice = typeof priceOrObj === 'object' ? priceOrObj.price : priceOrObj;
            const vwapVal = typeof priceOrObj === 'object' ? priceOrObj.vwap : undefined;
            const fastEmaVal = typeof priceOrObj === 'object' ? priceOrObj.fastEma : undefined;
            const slowEmaVal = typeof priceOrObj === 'object' ? priceOrObj.slowEma : undefined;

            const price = +rawPrice;
            if (!isFinite(price) || price <= 0) return;

            const candles = AppState.data.candles;
            if (!candles.length || !AppState.series.candle) return;

            const last = candles[candles.length - 1];

            // --- 🛡️ THE SHRINK FIX: OUTLIER FILTER ---
            // If the incoming live tick is more than 10% different from the last close,
            // it is a bad tick (e.g. missing decimal, paisa conversion error). Ignore it.
            const percentDiff = Math.abs(price - last.close) / last.close;
            if (percentDiff > 0.10) {
                console.warn(`⚠️ Dropped anomaly tick: ${price} (Last close: ${last.close})`);
                return;
            }

            // --- 🛡️ INDICATOR ZERO-DROP FIX ---
            // If the stream sends a 0 for VWAP or EMA, it will crush the Y-axis. Filter them to undefined.
            const safeVwap = (vwapVal > 0) ? vwapVal : undefined;
            const safeFast = (fastEmaVal > 0) ? fastEmaVal : undefined;
            const safeSlow = (slowEmaVal > 0) ? slowEmaVal : undefined;

            const nowIST = Math.floor(Date.now() / 1000) + StreamState.IST_OFFSET;
            const barFloor = Math.floor(nowIST / StreamState.TF_SECS) * StreamState.TF_SECS;

            if (barFloor > last.time) {
                const nc = { time: barFloor, open: price, high: price, low: price, close: price };
                candles.push(nc);

                const lastVwap = AppState.data.vwap.length ? AppState.data.vwap[AppState.data.vwap.length - 1].value : price;
                const lastFastEma = AppState.data.fastEma.length ? AppState.data.fastEma[AppState.data.fastEma.length - 1].value : price;
                const lastSlowEma = AppState.data.slowEma.length ? AppState.data.slowEma[AppState.data.slowEma.length - 1].value : price;

                const nVwap = { time: barFloor, value: safeVwap !== undefined ? safeVwap : lastVwap };
                const nFastEma = { time: barFloor, value: safeFast !== undefined ? safeFast : lastFastEma };
                const nSlowEma = { time: barFloor, value: safeSlow !== undefined ? safeSlow : lastSlowEma };

                AppState.data.vwap.push(nVwap);
                AppState.data.fastEma.push(nFastEma);
                AppState.data.slowEma.push(nSlowEma);

                try {
                    AppState.series.candle.update(nc);
                    AppState.series.vwap.update(nVwap);
                    AppState.series.fastEma.update(nFastEma);
                    AppState.series.slowEma.update(nSlowEma);
                } catch(e) {}

            } else {
                const upd = {
                    time: last.time,
                    open: +last.open,
                    high: Math.max(+last.high, price),
                    low: Math.min(+last.low, price),
                    close: price
                };

                candles[candles.length - 1] = upd;

                // Only update indicators if the stream actually sent a valid > 0 number
                if (safeVwap !== undefined) {
                    const uVwap = { time: last.time, value: safeVwap };
                    AppState.data.vwap[AppState.data.vwap.length - 1] = uVwap;
                    AppState.series.vwap.update(uVwap);
                }
                if (safeFast !== undefined) {
                    const uFast = { time: last.time, value: safeFast };
                    AppState.data.fastEma[AppState.data.fastEma.length - 1] = uFast;
                    AppState.series.fastEma.update(uFast);
                }
                if (safeSlow !== undefined) {
                    const uSlow = { time: last.time, value: safeSlow };
                    AppState.data.slowEma[AppState.data.slowEma.length - 1] = uSlow;
                    AppState.series.slowEma.update(uSlow);
                }

                if (upd.close !== +last.close || upd.high !== +last.high || upd.low !== +last.low) {
                    try {
                        AppState.series.candle.update(upd);
                    } catch(e) {}
                }
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
