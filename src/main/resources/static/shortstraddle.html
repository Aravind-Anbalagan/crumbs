<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nifty — CE/PE Chart</title>
    <link rel="stylesheet" href="/css/straddle.css" />
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <script>
        // Authentication check - must be at the top to prevent UI flicker
        if (!sessionStorage.getItem('isLoggedIn')) {
            window.location.href = '/';
        }
    </script>
    <style>
        /* Force true fullscreen layout */
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
            background: #071421; /* Dark theme default */
        }
        .container {
            max-width: 100% !important; width: 100vw; height: 100vh;
            padding: 0 !important; margin: 0 !important;
            display: flex; flex-direction: column;
        }
        .card {
            flex-grow: 1; display: flex; flex-direction: column;
            border-radius: 0 !important; border: none !important; margin: 0 !important;
            height: 100%;
        }
        .header { padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-wrap: wrap; }
        
        /* Loading Overlay Styling */
        #loading-overlay {
            display: none; position: absolute; inset: 0; z-index: 100;
            background: rgba(7, 20, 33, 0.7); backdrop-filter: blur(3px);
            align-items: center; justify-content: center; flex-direction: column;
            color: #60a5fa; font-weight: 600; font-size: 1.1rem;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(96, 165, 250, 0.3);
            border-radius: 50%; border-top-color: #60a5fa;
            animation: spin 1s ease-in-out infinite; margin-bottom: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Bottom Legend Styling */
        #bottom-legend {
            padding: 10px 15px; display: flex; flex-wrap: wrap; gap: 15px 25px;
            border-top: 1px solid rgba(255,255,255,0.05); font-size: 13px; font-weight: 600;
            /* Default text color for dark mode (will be overridden by JS for light mode) */
            color: #ffffff; 
            background: rgba(0,0,0,0.2); justify-content: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card" id="chart-card">
        <div class="header">
                        <div class="toggle-container" id="theme-toggle">
                <span class="toggle-label">Dark</span>
                <div class="toggle-switch active" id="theme-switch"></div>
            </div>

                        <div class="toggle-container" id="auto-update-toggle">
                <span class="toggle-label" id="auto-update-label">Auto: ON</span>
                <div class="toggle-switch active" id="auto-update-switch"></div>
            </div>

                        <div class="checkout-dropdown">
                <button class="checkout-btn" id="checkout-btn">⋮ Lines</button>
                <div class="checkout-menu" id="checkout-menu">
                    <div class="checkout-item">
                        <input type="checkbox" id="all-lines-check">
                        <span class="swatch" style="background:transparent;border:1px solid rgba(148,163,184,0.4)"></span> All
                    </div>
                    <hr style="margin:6px 0;border:none;border-top:1px solid rgba(255,255,255,0.03)"/>
                    <div class="checkout-item"><input type="checkbox" id="ce-check" checked> <span class="swatch" style="background:#22c55e"></span> CE</div>
                    <div class="checkout-item"><input type="checkbox" id="pe-check" checked> <span class="swatch" style="background:#ef4444"></span> PE</div>
                    <div class="checkout-item"><input type="checkbox" id="combined-premium-check" checked> <span class="swatch" style="background:#3b82f6"></span> Combined Premium</div>
                    <hr style="margin:6px 0;border:none;border-top:1px solid rgba(255,255,255,0.03)"/>
                    <div class="checkout-item"><input type="checkbox" id="ce-vwap-check" checked> <span class="swatch" style="background:#a78bfa"></span> CE VWAP</div>
                    <div class="checkout-item"><input type="checkbox" id="pe-vwap-check" checked> <span class="swatch" style="background:#fb923c"></span> PE VWAP</div>
                    <div class="checkout-item"><input type="checkbox" id="combined-vwap-check" checked> <span class="swatch" style="background:#06b6d4"></span> Combined VWAP</div>
                    <hr style="margin:8px 0;border:none;border-top:1px solid rgba(255,255,255,0.03)"/>
                                        <div class="checkout-item"><input type="checkbox" id="combined-prev-low-check" checked> <span class="swatch" style="background:#c084fc"></span> Combined Prev Low</div>
                    <hr style="margin:8px 0;border:none;border-top:1px solid rgba(255,255,255,0.03)"/>
                    <div class="checkout-item"><input type="checkbox" id="ce-intrinsic-check"> <span class="swatch" style="background:#10b981"></span> CE Intrinsic</div>
                    <div class="checkout-item"><input type="checkbox" id="ce-extrinsic-check"> <span class="swatch" style="background:#34d399"></span> CE Extrinsic</div>
                    <div class="checkout-item"><input type="checkbox" id="pe-intrinsic-check"> <span class="swatch" style="background:#f43f5e"></span> PE Intrinsic</div>
                    <div class="checkout-item"><input type="checkbox" id="pe-extrinsic-check"> <span class="swatch" style="background:#fb7185"></span> PE Extrinsic</div>
                    <button class="checkout-ok-btn" id="checkout-ok-btn">OK</button>
                </div>
            </div>

                        <label style="color:#94a3b8">Name</label><select id="name-select"></select>
            <label style="color:#94a3b8">Expiry</label><select id="expiry-select"></select>
            <label style="color:#94a3b8">CE</label><select id="ce-strike-select"></select>
            <label style="color:#94a3b8">PE</label><select id="pe-strike-select"></select>
            <div style="display:flex; align-items:center; gap:4px; margin-left:8px;">
                <input type="checkbox" id="sync-strike-check" style="cursor:pointer">
                <label for="sync-strike-check" style="color:#94a3b8; font-size:12px; cursor:pointer">Strike Sync</label>
            </div>
            
                        <button id="btn-reset" style="padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.03);background:transparent;color:#60a5fa;cursor:pointer">Reset</button>

                        <div class="last-update" style="margin-left: auto;">
                <span id="last-update-time">--:--:--</span>
                <span class="status-indicator live" id="status-indicator"></span>
            </div>
        </div>

                <div id="chart-wrapper" style="position: relative; flex-grow: 1; display: flex; flex-direction: column; min-height: 0;">
            <div id="loading-overlay"><div class="spinner"></div>Loading Data...</div>
            <div id="chart" style="flex-grow: 1;"></div>
        </div>

                <div id="bottom-legend">
            <div><span style="color:#94a3b8">Diff:</span> <span id="val-diff" style="color:#f472b6">-</span></div>
            <div><span style="color:#22c55e">CE:</span> <span id="val-ce">-</span></div>
            <div><span style="color:#ef4444">PE:</span> <span id="val-pe">-</span></div>
            <div><span style="color:#3b82f6">Comb:</span> <span id="val-comb">-</span></div>
            <div><span style="color:#a78bfa">CE VWAP:</span> <span id="val-ce-vwap">-</span></div>
            <div><span style="color:#fb923c">PE VWAP:</span> <span id="val-pe-vwap">-</span></div>
            <div><span style="color:#06b6d4">Comb VWAP:</span> <span id="val-comb-vwap">-</span></div>
                        <div><span style="color:#c084fc">Comb Prev Low:</span> <span id="val-comb-low">-</span></div>
            <div><span style="color:#10b981">CE Int:</span> <span id="val-ce-intrinsic">-</span></div>
            <div><span style="color:#34d399">CE Ext:</span> <span id="val-ce-extrinsic">-</span></div>
            <div><span style="color:#f43f5e">PE Int:</span> <span id="val-pe-intrinsic">-</span></div>
            <div><span style="color:#fb7185">PE Ext:</span> <span id="val-pe-extrinsic">-</span></div>
        </div>
    </div>
</div>

<script src="/js/straddle.js"></script>
</body>
</html>
