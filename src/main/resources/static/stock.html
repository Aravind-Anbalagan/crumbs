<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Indicators Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    :root {
      /* Modern color palette - cool blues & clean greys */
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --primary-light: #0fc5ff;
      --secondary: #64748b;
      --accent: #06b6d4;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      
      /* Backgrounds */
      --bg-0: #fafbff;
      --bg-1: #ffffff;
      --bg-2: #f8fafc;
      --bg-3: #f1f5f9;
      --bg-glass: rgba(255, 255, 255, 0.85);
      --bg-glass-dark: rgba(15, 23, 42, 0.9);
      
      /* Text */
      --text-1: #0f172a;
      --text-2: #334155;
      --text-3: #64748b;
      
      /* Borders & Shadows */
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 10px 15px -3px rgb(0 0 0 / 0.1);
      --shadow-glass: 0 8px 32px 0 rgb(31 38 135 / 0.15);
      
      /* Gradients */
      --gradient-primary: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      --gradient-accent: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
    }
    
    [data-theme="dark"] {
      --bg-0: #0f172a;
      --bg-1: #1e293b;
      --bg-2: #334155;
      --bg-3: #475569;
      --bg-glass: rgba(30, 41, 59, 0.95);
      --text-1: #f8fafc;
      --text-2: #e2e8f0;
      --text-3: #cbd5e1;
      --border: #334155;
      --border-hover: #475569;
      --shadow-glass: 0 8px 32px 0 rgb(0 0 0 / 0.5);
    }
    
    * {
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-0);
      color: var(--text-1);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      line-height: 1.6;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 2rem;
      min-height: 100vh;
    }
    
    /* Header Toolbar */
    .header {
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 2rem;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 1rem;
      z-index: 100;
    }
    
    .header-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2rem;
      align-items: start;
    }
    
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }
    
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .control-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-2);
      letter-spacing: 0.025em;
      text-transform: uppercase;
    }
    
    /* Modern Select & Input */
    .select, .input {
      appearance: none;
      background: var(--bg-1);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 1rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-1);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 52px;
    }
    
    .select:focus, .input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgb(14 165 233 / 0.15);
      transform: translateY(-1px);
    }
    
    /* Segmented Controls */
    .segmented-control {
      display: flex;
      background: var(--bg-2);
      border-radius: 16px;
      padding: 4px;
      border: 2px solid var(--border);
      overflow: hidden;
    }
    
    .segmented-option {
      flex: 1;
      background: transparent;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text-2);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .segmented-option:checked,
    .segmented-option.active {
      background: var(--gradient-primary);
      color: white;
      box-shadow: var(--shadow-sm);
    }
    
    /* Buttons */
    .btn {
      background: var(--gradient-primary);
      color: white;
      border: none;
      padding: 0.875rem 1.5rem;
      border-radius: 16px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      position: relative;
      overflow: hidden;
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }
    
    .btn:hover::before {
      left: 100%;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    
    .btn-secondary {
      background: var(--bg-2);
      color: var(--text-1);
      box-shadow: var(--shadow-sm);
    }
    
    .btn-secondary:hover {
      background: var(--bg-1);
      color: var(--text-1);
    }
    
    .btn-ghost {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    
    /* Dropdown Menu */
    .dropdown {
      position: relative;
    }
    
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      min-width: 280px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.25rem;
      margin-top: 0.75rem;
      box-shadow: var(--shadow-xl);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      max-height: 400px;
      overflow-y: auto;
    }
    
    .dropdown.open .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    
    .dropdown-item:hover {
      background: var(--bg-2);
      transform: translateX(4px);
    }
    
    .dropdown-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
      flex-shrink: 0;
    }
    
    /* Main Table */
    .table-container {
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      margin-bottom: 2rem;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.925rem;
      font-feature-settings: 'tnum' 1, 'lnum' 1;
    }
    
    th {
      background: var(--gradient-primary);
      color: white;
      padding: 1.25rem 1.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.8rem;
      position: sticky;
      top: 0;
      z-index: 10;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }
    
    th:hover {
      filter: brightness(1.1);
    }
    
    th.sort-asc::after {
      content: ' ↑';
      margin-left: 0.25rem;
    }
    
    th.sort-desc::after {
      content: ' ↓';
      margin-left: 0.25rem;
    }
    
    td {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      transition: all 0.2s ease;
    }
    
    tr:hover td {
      background: var(--bg-2);
      transform: scale(1.002);
    }
    
    tr:nth-child(even) td {
      background: var(--bg-1);
    }
    
    /* Column specific backgrounds */
    .col-price { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%) !important; }
    .col-dailysr { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%) !important; }
    .col-sr { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%) !important; }
    .col-fibo { background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%) !important; }
    .col-ma { background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%) !important; }
    .col-ai { background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%) !important; }
    .col-combine { background: linear-gradient(135deg, #fefce8 0%, #fef9c3 100%) !important; }
    
    th.col-price, th.col-dailysr, th.col-sr, th.col-fibo, th.col-ma, th.col-ai, th.col-combine {
      background: var(--gradient-primary) !important;
      color: white !important;
    }
    
    /* Chart Link */
    .chart-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--gradient-primary);
      color: white !important;
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    
    .chart-link:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: var(--shadow-lg);
    }
    
    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding: 2rem;
    }
    
    .page-btn {
      padding: 0.75rem 1rem;
      border: 2px solid var(--border);
      background: var(--bg-1);
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      min-width: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .page-btn:hover:not(.active),
    .page-btn:focus {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
      transform: translateY(-1px);
    }
    
    .page-btn.active {
      background: var(--gradient-primary);
      color: white;
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }
    
    /* Theme Toggle */
    .theme-toggle {
      width: 52px;
      height: 52px;
      border: none;
      background: var(--bg-2);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-sm);
    }
    
    .theme-toggle:hover {
      background: var(--primary);
      transform: rotate(180deg) scale(1.1);
    }
    
    /* Loader */
    .loader {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      color: white;
    }
    
    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Error Message */
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--danger);
      padding: 1.5rem;
      border-radius: 16px;
      margin-bottom: 2rem;
      font-weight: 500;
      display: none;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }
      
      .header {
        padding: 1.5rem;
        border-radius: 20px;
      }
      
      .header-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      
      .controls-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      
      .table-container {
        border-radius: 20px;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }
      
      table {
        min-width: 800px;
      }
      
      th, td {
        padding: 1rem 0.75rem;
        font-size: 0.9rem;
      }
    }
    
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    
    ::-webkit-scrollbar-track {
      background: var(--bg-2);
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--text-3);
      border-radius: 4px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: var(--secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-grid">
        <div class="controls-grid">
          <div class="control-group">
            <label class="control-label">Market</label>
            <div class="segmented-control">
              <input type="radio" id="nifty" name="market" value="ALL" class="segmented-option" checked>
              <label for="nifty">Nifty 500</label>
              <input type="radio" id="options" name="market" value="OPTIONS" class="segmented-option">
              <label for="options">Options</label>
            </div>
          </div>
          
          <div class="control-group">
            <label class="control-label" for="timeframe">Timeframe</label>
            <select id="timeframe" class="select">
              <option value="DAILY">Daily</option>
              <option value="WEEKLY">Weekly</option>
              <option value="COMBINE">Combine</option>
              <option value="INTRADAY" selected>Intraday</option>
            </select>
          </div>
          
          <div class="control-group">
            <label class="control-label" id="secondaryFilterLabel" for="secondaryFilter">Trend</label>
            <select id="secondaryFilter" class="select">
              <option value="ALL">All</option>
              <option value="UP">Up</option>
              <option value="DOWN">Down</option>
            </select>
          </div>
          
          <div class="control-group">
            <label class="control-label" for="search">Search</label>
            <input type="text" id="search" class="input" placeholder="Search stocks..." autocomplete="off">
          </div>
          
          <div class="control-group">
            <a href="#" class="btn" onclick="resetTable();">🧹 Reset</a>
          </div>
          
          <div class="control-group dropdown" id="columnDropdown">
            <a href="#" class="btn btn-secondary" onclick="toggleColumnDropdown();">Columns</a>
            <div class="dropdown-menu" id="columnTogglePanel"></div>
          </div>
        </div>
        
        <div style="display: flex; gap: 1rem; align-items: center;">
          <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
        </div>
      </div>
    </div>
    
    <div id="errorMessage" class="error" role="alert"></div>
    
    <div class="table-container">
      <table id="stocksTable">
        <thead>
          <tr id="tableHead"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    
    <div id="pagination" class="pagination"></div>
  </div>
  
  <div id="loader" class="loader">
    <div class="spinner"></div>
    <div style="font-size: 1.125rem; font-weight: 500;">Loading market data...</div>
  </div>

  <script>
    // All existing JavaScript functionality preserved exactly as provided
    let tableData = [], filteredData = [], visibleKeys = [];
    let sortState = { column: null, order: null };
    let currentPage = 1, currentFontSize = 14;
    const rowsPerPage = 10;
    let columnVisibility = {};

    // Update radio button listeners for new segmented control
    function updateRadioListeners() {
      document.querySelectorAll('input[name="market"]').forEach(radio => {
        radio.addEventListener('change', () => {
          currentPage = 1;
          loadTable();
        });
      });
    }

    // Rest of your JavaScript remains exactly the same...
    // [All existing functions: updateSecondaryFilter, loadTable, generateColumnToggles, etc.]
    
    function updateSecondaryFilter() {
      const tf = document.getElementById("timeframe").value;
      const label = document.getElementById("secondaryFilterLabel");
      const select = document.getElementById("secondaryFilter");
      select.innerHTML = "";
      
      if (tf === "INTRADAY") {
        label.textContent = "Trend:";
        ["ALL", "UP", "DOWN"].forEach((val) => {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = val === "ALL" ? "All" : val;
          select.appendChild(opt);
        });
      } else {
        label.textContent = "Heikin/Psar:";
        ["ALL", "FIRST BUY", "FIRST SELL"].forEach((val) => {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = val.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
          select.appendChild(opt);
        });
      }
    }

    async function loadTable() {
      const timeframe = document.getElementById("timeframe").value;
      const filter = document.getElementById("secondaryFilter").value;
      const selected = document.querySelector('input[name="market"]:checked').value;
      const optionFlag = selected === "OPTIONS";
      
      const loader = document.getElementById("loader");
      const errorDiv = document.getElementById("errorMessage");
      
      errorDiv.style.display = "none";
      loader.style.display = "flex";
      
      try {
        let url;
        if (timeframe === "INTRADAY") {
          url = `/api/indicators/flagged?flag=${timeframe}&trendFilter=${encodeURIComponent(filter)}&optionFlag=${optionFlag}`;
        } else {
          url = `/api/indicators/flagged?flag=${timeframe}&heikinPsarFilter=${encodeURIComponent(filter)}&optionFlag=${optionFlag}`;
        }
        
        const res = await fetch(url);
        if (!res.ok) throw new Error(await res.text());
        
        const data = await res.json();
        if (!data.length) throw new Error("No stock data found for the selected filters.");
        
        visibleKeys = Object.entries(data[0].headers)
          .filter(([_, val]) => val[1])
          .map(([key]) => key);

        visibleKeys.forEach((key) => {
          if (/reason/i.test(key)) {
            columnVisibility[key] = false;
          } else {
            if (!(key in columnVisibility)) columnVisibility[key] = true;
          }
        });
        
        if (!visibleKeys.includes("chart")) {
          visibleKeys.push("chart");
          columnVisibility["chart"] = false;
        }
        
        tableData = data.map((row) => {
          const base = Object.fromEntries(
            visibleKeys.map((k) => [k, row.headers[k] ? row.headers[k][0] : ""])
          );
          if ("exchange" in row.headers) base["exchange"] = row.headers["exchange"][0];
          if ("symbol" in row.headers) base["symbol"] = row.headers["symbol"][0];
          return base;
        });
        
        filteredData = [...tableData];
        currentPage = 1;
        generateColumnToggles();
        renderTable();
      } catch (err) {
        showError(err.message || "Could not load data.");
        tableData = filteredData = [];
        renderTable();
      } finally {
        loader.style.display = "none";
      }
    }

    function generateColumnToggles() {
      const panel = document.getElementById("columnTogglePanel");
      panel.innerHTML = "";
      
      visibleKeys.forEach((key) => {
        if (!(key in columnVisibility)) columnVisibility[key] = true;
        
        const div = document.createElement("div");
        div.className = "dropdown-item";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = columnVisibility[key];
        checkbox.onchange = () => {
          columnVisibility[key] = checkbox.checked;
          renderTable();
        };
        
        div.appendChild(checkbox);
        div.appendChild(document.createTextNode(formatHeader(key)));
        panel.appendChild(div);
      });
    }

    function getColumnClass(key) {
      const lowerKey = key.toLowerCase();
      if (lowerKey === "name") return "col-name";
      if (lowerKey === "price") return "col-price";
      if (["daily s/r", "daily_sr", "dailysr"].includes(lowerKey)) return "col-dailysr";
      if (lowerKey.includes("sr")) return "col-sr";
      if (lowerKey.includes("fibo")) return "col-fibo";
      if (lowerKey.includes("ma") || lowerKey.includes("rsi")) return "col-ma";
      if (lowerKey.includes("ai")) return "col-ai";
      if (lowerKey.includes("combine")) return "col-combine";
      return "";
    }

    function filterTable() {
      const keyword = document.getElementById("search").value.toLowerCase();
      filteredData = tableData.filter((row) =>
        visibleKeys.some((k) => (row[k] + "").toLowerCase().includes(keyword))
      );
      currentPage = 1;
      renderTable();
    }

    function resetTable() {
      document.getElementById("timeframe").value = "DAILY";
      document.getElementById("secondaryFilter").value = "ALL";
      document.getElementById("search").value = "";
      document.getElementById("errorMessage").style.display = "none";
      document.querySelector('input[name="market"][value="ALL"]').checked = true;
      currentPage = 1;
      updateSecondaryFilter();
      loadTable();
    }

    function showError(msg) {
      const errDiv = document.getElementById("errorMessage");
      errDiv.textContent = msg;
      errDiv.style.display = "block";
    }

    function formatHeader(key) {
      return key.replace(/[_\s]+/g, " ").replace(/\b\w/g, (l) => l.toUpperCase());
    }

    function toggleColumnDropdown() {
      document.getElementById("columnDropdown").classList.toggle("open");
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    }

    function renderTable() {
      const head = document.getElementById("tableHead");
      const body = document.getElementById("tableBody");
      head.innerHTML = body.innerHTML = "";
      
      visibleKeys.forEach((key) => {
        if (!columnVisibility[key]) return;
        
        const th = document.createElement("th");
        const headerText = document.createElement("div");
        headerText.textContent = formatHeader(key);
        headerText.onclick = () => sortTableByColumn(key);
        
        if (sortState.column === key) {
          th.classList.add(sortState.order === "asc" ? "sort-asc" : "sort-desc");
        }
        
        const className = getColumnClass(key);
        if (className) th.classList.add(className);
        
        th.appendChild(headerText);
        head.appendChild(th);
      });
      
      if (!filteredData.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = visibleKeys.filter((k) => columnVisibility[k]).length || 1;
        td.textContent = "No records found";
        td.style.textAlign = "center";
        td.style.padding = "4rem 2rem";
        td.style.color = "var(--text-3)";
        td.style.fontStyle = "italic";
        tr.appendChild(td);
        body.appendChild(tr);
        renderPagination();
        return;
      }
      
      const start = (currentPage - 1) * rowsPerPage;
      const end = currentPage * rowsPerPage;
      
      filteredData.slice(start, end).forEach((row) => {
        const tr = document.createElement("tr");
        
        visibleKeys.forEach((key) => {
          if (!columnVisibility[key]) return;
          
          const td = document.createElement("td");
          td.setAttribute("data-label", formatHeader(key));
          
          const className = getColumnClass(key);
          if (className) td.classList.add(className);
          
          if (key === "chart") {
            const stockName = row["NAME"] || "";
            const exchange = row["exchange"] || "";
            const symbol = row["symbol"] || "";
            
            const link = document.createElement("a");
            link.href = `/chart.html?timeFrame=ONE_DAY&name=${encodeURIComponent(stockName)}&exchange=${encodeURIComponent(exchange)}&symbol=${encodeURIComponent(symbol)}`;
            link.className = "chart-link";
            link.textContent = "View Chart";
            
            td.appendChild(link);
          } else {
            td.textContent = row[key];
          }
          
          tr.appendChild(td);
        });
        
        body.appendChild(tr);
      });
      
      renderPagination();
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredData.length / rowsPerPage);
      const container = document.getElementById("pagination");
      container.innerHTML = "";
      
      if (totalPages <= 1) return;
      
      const createLink = (label, page, active = false) => {
        const btn = document.createElement("button");
        btn.textContent = label;
        btn.className = `page-btn ${active ? "active" : ""}`;
        btn.onclick = () => {
          currentPage = page;
          renderTable();
          document.querySelector('.table-container').scrollIntoView({ 
            behavior: 'smooth', 
            block: 'start' 
          });
        };
        return btn;
      };
      
      if (currentPage > 1) {
        container.append(createLink("« First", 1), createLink("‹ Prev", currentPage - 1));
      }
      
      let start = Math.max(1, currentPage - 2);
      let end = Math.min(totalPages, currentPage + 2);
      
      if (currentPage <= 3) end = Math.min(5, totalPages);
      if (currentPage >= totalPages - 2) start = Math.max(totalPages - 4, 1);
      
      if (start > 1) {
        container.append(createLink("1", 1));
        if (start > 2) {
          const span = document.createElement("span");
          span.textContent = "...";
          span.style.color = "var(--text-3)";
          span.style.fontWeight = "500";
          container.appendChild(span);
        }
      }
      
      for (let i = start; i <= end; i++) {
        container.append(createLink(i.toString(), i, i === currentPage));
      }
      
      if (end < totalPages) {
        if (end < totalPages - 1) {
          const span = document.createElement("span");
          span.textContent = "...";
          span.style.color = "var(--text-3)";
          span.style.fontWeight = "500";
          container.appendChild(span);
        }
        container.append(createLink(totalPages.toString(), totalPages));
      }
      
      if (currentPage < totalPages) {
        container.append(createLink("Next ›", currentPage + 1), createLink("Last »", totalPages));
      }
    }

    function sortTableByColumn(col) {
      const isAsc = sortState.column === col && sortState.order === "asc";
      sortState = { column: col, order: isAsc ? "desc" : "asc" };
      
      filteredData.sort((a, b) => {
        let valA = a[col]?.toString().trim() || "";
        let valB = b[col]?.toString().trim() || "";
        
        const numA = parseFloat(valA.replace(/[^0-9.\-]/g, ""));
        const numB = parseFloat(valB.replace(/[^0-9.\-]/g, ""));
        
        return !isNaN(numA) && !isNaN(numB)
          ? sortState.order === "asc" ? numA - numB : numB - numA
          : sortState.order === "asc" ? valA.localeCompare(valB) : valB.localeCompare(valA);
      });
      
      currentPage = 1;
      renderTable();
    }

    // Event Listeners
    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      
      updateRadioListeners();
      updateSecondaryFilter();
      loadTable();
      
      // Search input
      document.getElementById("search").addEventListener("input", filterTable);
      document.getElementById("timeframe").addEventListener("change", () => {
        updateSecondaryFilter();
        loadTable();
      });
      document.getElementById("secondaryFilter").addEventListener("change", loadTable);
      
      // Close dropdown on outside click
      document.addEventListener('click', (e) => {
        const dropdown = document.getElementById("columnDropdown");
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove("open");
        }
      });
      
      // Chart link handler
      document.addEventListener("click", function (event) {
        if (event.target.classList.contains("chart-link")) {
          event.preventDefault();
          const url = event.target.href;
          if (window.parent && window.parent !== window) {
            window.parent.document.getElementById("contentFrame").src = url;
          } else {
            window.location.href = url;
          }
        }
      });
    });
  </script>
</body>
</html>
