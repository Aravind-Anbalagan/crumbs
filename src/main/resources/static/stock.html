<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Indicators Table</title>
<script>
    (function () {
        // If this is the top window and not authenticated, go to login
        const isTop = window.self === window.top;
        const isLoggedIn = sessionStorage.getItem('isLoggedIn') === 'true';

        if (isTop && !isLoggedIn) {
            window.location.href = '/';
        }
        // If inside iframe and not logged in, just show nothing or a message, but don't redirect parent.
    })();
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  
  :root {
    /* Base colors */
    --primary-color: #000000;       /* Black */
    --primary-hover: #222222;       /* Dark grey */
    --success-color: #4b4b4b;       /* Medium grey as success */
    --warning-color: #7a7a7a;       /* Grey for warnings */
    --danger-color: #999999;        /* Light grey for danger */
    --info-color: #6e6e6e;          /* Grey for info */
    /* Background colors */
    --bg-primary: #ffffff;          /* White */
    --bg-secondary: #f0f0f0;        /* Very light grey */
    --bg-tertiary: #dcdcdc;         /* Light grey */
    /* Text colors */
    --text-primary: #000000;        /* Black */
    --text-secondary: #4d4d4d;      /* Dark grey */
    --text-muted: #7a7a7a;          /* Medium grey */
    /* Borders and shadows */
    --border-primary: #d0d0d0;      /* Light grey */
    --border-secondary: #bbbbbb;    /* Slightly darker grey */
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    /* Column backgrounds with grey shades (linear gradients subtly different) */
    --bg-col-name: linear-gradient(135deg, #e0e0e0 0%, #cfcfcf 100%);
    --bg-col-price: linear-gradient(135deg, #f9f9f9 0%, #e5e5e5 100%);
    --bg-col-dailysr: linear-gradient(135deg, #d9d9d9 0%, #c4c4c4 100%);
    --bg-col-sr: linear-gradient(135deg, #cccccc 0%, #b6b6b6 100%);
    --bg-col-fibo: linear-gradient(135deg, #e9e9e9 0%, #d9d9d9 100%);
    --bg-col-ma: linear-gradient(135deg, #f6f6f6 0%, #e0e0e0 100%);
    --bg-col-ai: linear-gradient(135deg, #d0d0d0 0%, #bfbfbf 100%);
    --bg-col-combine: linear-gradient(135deg, #ededed 0%, #dcdcdc 100%);
  }
  body.dark-mode {
    /* Backgrounds */
    --bg-primary: #111111;          /* Almost black */
    --bg-secondary: #222222;        /* Dark grey */
    --bg-tertiary: #333333;         /* Medium dark grey */
    /* Text */
    --text-primary: #f0f0f0;        /* Light grey / almost white */
    --text-secondary: #cccccc;
    --text-muted: #999999;
    /* Borders */
    --border-primary: #444444;
    --border-secondary: #555555;
    /* Column backgrounds also in grey scale */
    --bg-col-name: linear-gradient(135deg, #2a2a2a 0%, #1f1f1f 100%);
    --bg-col-price: linear-gradient(135deg, #1f1f1f 0%, #141414 100%);
    --bg-col-dailysr: linear-gradient(135deg, #383838 0%, #2e2e2e 100%);
    --bg-col-sr: linear-gradient(135deg, #444444 0%, #3a3a3a 100%);
    --bg-col-fibo: linear-gradient(135deg, #262626 0%, #1c1c1c 100%);
    --bg-col-ma: linear-gradient(135deg, #383838 0%, #2e2e2e 100%);
    --bg-col-ai: linear-gradient(135deg, #5a5a5a 0%, #4a4a4a 100%);
    --bg-col-combine: linear-gradient(135deg, #222222 0%, #111111 100%);
  }
  
  * {
    box-sizing: border-box;
  }
  
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 16px;
    margin: 0;
    background: var(--bg-secondary);
    color: var(--text-primary);
    line-height: 1.5;
    transition: all 0.3s ease;
    font-size: 14px;
  }
  
  .toolbar {
    background: var(--bg-primary);
    border: 1px solid var(--border-primary);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    transition: all 0.3s ease;
    max-width: 100%;
  }
  
  .toolbar:hover {
    box-shadow: var(--shadow-md);
  }
  
  .toolbar-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    width: 100%;
  }
  
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    flex: 1;
  }
  
  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: fit-content;
  }
  
  .control-group label {
    font-weight: 500;
    color: var(--text-secondary);
    font-size: 13px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  
  .radio-group {
    display: flex;
    gap: 8px;
    background: var(--bg-tertiary);
    padding: 4px;
    border-radius: 12px;
    border: 1px solid var(--border-primary);
    flex-wrap: nowrap;
  }
  
  .radio-group label {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-weight: 500;
    font-size: 12px;
    justify-content: center;
    white-space: nowrap;
  }
  
  .radio-group input[type="radio"] {
    margin: 0;
    accent-color: var(--primary-color);
  }
  
  .radio-group label:hover {
    background: var(--bg-primary);
  }
  
  .btn {
    padding: 8px 12px;
    border: 1px solid var(--border-primary);
    background: var(--bg-primary);
    border-radius: 10px;
    cursor: pointer;
    font-weight: 500;
    font-size: 13px;
    color: var(--text-primary);
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  
  .btn:hover {
    background: var(--bg-tertiary);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  
  .btn-primary {
    background: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
  }
  
  .btn-primary:hover {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
  }
  
  input[type="text"],
  select {
    padding: 8px 10px;
    min-width: 130px;
    border-radius: 10px;
    border: 1px solid var(--border-primary);
    background: var(--bg-primary);
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  
  input[type="text"]:focus,
  select:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgb(37 99 235 / 0.1);
  }
  
  .toolbar-actions {
    margin-left: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: flex-end;
    flex: 0 0 auto;
  }
  
  .theme-toggle {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border-primary);
    padding: 8px 10px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 42px;
  }
  
  .theme-toggle:hover {
    background: var(--primary-color);
    color: white;
    transform: scale(1.05);
  }
  
  .table-container {
    width: 100%;
    max-width: 100vw;
    padding: 0 8px;
    overflow-x: auto;
    background: var(--bg-primary);
    border: 1px solid var(--border-primary);
    border-radius: 16px;
    box-shadow: var(--shadow-sm);
    transition: all 0.3s ease;
  }
  
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: auto;
  }
  
  th,
  td {
    border: none;
    border-bottom: 1px solid var(--border-primary);
    padding: 8px 12px;
    text-align: left;
    font-size: 14px;
    word-break: break-word;
    white-space: normal;
    transition: all 0.2s ease;
  }
  
  thead th {
    position: sticky;
    top: 0;
    background: var(--bg-tertiary);
    z-index: 2;
    vertical-align: bottom;
    font-weight: 600;
    color: var(--text-primary);
    border-bottom: 2px solid var(--border-secondary);
  }
  
  th {
    cursor: pointer;
    position: relative;
    padding-right: 32px;
    user-select: none;
  }
  
  th:hover {
    background: var(--bg-secondary);
  }
  
  th.sort-asc::after {
    content: " ↑";
    color: var(--primary-color);
    font-weight: bold;
  }
  
  th.sort-desc::after {
    content: " ↓";
    color: var(--primary-color);
    font-weight: bold;
  }
  
  tbody tr {
    transition: all 0.2s ease;
  }
  
  tbody tr:hover {
    background: var(--bg-tertiary);
    transform: scale(1.001);
  }
  
  tbody tr:nth-child(even) {
    background: var(--bg-secondary);
  }
  
  tbody tr:nth-child(even):hover {
    background: var(--bg-tertiary);
  }
  
  td.col-name, th.col-name {
    max-width: 180px;
    white-space: normal;
    overflow-wrap: break-word;
  }
  
  th.col-price,
  td.col-price {
    background: var(--bg-col-price) !important;
    color: var(--text-primary);
    font-weight: 600;
  }
  
  th.col-dailysr,
  td.col-dailysr {
    background: var(--bg-col-dailysr) !important;
    color: var(--text-primary);
    font-weight: 600;
  }
  
  th.sr,
  td.sr {
    background: var(--bg-col-sr) !important;
    color: var(--text-primary);
    font-weight: 600;
  }
  
  th.fibo,
  td.fibo {
    background: var(--bg-col-fibo) !important;
    color: var(--text-primary);
    font-weight: 600;
  }
  
  th.ma,
  td.ma {
    background: var(--bg-col-ma) !important;
    color: var(--text-primary);
    font-weight: 600;
  }
  
  th.ai,
  td.ai {
    background: var(--bg-col-ai) !important;
    color: var(--text-primary);
    font-weight: 600;
  }
  
  th.combine,
  td.combine {
    background: var(--bg-col-combine) !important;
    color: var(--text-primary);
    font-weight: 600;
  }
  
  #pagination {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
  }
  
  .page-link {
    cursor: pointer;
    padding: 8px 14px;
    border: 1px solid var(--border-primary);
    background: var(--bg-primary);
    border-radius: 10px;
    user-select: none;
    font-weight: 500;
    color: var(--text-primary);
    transition: all 0.2s ease;
    min-width: 44px;
    text-align: center;
    font-size: 13px;
  }
  
  .page-link:hover {
    background: var(--bg-tertiary);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  
  .page-link.active {
    background: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
    box-shadow: var(--shadow-sm);
  }
  
  #loader {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(8px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-size: 16px;
    color: white;
  }
  
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid rgba(255, 255, 255, 0.2);
    border-top: 4px solid var(--primary-color);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
  }
  
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  
  #errorMessage {
    color: var(--danger-color);
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2);
    padding: 12px 14px;
    margin-bottom: 16px;
    display: none;
    border-radius: 12px;
    font-weight: 500;
    box-shadow: var(--shadow-sm);
  }
  
  h1, h2 {
    margin: 8px 0;
    font-weight: 700;
    color: var(--text-primary);
  }

  /* Mobile / narrow windows: stack toolbar better */
  @media (max-width: 900px) {
    .toolbar-row {
      flex-direction: column;
      align-items: stretch;
      gap: 16px;
    }
    .controls {
      flex-direction: column;
      align-items: stretch;
      gap: 16px;
    }
    .control-group {
      flex-direction: row;
      justify-content: space-between;
      max-width: 100%;
      min-width: 0;
    }
    .control-group label {
      white-space: nowrap;
      flex-shrink: 0;
    }
    .toolbar-actions {
      justify-content: flex-start;
      margin-left: 0;
      gap: 16px;
    }
  }

  /* Existing table mobile behaviour */
  @media (max-width: 700px) {
    .toolbar {
      padding: 12px;
    }

    .table-container {
      padding: 0;
    }
    
    table, thead, tbody, th, td, tr {
      display: block;
      width: 100%;
    }
    
    thead {
      display: none;
    }
    
    tr {
      margin-bottom: 16px;
      border: 1px solid var(--border-primary);
      border-radius: 12px;
      padding: 16px;
      background: var(--bg-primary);
      box-shadow: var(--shadow-sm);
      min-width: 0;
    }
    
    td {
      padding-left: 50%;
      position: relative;
      border: none;
      border-bottom: 1px solid var(--border-primary);
      padding-top: 12px;
      padding-bottom: 12px;
      font-size: 15px;
      white-space: normal;
      word-break: break-word;
      min-width: 0;
    }
    
    td:last-child {
      border-bottom: none;
    }
    
    td::before {
      position: absolute;
      top: 12px;
      left: 16px;
      width: 45%;
      font-weight: 600;
      white-space: nowrap;
      content: attr(data-label);
      color: var(--text-secondary);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      text-align: left;
      pointer-events: none;
      line-height: 1.3;
    }

    .btn {
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
      justify-content: flex-start;
    }
    #resultBtn {
      flex: 0 0 auto !important;
      white-space: nowrap;
    }
    
    #pagination {
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .page-link {
      padding: 10px 0;
      width: 44px;
      font-size: 14px;
    }
  }
  
  /* Scrollbar Styling */
  .table-container::-webkit-scrollbar {
    height: 8px;
    width: 8px;
  }
  
  .table-container::-webkit-scrollbar-track {
    background: var(--bg-tertiary);
    border-radius: 4px;
  }
  
  .table-container::-webkit-scrollbar-thumb {
    background: var(--border-secondary);
    border-radius: 4px;
  }
  
  .table-container::-webkit-scrollbar-thumb:hover {
    background: var(--text-muted);
  }
</style>

</head>
<body>
  <div class="toolbar">
    <div class="toolbar-row">
      <div class="controls">
        <button id="resultBtn" class="btn btn-primary">📊 Results</button>
        <div class="control-group">
          <label>Filter:</label>
          <div class="radio-group">
            <label><input type="radio" name="optionFilter" value="ALL" checked /> Nifty 500</label>
            <label><input type="radio" name="optionFilter" value="OPTIONS" /> Options</label>
          </div>
        </div>
        
        <div class="control-group">
          <label for="timeframe">Timeframe:</label>
          <select id="timeframe" onchange="updateSecondaryFilter(); loadTable()">
            <option value="DAILY">Daily</option>
            <option value="WEEKLY">Weekly</option>
            <option value="COMBINE">Combine</option>
            <option value="INTRADAY" selected>Intraday</option>
          </select>
        </div>
        
        <div class="control-group" id="intradayTypeGroup" style="display:none;">
          <label>Intraday Type:</label>
          <div class="radio-group">
            <label><input type="radio" name="intradayType" value="HOURLY"> Hourly</label>
            <label><input type="radio" name="intradayType" value="DAILY"> Daily</label>
          </div>
        </div>
        
        <div class="control-group">
          <label id="secondaryFilterLabel" for="secondaryFilter">Heikin/Psar:</label>
          <select id="secondaryFilter" onchange="loadTable()">
            <option value="ALL">All</option>
            <option value="FIRST BUY">First Buy</option>
            <option value="FIRST SELL">First Sell</option>
          </select>
        </div>
        
        <div class="control-group">
          <button class="btn" onclick="resetTable()">🧹 Reset</button>
        </div>
        
        <div class="control-group">
          <label for="search">Search:</label>
          <input
            type="text"
            id="search"
            placeholder="Filter stocks..."
            onkeyup="filterTable()"
            autocomplete="off"
          />
        </div>
      </div>
      
      <div class="toolbar-actions">
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
      </div>
    </div>
  </div>
  
  <div id="errorMessage" role="alert"></div>
  
  <div class="table-container">
    <table id="stocksTable">
      <thead>
        <tr id="tableHead"></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  
  <div id="pagination"></div>
  
  <div id="loader">
    <div class="spinner"></div>
    <div>Loading stock data...</div>
  </div>
  
  <script>
    // ====== State ======
    let tableData = [],
      filteredData = [],
      visibleKeys = [];
    let sortState = { column: null, order: null };
    let currentPage = 1;
    const rowsPerPage = 10;

    // Persisted intraday type (HOURLY/DAILY)
    let intradayType = localStorage.getItem("intradayType") || "HOURLY";
    
    function updateSecondaryFilter() {
      const tf = document.getElementById("timeframe").value;
      const label = document.getElementById("secondaryFilterLabel");
      const select = document.getElementById("secondaryFilter");
      select.innerHTML = "";
      
      if (tf === "INTRADAY") {
        label.textContent = "Trend:";
        ["ALL", "UP", "DOWN"].forEach((val) => {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = val.charAt(0) + val.slice(1).toLowerCase();
          select.appendChild(opt);
        });
      } else {
        label.textContent = "Heikin/Psar:";
        ["ALL", "FIRST BUY", "FIRST SELL"].forEach((val) => {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = val
            .split(" ")
            .map((w) => w.charAt(0) + w.slice(1).toLowerCase())
            .join(" ");
          select.appendChild(opt);
        });
      }

      const typeGroup = document.getElementById("intradayTypeGroup");
      if (tf === "INTRADAY") {
        typeGroup.style.display = "flex";
        const radios = document.querySelectorAll('input[name="intradayType"]');
        radios.forEach(r => r.checked = (r.value === intradayType));
      } else {
        typeGroup.style.display = "none";
      }
    }
    
    async function loadTable() {
      const timeframe = document.getElementById("timeframe").value;
      const filter = document.getElementById("secondaryFilter").value;
      const selected = document.querySelector(
        'input[name="optionFilter"]:checked'
      ).value;
      const optionFlag = selected === "OPTIONS";
      
      const loader = document.getElementById("loader");
      const errorDiv = document.getElementById("errorMessage");
      
      errorDiv.style.display = "none";
      loader.style.display = "flex";
      
      try {
        let url;
        if (timeframe === "INTRADAY") {
          url = `/api/indicators/flagged?flag=${timeframe}&trendFilter=${encodeURIComponent(
            filter
          )}&optionFlag=${optionFlag}`;
        } else {
          url = `/api/indicators/flagged?flag=${timeframe}&heikinPsarFilter=${encodeURIComponent(
            filter
          )}&optionFlag=${optionFlag}`;
        }
        
        const res = await fetch(url);
        if (!res.ok) throw new Error(await res.text());
        
        let data = await res.json();

        if (timeframe === "INTRADAY") {
          data = data.filter(row => {
            try {
              const t = row.headers?.TYPE?.[0];
              return t === intradayType;
            } catch (e) {
              return false;
            }
          });
        }

        if (!data.length)
          throw new Error("No stock data found for the selected filters.");
          
        visibleKeys = Object.entries(data[0].headers)
          .filter(([_, val]) => val[1])
          .map(([key]) => key);
        
        tableData = data.map((row) => {
          const base = Object.fromEntries(
            visibleKeys.map((k) => [k, row.headers[k] ? row.headers[k][0] : ""])
          );
          if ("exchange" in row.headers) base["exchange"] = row.headers["exchange"][0];
          if ("symbol" in row.headers) base["symbol"] = row.headers["symbol"][0];
          return base;
        });
        
        filteredData = [...tableData];
        currentPage = 1;
        renderTable();
      } catch (err) {
        showError(err.message || "Could not load data.");
        tableData = filteredData = [];
        renderTable();
      } finally {
        loader.style.display = "none";
      }
    }
    
    function getColumnClass(key) {
      const lowerKey = key.toLowerCase();
      if (lowerKey === "name") return "col-name";
      if (lowerKey === "price") return "col-price";
      if (["daily s/r", "daily_sr", "dailysr"].includes(lowerKey)) return "col-dailysr";
      if (lowerKey.includes("sr")) return "sr";
      if (lowerKey.includes("fibo")) return "fibo";
      if (lowerKey.includes("ma") || lowerKey.includes("rsi")) return "ma";
      if (lowerKey.includes("ai")) return "ai";
      if (lowerKey.includes("combine")) return "combine";
      return "";
    }
    
    function filterTable() {
      const keyword = document.getElementById("search").value.toLowerCase();
      filteredData = tableData.filter((row) =>
        visibleKeys.some((k) => (row[k] + "").toLowerCase().includes(keyword))
      );
      currentPage = 1;
      renderTable();
    }
    
    function resetTable() {
      document.getElementById("timeframe").value = "DAILY";
      document.getElementById("secondaryFilter").value = "ALL";
      document.getElementById("search").value = "";
      document.getElementById("errorMessage").style.display = "none";
      currentPage = 1;
      loadTable();
    }
    
    function showError(msg) {
      const errDiv = document.getElementById("errorMessage");
      errDiv.innerText = msg;
      errDiv.style.display = "block";
    }
    
    function formatHeader(key) {
      return key.replace(/[_\s]+/g, " ").replace(/\b\w/g, (l) => l.toUpperCase());
    }
    
    document.getElementById("resultBtn").addEventListener("click", () => {
      window.location.href = "result.html";
    });
    
    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
      localStorage.setItem(
        "theme",
        document.body.classList.contains("dark-mode") ? "dark" : "light"
      );
    }
    
    function renderTable() {
      const head = document.getElementById("tableHead");
      const body = document.getElementById("tableBody");
      head.innerHTML = body.innerHTML = "";
      
      visibleKeys.forEach((key) => {
        const th = document.createElement("th");
        const headerText = document.createElement("div");
        headerText.textContent = formatHeader(key);
        headerText.style.cursor = "pointer";
        headerText.onclick = () => sortTableByColumn(key);
        
        if (sortState.column === key) {
          th.classList.add(sortState.order === "asc" ? "sort-asc" : "sort-desc");
        }
        
        const className = getColumnClass(key);
        if (className) th.classList.add(className);
        
        th.appendChild(headerText);
        head.appendChild(th);
      });
      
      if (!filteredData.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = visibleKeys.length || 1;
        td.textContent = "No records found.";
        td.style.textAlign = "center";
        td.style.padding = "40px";
        td.style.color = "var(--text-muted)";
        td.style.fontStyle = "italic";
        tr.appendChild(td);
        body.appendChild(tr);
        return;
      }
      
      const start = (currentPage - 1) * rowsPerPage;
      const end = currentPage * rowsPerPage;
      
      filteredData.slice(start, end).forEach((row) => {
        const tr = document.createElement("tr");
        
        visibleKeys.forEach((key) => {
          const td = document.createElement("td");
          td.setAttribute("data-label", formatHeader(key));
          
          const className = getColumnClass(key);
          if (className) td.classList.add(className);
          
          td.textContent = row[key];
          
          tr.appendChild(td);
        });
        
        body.appendChild(tr);
      });
      
      renderPagination();
    }
    
    function renderPagination() {
      const totalPages = Math.ceil(filteredData.length / rowsPerPage);
      const container = document.getElementById("pagination");
      container.innerHTML = "";
      
      if (totalPages <= 1) return;
      
      const createLink = (label, page, active = false) => {
        const btn = document.createElement("button");
        btn.textContent = label;
        btn.className = "page-link" + (active ? " active" : "");
        btn.onclick = () => {
          currentPage = page;
          renderTable();
          document.querySelector('.table-container').scrollIntoView({ 
            behavior: 'smooth', 
            block: 'start' 
          });
        };
        return btn;
      };
      
      if (currentPage > 1) {
        container.append(createLink("« First", 1), createLink("‹ Prev", currentPage - 1));
      }
      
      let start = Math.max(1, currentPage - 2);
      let end = Math.min(totalPages, currentPage + 2);
      
      if (currentPage <= 3) end = Math.min(5, totalPages);
      if (currentPage >= totalPages - 2) start = Math.max(totalPages - 4, 1);
      
      if (start > 1) {
        container.append(createLink("1", 1));
        if (start > 2) {
          const span = document.createElement("span");
          span.textContent = "...";
          span.style.margin = "0 8px";
          span.style.color = "var(--text-muted)";
          container.appendChild(span);
        }
      }
      
      for (let i = start; i <= end; i++) {
        container.append(createLink(i, i, i === currentPage));
      }
      
      if (end < totalPages) {
        if (end < totalPages - 1) {
          const span = document.createElement("span");
          span.textContent = "...";
          span.style.margin = "0 8px";
          span.style.color = "var(--text-muted)";
          container.appendChild(span);
        }
        container.append(createLink(totalPages, totalPages));
      }
      
      if (currentPage < totalPages) {
        container.append(createLink("Next ›", currentPage + 1), createLink("Last »", totalPages));
      }
    }
    
    function sortTableByColumn(col) {
      const isAsc = sortState.column === col && sortState.order === "asc";
      sortState = { column: col, order: isAsc ? "desc" : "asc" };
      
      filteredData.sort((a, b) => {
        let valA = a[col] != null ? a[col].toString().trim() : "";
        let valB = b[col] != null ? b[col].toString().trim() : "";
        
        // Handle datetime sorting for "UPDATED AT" and similar columns
        if (col.toUpperCase().includes("UPDATED") || col.toUpperCase().includes("TIME")) {
          const timeA = parseDateTime(valA);
          const timeB = parseDateTime(valB);
          return isAsc ? timeA - timeB : timeB - timeA;
        }
        
        // Handle numeric sorting
        const numA = parseFloat(valA.replace(/[^0-9.\-]/g, ""));
        const numB = parseFloat(valB.replace(/[^0-9.\-]/g, ""));
        
        return !isNaN(numA) && !isNaN(numB)
          ? isAsc ? numA - numB : numB - numA
          : isAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
      });
      
      currentPage = 1;
      renderTable();
    }

    // Helper function for parsing date/time
    function parseDateTime(dateStr) {
      if (!dateStr || dateStr === "") return Infinity;
      
      // Handle DD-MM-YYYY HH:MM:SS format (like 04-12-2025 17:24:44)
      const dateTimeMatch = dateStr.match(/(\d{2})-(\d{2})-(\d{4})\s+(\d{2}):(\d{2}):(\d{2})/);
      if (dateTimeMatch) {
        const [, day, month, year, hour, minute, second] = dateTimeMatch;
        const date = new Date(year, month - 1, day, hour, minute, second);
        return isNaN(date) ? Infinity : date.getTime();
      }
      
      // Fallback to standard Date parsing
      const date = new Date(dateStr);
      return isNaN(date) ? Infinity : date.getTime();
    }
    
    document.addEventListener("DOMContentLoaded", () => {
      const theme = localStorage.getItem("theme");
      if (theme === "dark") document.body.classList.add("dark-mode");
      
      document.querySelectorAll('input[name="optionFilter"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          currentPage = 1;
          loadTable();
        });
      });

      document.querySelectorAll('input[name="intradayType"]').forEach(radio => {
        if (radio.value === intradayType) radio.checked = true;

        radio.addEventListener('change', () => {
          intradayType = radio.value;
          localStorage.setItem('intradayType', intradayType);
          currentPage = 1;
          loadTable();
        });
      });
      
      updateSecondaryFilter();
      loadTable();
    });
  </script>
</body>
</html>
