<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic Algo Trading Dashboard</title>
    <style>
        /* DESIGN SYSTEM VARIABLES */
        :root {
            /* Dark Theme (Default Glass) */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(30, 41, 59, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.03);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.15);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --warning: #f59e0b;
            --card-shadow: rgba(0, 0, 0, 0.3);
        }

        [data-theme="light"] {
            /* Light Theme (Frosty Glass) */
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #dbeafe 100%);
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(15, 23, 42, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.5);
            --text-main: #0f172a;
            --text-muted: #475569;
            --primary: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.2);
            --success: #059669;
            --success-bg: rgba(5, 150, 105, 0.12);
            --danger: #dc2626;
            --danger-bg: rgba(220, 38, 38, 0.12);
            --warning: #d97706;
            --card-shadow: rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.2s ease;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 1rem 1.5rem; /* Tighter body padding */
            font-size: 14px; /* More compact base font */
            min-height: 100vh;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 16px 0 var(--card-shadow);
            border-radius: 8px; /* Tighter borders */
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1rem; padding: 1rem 1.2rem;
        }
        
        .header h2 {
            font-size: 1.2rem;
        }

        .controls-right { display: flex; align-items: center; gap: 0.8rem; }

        .theme-toggle {
            background: var(--glass-highlight); border: 1px solid var(--glass-border);
            color: var(--text-main); padding: 0.4rem 0.8rem; border-radius: 20px;
            cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 0.4rem;
            font-size: 0.8rem;
        }

        .status-indicator {
            display: flex; align-items: center; gap: 0.4rem; font-size: 0.75rem;
            color: var(--text-muted); padding: 0.4rem 0.8rem; border-radius: 20px;
            background: var(--glass-highlight); border: 1px solid var(--glass-border);
        }

        .dot {
            width: 6px; height: 6px; border-radius: 50%; background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
        }
        .dot.paused { background-color: var(--warning); box-shadow: 0 0 8px var(--warning); }

        /* PNL SUMMARY WIDGETS */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }

        .summary-card {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .summary-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .summary-value {
            font-size: 1.4rem; /* Compact value font */
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* TABS */
        .tabs-container {
            display: flex; gap: 0.2rem; margin-bottom: -1px; overflow-x: auto; padding: 0 0.5rem;
        }

        .tab-btn {
            background: var(--glass-bg); backdrop-filter: blur(8px); color: var(--text-muted);
            border: 1px solid var(--glass-border); border-bottom: none;
            padding: 0.6rem 1.2rem; border-radius: 6px 6px 0 0;
            cursor: pointer; font-weight: 600; font-size: 0.8rem; white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary); color: white; border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow); z-index: 2; position: relative;
        }

        /* TABLE */
        .table-container { border-radius: 0 8px 8px 8px; overflow: hidden; }
        .responsive-wrapper { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; white-space: nowrap; }
        th, td { padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--glass-border); } /* Tighter cell padding */
        th { background-color: rgba(0, 0, 0, 0.15); color: var(--text-muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
        [data-theme="light"] th { background-color: rgba(255, 255, 255, 0.3); }

        .badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; }
        .badge.open { background: var(--primary); color: white; box-shadow: 0 0 8px var(--primary-glow); }
        .badge.closed { background: rgba(148, 163, 184, 0.2); color: var(--text-main); }
        .badge.buy { background: var(--success-bg); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge.sell { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        
        .badge.live { background: rgba(59, 130, 246, 0.15); color: var(--primary); border: 1px solid var(--primary); }
        .badge.paper { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); border: 1px dashed var(--text-muted); }

        .pnl-positive { color: var(--success) !important; }
        .pnl-negative { color: var(--danger) !important; }
        
        .time-muted { color: var(--text-muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="glass-panel header">
        <h2>Live Risk Dashboard</h2>
        <div class="controls-right">
            <button class="theme-toggle" onclick="toggleTheme()">
                <span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span>
            </button>
            <div class="status-indicator" id="network-status">
                <div class="dot" id="status-dot"></div>
                <span id="status-text">Synchronizing...</span>
            </div>
        </div>
    </div>

    <!-- PNL SUMMARY CARDS -->
    <div class="summary-grid">
        <div class="glass-panel summary-card">
            <div class="summary-title">🔴 Live Market PnL</div>
            <div class="summary-value" id="live-pnl">₹0.00</div>
        </div>
        <div class="glass-panel summary-card">
            <div class="summary-title">📝 Paper Trading PnL</div>
            <div class="summary-value" id="paper-pnl">₹0.00</div>
        </div>
        <div class="glass-panel summary-card">
            <div class="summary-title">💎 Combined Net PnL</div>
            <div class="summary-value" id="total-pnl">₹0.00</div>
        </div>
    </div>

    <!-- Tabs Navigation -->
    <div class="tabs-container" id="tabs"></div>

    <!-- Table -->
    <div class="glass-panel table-container" id="content">
        <div style="padding: 2rem; text-align: center; color: var(--text-muted);">
            <div style="display:inline-block; width: 16px; height: 16px; border: 2px solid var(--glass-border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-right: 8px; vertical-align: middle;"></div>
            <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
            Allocating interface cache loops...
        </div>
    </div>

    <script>
        const getApiUrl = () => {
            const hostname = window.location.hostname;
            const isLocal = hostname === 'localhost' || hostname === '127.0.0.1' || window.location.protocol === 'file:';
            return `${isLocal ? 'http://localhost:8080' : window.location.origin}/api/orders/orderList`;
        };

        const API_URL = getApiUrl();
        const POLL_INTERVAL_MS = 2000;

        let activeStrategyTab = null; 
        let pollingTimer = null;
        let currentTheme = 'dark';

        function toggleTheme() {
            const body = document.documentElement;
            if (currentTheme === 'dark') {
                body.setAttribute('data-theme', 'light');
                document.getElementById('theme-icon').innerText = '☀️';
                document.getElementById('theme-text').innerText = 'Light';
                currentTheme = 'light';
            } else {
                body.removeAttribute('data-theme');
                document.getElementById('theme-icon').innerText = '🌙';
                document.getElementById('theme-text').innerText = 'Dark';
                currentTheme = 'dark';
            }
        }

        async function fetchOrders() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network fault');
                const data = await response.json();
                
                calculateAndRenderSummaries(data);
                processAndRenderMatrix(data);
                updateNetworkIndicator(true, "Live Sync Engaged");
            } catch (error) {
                updateNetworkIndicator(false, "API Interrupted");
            }
        }

        function calculateAndRenderSummaries(data) {
            let livePnl = 0;
            let paperPnl = 0;

            if (data && data.length > 0) {
                data.forEach(order => {
                    const val = order.pnl || 0;
                    if (order.tradeMode === 'LIVE') {
                        livePnl += val;
                    } else {
                        paperPnl += val;
                    }
                });
            }

            const totalPnl = livePnl + paperPnl;

            const formatCurrency = (val) => {
                const sign = val > 0 ? '+' : '';
                return `${sign}₹${val.toFixed(2)}`;
            };

            const applyColor = (elementId, val) => {
                const el = document.getElementById(elementId);
                el.innerText = formatCurrency(val);
                el.className = `summary-value ${val > 0 ? 'pnl-positive' : (val < 0 ? 'pnl-negative' : '')}`;
            };

            applyColor('live-pnl', livePnl);
            applyColor('paper-pnl', paperPnl);
            applyColor('total-pnl', totalPnl);
        }

        function processAndRenderMatrix(data) {
            if (!data || data.length === 0) {
                document.getElementById('content').innerHTML = `<div style="padding:2rem;text-align:center;font-size:0.85rem;">No executions found.</div>`;
                return;
            }

            const strategiesMap = data.reduce((map, order) => {
                const key = order.strategyName || 'UNNAMED_STRATEGY';
                if (!map[key]) map[key] = [];
                map[key].push(order);
                return map;
            }, {});

            const discoveredStrategies = Object.keys(strategiesMap).sort();

            if (!activeStrategyTab || !discoveredStrategies.includes(activeStrategyTab)) {
                activeStrategyTab = discoveredStrategies[0];
            }

            renderDynamicTabBar(discoveredStrategies);
            renderOperationalTable(strategiesMap[activeStrategyTab]);
        }

        function renderDynamicTabBar(strategyNames) {
            const tabsContainer = document.getElementById('tabs');
            const generatedHtml = strategyNames.map(name => {
                const isSelected = name === activeStrategyTab ? 'active' : '';
                return `<button class="tab-btn ${isSelected}" onclick="changeViewTab('${name}')">${name.replace(/_/g, ' ')}</button>`;
            }).join('');

            if (tabsContainer.innerHTML !== generatedHtml) tabsContainer.innerHTML = generatedHtml;
        }

        window.changeViewTab = function(targetStrategy) {
            activeStrategyTab = targetStrategy;
            fetchOrders(); 
        }

        function renderOperationalTable(orders) {
            const container = document.getElementById('content');
            
            let htmlOutput = `
                <div class="responsive-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Mode</th>
                                <th>Instrument</th>
                                <th>Side</th>
                                <th>Status</th>
                                <th>Entry Time</th>
                                <th>Exit Time</th>
                                <th>Entry Px</th>
                                <th>Exit Px</th>
                                <th>Net PnL (₹)</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            orders.forEach(order => {
                const isProfit = order.pnl > 0;
                const isLoss = order.pnl < 0;
                const pnlClass = isProfit ? 'pnl-positive' : (isLoss ? 'pnl-negative' : '');
                
                const currentStatus = order.status || 'OPEN';
                const statusClass = currentStatus.toUpperCase() === 'OPEN' ? 'open' : 'closed';
                
                const currentDirection = order.direction || 'SELL';
                const sideClass = currentDirection.toUpperCase() === 'BUY' ? 'buy' : 'sell';

                const tMode = order.tradeMode || 'PAPER';
                const modeClass = tMode === 'LIVE' ? 'live' : 'paper';
                
                const signedValue = isProfit ? '+' : '';

                const formatTime = (timeStr) => {
                    if (!timeStr || timeStr === "N/A" || timeStr === "ACTIVE") return timeStr || "-";
                    return timeStr.replace("T", " ").substring(0, 19);
                };

                htmlOutput += `
                    <tr>
                        <td style="color: var(--text-muted); font-size: 0.75rem;">#${order.id}</td>
                        <td><span class="badge ${modeClass}">${tMode}</span></td>
                        <td style="font-weight: 600;">${order.symbol || 'N/A'}</td>
                        <td><span class="badge ${sideClass}">${currentDirection}</span></td>
                        <td><span class="badge ${statusClass}">${currentStatus}</span></td>
                        <td class="time-muted">${formatTime(order.entryTime)}</td>
                        <td class="time-muted">${formatTime(order.exitTime)}</td>
                        <td style="font-variant-numeric: tabular-nums;">${order.entryPrice ? order.entryPrice.toFixed(2) : '-'}</td>
                        <td style="font-variant-numeric: tabular-nums;">${order.exitPrice ? order.exitPrice.toFixed(2) : '-'}</td>
                        <td class="${pnlClass}" style="font-variant-numeric: tabular-nums; font-weight:700;">
                            ${order.pnl != null ? signedValue + order.pnl.toFixed(2) : '0.00'}
                        </td>
                    </tr>
                `;
            });

            htmlOutput += `</tbody></table></div>`;
            container.innerHTML = htmlOutput;
        }

        function updateNetworkIndicator(isActiveState, feedbackMessage) {
            document.getElementById('status-text').innerText = feedbackMessage;
            if (isActiveState) {
                document.getElementById('status-dot').classList.remove('paused');
            } else {
                document.getElementById('status-dot').classList.add('paused');
            }
        }

        function initiateProcessingScheduler() {
            if (pollingTimer) clearInterval(pollingTimer);
            fetchOrders(); 
            pollingTimer = setInterval(fetchOrders, POLL_INTERVAL_MS);
        }

        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                clearInterval(pollingTimer);
                updateNetworkIndicator(false, "Risk Engine Paused");
            } else {
                initiateProcessingScheduler();
            }
        });

        initiateProcessingScheduler();
    </script>
</body>
</html>
