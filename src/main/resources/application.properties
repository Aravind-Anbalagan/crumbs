# File Paths
app.local.resources.path=src/main/resources

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=false
management.health.mail.enabled=false
management.health.diskspace.enabled=false


spring.devtools.restart.additional-paths=src/main/java,src/main/resources
# ============================================================
#  ⚠️  LOCAL RUN — CHANGE THESE VALUES BEFORE RUNNING LOCALLY
#  ⚠️  REVERT BEFORE COMMITTING & PUSHING TO PRODUCTION
# ============================================================

# PROD  → scheduler.enabled=true
# LOCAL → scheduler.enabled=false
scheduling.enabled=true

# PROD  → spring.devtools.restart.enabled=false
# LOCAL → spring.devtools.restart.enabled=true
spring.devtools.restart.enabled=true