# ============================================================
#  CRUMBS TRADING APP — APPLICATION CONFIGURATION
#  ⚠️  PRODUCTION values are set by default
#  ⚠️  Scroll to bottom to change values for LOCAL run
# ============================================================

# Application
spring.application.name=crumbs_new
server.port=${PORT:8080}
server.address=0.0.0.0
app.max-threads=5
spring.main.allow-circular-references=true
spring.main.banner-mode=off
spring.web.resources.add-mappings=true
server.forward-headers-strategy=framework
app.data.path=/app/data
# Logging
logging.config=classpath:logback-spring.xml
logging.level.root=INFO
logging.level.com.crumbs.trade=DEBUG

# Database — Supabase PostgreSQL
#spring.datasource.url=jdbc:postgresql://autorack.proxy.rlwy.net:33219/railway?sslmode=require
#spring.datasource.username=123postgres123
#spring.datasource.password=**A*soBVJqDyYBNcMByuszpvciaWdTGEsFIg**A
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.connection-init-sql=SET statement_timeout TO '30s'

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

